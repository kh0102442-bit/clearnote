<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — لوحة التحكم</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* تصميم مخصص للوحة التحكم */
  .admin-navbar {
    background: var(--navy); color: white; padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .admin-brand { font-family: Georgia, serif; font-size: 22px; font-weight: bold; }
  .admin-brand span { color: var(--accent); }
  
  .container { padding: 20px; max-width: 800px; margin: 0 auto; }

  /* كروت التصنيفات */
  .node-card {
    background: white; border: 2px solid var(--border); border-radius: 16px;
    margin-bottom: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
  }
  .node-header {
    padding: 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .node-info { display: flex; align-items: center; gap: 15px; flex: 1; }
  .node-icon {
    width: 50px; height: 50px; border-radius: 12px; background: #f1f5f9;
    display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--navy);
  }
  .node-title { font-weight: 800; font-size: 18px; color: var(--navy); }
  .node-type { font-size: 13px; font-weight: bold; color: var(--accent); }

  .node-actions { display: flex; gap: 8px; }
  .btn-icon {
    width: 45px; height: 45px; border-radius: 10px; background: #f8fafc;
    border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: 18px; padding: 0;
  }
  .btn-icon.manage { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .btn-icon.danger { background: #fef2f2; color: #dc2626; border-color: #fecaca; }

  .children-area { display: none; padding: 15px; background: #f8fafc; border-top: 2px solid var(--border); }
  .children-area.active { display: block; }

  /* المودال (النافذة) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: flex-end; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: white; width: 100%; border-radius: 24px 24px 0 0; padding: 25px;
    max-height: 90dvh; overflow-y: auto; animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-box h3 { margin: 0 0 20px; color: var(--navy); font-size: 22px; text-align: center; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-weight: 800; color: var(--navy); font-size: 16px; }
  
  .modal-actions { display: flex; gap: 12px; margin-top: 25px; }
  .btn-save { flex: 1; background: var(--navy); color: white; }
  .btn-cancel { flex: 1; background: #e2e8f0; color: var(--navy); }

  /* أزرار الموديولات (الشرح، فيديو...) */
  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  .module-item { background: #f8fafc; border: 2px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .module-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: white; }
  .module-title { font-weight: 800; color: var(--navy); font-size: 16px; }
  
  .icon-explain { background: #10b981; }
  .icon-video { background: #ef4444; }
  .icon-questions { background: #3b82f6; }
  .icon-summary { background: #8b5cf6; }
  .icon-terms { background: #f59e0b; }
</style>
</head>
<body style="background: var(--bg);">

<div class="admin-navbar">
  <div class="admin-brand">CLEAR<span>NOTE</span></div>
  <button class="btn-primary" style="width:auto; padding: 10px 20px; margin:0; font-size:16px;" onclick="openAddModal(null, 'root')"><i class="fas fa-plus"></i> سنة</button>
  <button class="btn-icon danger" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
</div>

<div class="container">
  <div id="treeContainer"></div>
</div>

<!-- مودال الإضافة الأساسي -->
<div class="modal-overlay" id="nodeModal">
  <div class="modal-box">
    <h3 id="modalTitle">إضافة</h3>
    <input type="hidden" id="nodeParentId">
    <input type="hidden" id="nodeType">
    <div class="form-group">
      <label>العنوان</label>
      <input type="text" id="nodeTitle" placeholder="اكتب هنا...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('nodeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveNode()">حفظ</button>
    </div>
  </div>
</div>

<!-- مودال إدارة الأجزاء -->
<div class="modal-overlay" id="manageModal">
  <div class="modal-box">
    <h3>إدارة المحتوى</h3>
    <div class="modules-grid">
      <div class="module-item" onclick="openCodeEditor('explain', 'الشرح')"><div class="module-icon icon-explain"><i class="fas fa-file-alt"></i></div><div class="module-title">الشرح</div></div>
      <div class="module-item" onclick="openCodeEditor('video', 'فيديو')"><div class="module-icon icon-video"><i class="fas fa-video"></i></div><div class="module-title">فيديو</div></div>
      <div class="module-item" onclick="openCodeEditor('questions', 'أسئلة')"><div class="module-icon icon-questions"><i class="fas fa-question-circle"></i></div><div class="module-title">أسئلة</div></div>
      <div class="module-item" onclick="openCodeEditor('summary', 'ملخص')"><div class="module-icon icon-summary"><i class="fas fa-clipboard-list"></i></div><div class="module-title">ملخص</div></div>
      <div class="module-item" onclick="openCodeEditor('terms', 'مصطلحات')"><div class="module-icon icon-terms"><i class="fas fa-book"></i></div><div class="module-title">مصطلحات</div></div>
    </div>
    <button class="btn-cancel" style="width:100%;" onclick="closeModal('manageModal')">إغلاق</button>
  </div>
</div>

<!-- مودال الكود -->
<div class="modal-overlay" id="codeModal">
  <div class="modal-box">
    <h3 id="codeTitle">إضافة</h3>
    <input type="hidden" id="currentNodeId">
    <input type="hidden" id="currentModuleKey">
    
    <div class="form-group"><label>العنوان</label><input type="text" id="moduleTitleInput"></div>
    <div class="form-group"><label>الوصف</label><input type="text" id="moduleDescInput"></div>
    <div class="form-group"><label>المصادر</label><input type="text" id="moduleSourcesInput"></div>
    <div class="form-group"><label>الصلاحية</label><select id="moduleAccessInput"><option value="public">عام</option><option value="paid">مدفوع</option></select></div>
    <div class="form-group"><label>كود HTML</label><textarea id="moduleCode" rows="5" style="font-family: monospace;"></textarea></div>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('codeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveModuleCode()">حفظ</button>
    </div>
  </div>
</div>

<script type="module">
import { db, onAuth, isAdmin, goTo, showToast, signOutUser } from "./shared.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let treeData = [];
const NODE_TYPES = {
  year: { label: 'سنة', icon: 'fa-calendar-alt' }, program: { label: 'برنامج', icon: 'fa-graduation-cap' },
  subject: { label: 'مادة', icon: 'fa-book' }, custom: { label: 'تبويب', icon: 'fa-folder' },
  module_explain: { label: 'شرح', icon: 'fa-file-alt' }, module_video: { label: 'فيديو', icon: 'fa-video' },
  module_questions: { label: 'أسئلة', icon: 'fa-question-circle' }, module_summary: { label: 'ملخص', icon: 'fa-clipboard-list' },
  module_terms: { label: 'مصطلحات', icon: 'fa-book' }
};

onAuth((user, data) => { if (!user || !isAdmin(data)) { goTo("index.html"); return; } loadTree(); });
window.doLogout = async () => { await signOutUser(); goTo("index.html"); };

async function loadTree() {
  const snap = await getDocs(collection(db, "content_tree"));
  treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderTree();
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  const roots = treeData.filter(n => n.parentId === "root");
  container.innerHTML = roots.length ? buildHTML(roots) : `<p style="text-align:center; font-size:18px; color:var(--muted); padding:30px;">لا يوجد محتوى.</p>`;
}

function buildHTML(nodes) {
  let html = "";
  nodes.sort((a, b) => (a.type.startsWith('module_') ? -1 : 1)).forEach(node => {
    const children = treeData.filter(n => n.parentId === node.id);
    const info = NODE_TYPES[node.type] || NODE_TYPES.custom;
    const isModule = node.type.startsWith('module_');
    
    let actions = isModule 
      ? `<button class="btn-icon" onclick="editModule('${node.id}')"><i class="fas fa-edit"></i></button><button class="btn-icon danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>`
      : `<button class="btn-icon manage" onclick="openManage('${node.id}')"><i class="fas fa-cog"></i></button><button class="btn-icon" onclick="openAddModal('${node.id}', '${node.type}')"><i class="fas fa-plus"></i></button><button class="btn-icon danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>`;

    html += `
      <div class="node-card">
        <div class="node-header">
          <div class="node-info" onclick="toggle('${node.id}')">
            <div class="node-icon"><i class="fas ${info.icon}"></i></div>
            <div><div class="node-title">${node.title}</div><div class="node-type">${info.label}</div></div>
          </div>
          <div class="node-actions">${actions}</div>
        </div>
        ${!isModule ? `<div class="children-area" id="children-${node.id}">${children.length ? buildHTML(children) : '<div style="text-align:center; color:#aaa;">لا يوجد فروع</div>'}</div>` : ''}
      </div>
    `;
  });
  return html;
}

window.toggle = (id) => document.getElementById(`children-${id}`)?.classList.toggle('active');
window.closeModal = (id) => document.getElementById(id).classList.remove('active');
window.openAddModal = (pId, pType) => {
  let t = pType === 'root' ? 'year' : pType === 'year' ? 'program' : pType === 'program' ? 'subject' : 'custom';
  document.getElementById("modalTitle").textContent = "إضافة " + (NODE_TYPES[t]?.label || 'عنصر');
  document.getElementById("nodeParentId").value = pId || "root";
  document.getElementById("nodeType").value = t;
  document.getElementById("nodeTitle").value = "";
  document.getElementById("nodeModal").classList.add("active");
};
window.saveNode = async () => {
  const title = document.getElementById("nodeTitle").value.trim();
  if (!title) return showToast("أدخل العنوان", "error");
  await addDoc(collection(db, "content_tree"), { parentId: document.getElementById("nodeParentId").value, type: document.getElementById("nodeType").value, title, createdAt: serverTimestamp() });
  closeModal('nodeModal'); loadTree(); showToast("تمت الإضافة");
};
window.openManage = (id) => { document.getElementById("manageModal").dataset.currentNodeId = id; document.getElementById("manageModal").classList.add("active"); };
window.openCodeEditor = (key, title) => {
  const nId = document.getElementById("manageModal").dataset.currentNodeId;
  const ex = treeData.find(n => n.parentId === nId && n.type === 'module_' + key);
  document.getElementById("codeTitle").textContent = "إعداد " + title;
  document.getElementById("currentNodeId").value = nId; document.getElementById("currentModuleKey").value = key;
  document.getElementById("moduleTitleInput").value = ex ? ex.title : title;
  document.getElementById("moduleDescInput").value = ex ? (ex.description || '') : '';
  document.getElementById("moduleSourcesInput").value = ex ? (ex.sources || '') : '';
  document.getElementById("moduleAccessInput").value = ex ? (ex.access || 'public') : 'public';
  document.getElementById("moduleCode").value = ex ? (ex.htmlContent || '') : '';
  closeModal('manageModal'); document.getElementById("codeModal").classList.add("active");
};
window.saveModuleCode = async () => {
  const nId = document.getElementById("currentNodeId").value;
  const key = document.getElementById("currentModuleKey").value;
  const ex = treeData.find(n => n.parentId === nId && n.type === 'module_' + key);
  const data = { title: document.getElementById("moduleTitleInput").value.trim(), description: document.getElementById("moduleDescInput").value.trim(), sources: document.getElementById("moduleSourcesInput").value.trim(), access: document.getElementById("moduleAccessInput").value, htmlContent: document.getElementById("moduleCode").value };
  if (ex) { await updateDoc(doc(db, "content_tree", ex.id), data); } 
  else { data.parentId = nId; data.type = 'module_' + key; data.createdAt = serverTimestamp(); await addDoc(collection(db, "content_tree"), data); }
  closeModal('codeModal'); loadTree(); showToast("تم الحفظ");
};
window.editModule = (id) => {
  const n = treeData.find(x => x.id === id);
  document.getElementById("codeTitle").textContent = "تعديل " + n.title;
  document.getElementById("currentNodeId").value = n.parentId; document.getElementById("currentModuleKey").value = n.type.replace('module_', '');
  document.getElementById("moduleTitleInput").value = n.title; document.getElementById("moduleDescInput").value = n.description || '';
  document.getElementById("moduleSourcesInput").value = n.sources || ''; document.getElementById("moduleAccessInput").value = n.access || 'public';
  document.getElementById("moduleCode").value = n.htmlContent || ''; document.getElementById("codeModal").classList.add("active");
};
window.deleteNode = async (id) => { if (treeData.some(n => n.parentId === id)) return showToast("احذف الفروع أولاً", "error"); if (confirm("حذف؟")) { await deleteDoc(doc(db, "content_tree", id)); loadTree(); } };
</script>
</body>
</html>
