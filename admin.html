<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClearNote — الإدارة</title>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- الترويسة -->
<header class="admin-header">
  <div class="admin-logo">CLEAR<span>NOTE</span></div>
  <div class="header-actions">
    <button class="btn-icon-header" onclick="doLogout()" title="خروج"><i class="fas fa-sign-out-alt" style="color:#dc3545;"></i></button>
  </div>
</header>

<!-- المحتوى الرئيسي -->
<main class="main-content">
  
  <!-- قسم الشجرة -->
  <div id="view-content">
    <div class="section-header">
      <h2 class="section-title">المحتوى</h2>
      <button class="btn-add" onclick="openDrawer('root', 'year')"><i class="fas fa-plus"></i> سنة دراسية</button>
    </div>

    <!-- صندوق الأدوات -->
    <div class="toolbox-container">
      <div class="toolbox-title"><i class="fas fa-toolbox"></i> صندوق الأدوات (اسحب الأداة تحت المحاضرة)</div>
      <div class="toolbox-scroll">
        <div class="tool-item" style="color:#2a4b8d; background:#eef2fa;"><i class="fas fa-file-alt"></i> الشرح</div>
        <div class="tool-item" style="color:#8b1f1f; background:#fbeaea;"><i class="fas fa-video"></i> فيديو</div>
        <div class="tool-item" style="color:#1c5a3c; background:#e8f3ed;"><i class="fas fa-question-circle"></i> أسئلة</div>
        <div class="tool-item" style="color:#8a6218; background:#f4eee2;"><i class="fas fa-clipboard-list"></i> ملخص</div>
        <div class="tool-item" style="color:#5a2c7a; background:#efe8f5;"><i class="fas fa-book"></i> مصطلحات</div>
        <div class="tool-item" style="color:#006064; background:#e0f7fa;"><i class="fas fa-check-double"></i> اختبار شامل</div>
      </div>
    </div>

    <!-- الشجرة -->
    <div id="treeContainer" class="tree-list">
      <p style="text-align:center; color:var(--muted);">جاري تحميل الشجرة...</p>
    </div>
  </div>

  <!-- قسم الطلاب -->
  <div id="view-students" style="display:none;">
    <div class="section-header"><h2 class="section-title">الطلاب</h2></div>
    <div class="tree-card"><p style="text-align:center; color:var(--muted); padding:20px;">قريباً...</p></div>
  </div>

  <!-- قسم الإعدادات -->
  <div id="view-settings" style="display:none;">
    <div class="section-header"><h2 class="section-title">الإعدادات</h2></div>
    <div class="tree-card"><p style="text-align:center; color:var(--muted); padding:20px;">قريباً...</p></div>
  </div>

</main>

<!-- الشريط السفلي للموبايل -->
<nav class="mobile-nav">
  <button class="nav-btn active" id="nav-content" onclick="switchTab('content')">
    <i class="fas fa-layer-group"></i> المحتوى
  </button>
  <button class="nav-btn" id="nav-students" onclick="switchTab('students')">
    <i class="fas fa-users"></i> الطلاب
  </button>
  <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
    <i class="fas fa-cog"></i> الإعدادات
  </button>
</nav>

<!-- الدرج (Drawer) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer-panel" id="drawerPanel">
  <div class="drawer-header">
    <h3 id="drawerTitle">إضافة عنصر</h3>
    <button class="btn-close" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-content">
    <div class="input-group">
      <label>العنوان</label>
      <input type="text" id="inputTitle" placeholder="أدخل العنوان هنا...">
    </div>
    <div class="input-group">
      <label>الوصف (اختياري)</label>
      <input type="text" id="inputDesc" placeholder="وصف قصير...">
    </div>
    <div class="input-group">
      <label>المصادر (هام جداً)</label>
      <textarea id="inputSources" rows="2" placeholder="من أين تم إعداد هذا المحتوى؟"></textarea>
    </div>
    <div class="input-group" id="contentCodeGroup" style="display:none;">
      <label>كود HTML</label>
      <textarea id="inputCode" rows="5" style="font-family:monospace;"></textarea>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn-cancel" onclick="closeDrawer()">إلغاء</button>
    <button class="btn-save" onclick="saveNode()">حفظ</button>
  </div>
</div>

<script type="module">
import { db, onAuth, isAdmin, goTo, showToast, signOutUser } from "./shared.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let treeData = [];
let currentEditId = null;
let currentParentId = "root";
let currentType = "year";

const TYPES = {
  year: { label: 'سنة دراسية', icon: 'fa-calendar-alt' },
  program: { label: 'برنامج', icon: 'fa-graduation-cap' },
  subject: { label: 'مادة', icon: 'fa-book' },
  lecture: { label: 'محاضرة/سكشن', icon: 'fa-chalkboard-teacher' },
  content: { label: 'محتوى', icon: 'fa-file-alt' },
  custom: { label: 'تبويب مخصص', icon: 'fa-folder' }
};

onAuth((user, userData) => {
  if (!user || !isAdmin(userData)) { goTo("index.html"); return; }
  loadTree();
});

window.doLogout = async () => { await signOutUser(); goTo("index.html"); };

window.switchTab = function(tab) {
  document.querySelectorAll('.main-content > div').forEach(d => d.style.display = 'none');
  document.getElementById('view-' + tab).style.display = 'block';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
};

async function loadTree() {
  try {
    const snap = await getDocs(collection(db, "content_tree"));
    treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTree();
  } catch (e) {
    document.getElementById("treeContainer").innerHTML = `<p style="color:red;">خطأ: ${e.message}</p>`;
  }
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  const rootNodes = treeData.filter(n => n.parentId === "root");
  if (rootNodes.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--muted); padding:20px;">لا يوجد محتوى.</p>`;
    return;
  }
  container.innerHTML = buildHTML(rootNodes);
}

function buildHTML(nodes) {
  let html = "";
  nodes.forEach(node => {
    const children = treeData.filter(n => n.parentId === node.id);
    const typeInfo = TYPES[node.type] || TYPES.custom;

    html += `
      <div class="tree-card">
        <div class="card-top">
          <div class="card-info">
            <div style="display:flex; align-items:center; gap:8px;">
              <i class="fas ${typeInfo.icon}" style="color:var(--accent); font-size:18px;"></i>
              <h3 class="card-title">${node.title}</h3>
            </div>
            <span class="card-badge">${typeInfo.label}</span>
          </div>
          <div class="card-actions">
            <button class="btn-action" onclick="openDrawer('${node.id}', 'custom')" title="إضافة"><i class="fas fa-plus"></i></button>
            <button class="btn-action" onclick="editNode('${node.id}')" title="تعديل"><i class="fas fa-edit"></i></button>
            ${node.type !== 'content' && node.type !== 'lecture' ? `<button class="btn-action danger" onclick="deleteNode('${node.id}')" title="حذف"><i class="fas fa-trash"></i></button>` : ''}
          </div>
        </div>
        ${children.length > 0 ? `<div class="nested-container">${buildHTML(children)}</div>` : ''}
      </div>
    `;
  });
  return html;
}

window.openDrawer = function(parentId, type) {
  currentEditId = null;
  currentParentId = parentId;
  currentType = type;
  
  document.getElementById('drawerTitle').textContent = `إضافة ${TYPES[type]?.label || 'عنصر'}`;
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputDesc').value = '';
  document.getElementById('inputSources').value = '';
  document.getElementById('inputCode').value = '';
  document.getElementById('contentCodeGroup').style.display = (type === 'content') ? 'block' : 'none';
  
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerPanel').classList.add('open');
};

window.editNode = function(id) {
  const node = treeData.find(n => n.id === id);
  if(!node) return;
  
  currentEditId = id;
  currentParentId = node.parentId;
  currentType = node.type;
  
  document.getElementById('drawerTitle').textContent = `تعديل: ${node.title}`;
  document.getElementById('inputTitle').value = node.title;
  document.getElementById('inputDesc').value = node.desc || '';
  document.getElementById('inputSources').value = node.sources || '';
  document.getElementById('inputCode').value = node.htmlContent || '';
  document.getElementById('contentCodeGroup').style.display = (node.type === 'content') ? 'block' : 'none';
  
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerPanel').classList.add('open');
};

window.closeDrawer = function() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawerPanel').classList.remove('open');
};

window.saveNode = async function() {
  const title = document.getElementById('inputTitle').value.trim();
  if (!title) { showToast("أدخل العنوان", "error"); return; }
  
  const data = {
    parentId: currentParentId,
    type: currentType,
    title: title,
    desc: document.getElementById('inputDesc').value.trim(),
    sources: document.getElementById('inputSources').value.trim(),
    updatedAt: serverTimestamp()
  };
  
  if (currentType === 'content') data.htmlContent = document.getElementById('inputCode').value;

  try {
    if (currentEditId) {
      await updateDoc(doc(db, "content_tree", currentEditId), data);
      showToast("تم التعديل");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "content_tree"), data);
      showToast("تمت الإضافة");
    }
    closeDrawer();
    loadTree();
  } catch (e) {
    showToast("خطأ: " + e.message, "error");
  }
};

window.deleteNode = async function(id) {
  if (treeData.some(n => n.parentId === id)) {
    showToast("احذف الفروع أولاً!", "error");
    return;
  }
  if (!confirm("تأكيد الحذف؟")) return;
  try {
    await deleteDoc(doc(db, "content_tree", id));
    showToast("تم الحذف");
    loadTree();
  } catch (e) {
    showToast("خطأ", "error");
  }
};
</script>
</body>
</html>
