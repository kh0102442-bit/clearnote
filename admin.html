<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — لوحة التحكم</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* === تثبيت التصميم للموبايل === */
  :root {
    --navy: #152741; --accent: #a8741a; --bg: #f4f6f8;
    --white: #ffffff; --text: #1a1a1a; --muted: #5b6472; --line: #e9ecef;
  }
  
  /* منع أي حركة أفقية أو تكبير */
  html, body {
    max-width: 100vw;
    overflow-x: hidden;
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: 30px;
  }

  /* === الهيدر === */
  .admin-header {
    background: var(--navy); color: white; padding: 15px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    width: 100%; box-sizing: border-box;
  }
  .admin-brand { font-family: Georgia, serif; font-size: 18px; font-weight: bold; }
  .admin-brand span { color: var(--accent); }
  
  .btn-add-main { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px; }
  .btn-logout { background: rgba(255,255,255,0.1); color: white; border: none; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

  /* === الحاوية === */
  .admin-container { padding: 15px; width: 100%; box-sizing: border-box; }

  /* === شجرة المحتوى (تصميم الكروت المسطحة) === */
  .tree-group { margin-bottom: 10px; width: 100%; box-sizing: border-box; }
  
  .node-card {
    background: var(--white); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02); width: 100%; box-sizing: border-box;
    margin-bottom: 8px; overflow: hidden;
  }
  
  .node-header {
    padding: 12px; display: flex; justify-content: space-between; align-items: center;
    background: var(--white); box-sizing: border-box;
  }
  
  .node-title-area { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .node-icon { width: 36px; height: 36px; border-radius: 8px; background: #eef2fa; color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .node-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .node-title { font-weight: 700; color: var(--navy); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-type { font-size: 11px; color: var(--accent); font-weight: 600; }

  .node-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .action-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line);
    background: #f8f9fa; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .action-btn:active { background: var(--navy); color: #fff; }
  .action-btn.manage { color: #1f6b45; border-color: #c9d6ee; background: #eef2fa; }
  .action-btn.danger { color: #b91c1c; background: #fbeaea; border-color: #fbeaea; }

  /* التفرعات (بدون هوامش كبيرة عشان تاخد الشاشة كلها) */
  .children-area {
    display: none; padding: 8px; background: #fafbfc;
    border-top: 1px solid var(--line);
  }
  .children-area.active { display: block; }
  
  /* خلفية للأبناء عشان نفرق بينهم وبين الأب */
  .children-area .node-card { border-right: 3px solid var(--accent); }

  /* === المودال (النافذة المنبثقة) === */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  
  .modal-box {
    background: var(--white); border-radius: 20px 20px 0 0; width: 100%;
    padding: 20px; max-height: 90vh; overflow-y: auto;
    box-sizing: border-box; animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-box h3 { margin: 0 0 10px; color: var(--navy); font-size: 18px; text-align: center; }
  .modal-box p { margin: 0 0 15px; color: var(--muted); font-size: 13px; text-align: center; }
  
  .form-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
  .form-group label { display: block; font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 15px; box-sizing: border-box; background: #fafbfc;
  }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--navy); }
  
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save { flex: 1; background: var(--navy); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; }
  .btn-cancel { flex: 1; background: #e9ecef; color: var(--muted); border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; }

  /* === شاشة إدارة المحتوى (الـ 5 أجزاء) === */
  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .module-item {
    background: #f8f9fa; border: 1px solid var(--line); border-radius: 10px;
    padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .module-item:active { background: #eef2fa; border-color: var(--navy); }
  .module-icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff;
  }
  .module-title { font-size: 13px; font-weight: 700; color: var(--navy); }
  
  .icon-explain { background: #27ae60; }
  .icon-video { background: #e74c3c; }
  .icon-questions { background: #3498db; }
  .icon-summary { background: #9b59b6; }
  .icon-terms { background: #e67e22; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="admin-header">
  <div class="admin-brand">CLEAR<span>NOTE</span></div>
  <div style="display:flex; gap:8px;">
    <button class="btn-add-main" onclick="openAddModal(null, 'root')"><i class="fas fa-plus"></i> سنة</button>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
  </div>
</div>

<div class="admin-container">
  <div id="treeContainer">
    <p style="text-align:center; color:var(--muted); padding: 20px;">جاري التحميل...</p>
  </div>
</div>

<!-- مودال الإضافة والتعديل -->
<div class="modal-overlay" id="nodeModal">
  <div class="modal-box">
    <h3 id="modalTitle">إضافة</h3>
    <p id="modalDesc"></p>
    <input type="hidden" id="nodeParentId">
    <input type="hidden" id="nodeType">
    
    <div class="form-group" id="titleGroup">
      <label>العنوان</label>
      <input type="text" id="nodeTitle" placeholder="اكتب هنا...">
    </div>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('nodeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveNode()">حفظ</button>
    </div>
  </div>
</div>

<!-- مودال إدارة المحتوى (الـ 5 أجزاء الثابتة) -->
<div class="modal-overlay" id="manageModal">
  <div class="modal-box">
    <h3 id="manageTitle">إدارة محتوى: ...</h3>
    <p>اختر الجزء الذي تريد إضافة كود HTML له:</p>
    
    <div class="modules-grid">
      <div class="module-item" onclick="openCodeEditor('explain', 'الشرح')">
        <div class="module-icon icon-explain"><i class="fas fa-file-alt"></i></div>
        <div class="module-title">الشرح</div>
      </div>
      <div class="module-item" onclick="openCodeEditor('video', 'فيديو')">
        <div class="module-icon icon-video"><i class="fas fa-video"></i></div>
        <div class="module-title">فيديو</div>
      </div>
      <div class="module-item" onclick="openCodeEditor('questions', 'أسئلة')">
        <div class="module-icon icon-questions"><i class="fas fa-question-circle"></i></div>
        <div class="module-title">أسئلة</div>
      </div>
      <div class="module-item" onclick="openCodeEditor('summary', 'ملخص')">
        <div class="module-icon icon-summary"><i class="fas fa-clipboard-list"></i></div>
        <div class="module-title">ملخص</div>
      </div>
      <div class="module-item" onclick="openCodeEditor('terms', 'مصطلحات')">
        <div class="module-icon icon-terms"><i class="fas fa-book"></i></div>
        <div class="module-title">مصطلحات</div>
      </div>
    </div>
    
    <button class="btn-cancel" style="width:100%;" onclick="closeModal('manageModal')">إغلاق</button>
  </div>
</div>

<!-- مودال كتابة الكود (HTML) -->
<div class="modal-overlay" id="codeModal">
  <div class="modal-box">
    <h3 id="codeTitle">إضافة كود</h3>
    <p>ألصق كود الـ HTML هنا ليظهر للطلاب.</p>
    <input type="hidden" id="currentNodeId">
    <input type="hidden" id="currentModuleKey">
    
    <div class="form-group">
      <textarea id="moduleCode" rows="8" style="font-family: monospace;" placeholder="<h1>مرحباً</h1>"></textarea>
    </div>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('codeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveModuleCode()">حفظ الكود</button>
    </div>
  </div>
</div>

<script type="module">
import { db, onAuth, isAdmin, goTo, showToast, signOutUser } from "./shared.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let treeData = [];
const NODE_TYPES = {
  year:    { label: 'سنة دراسية',  icon: 'fa-calendar-alt' },
  program: { label: 'برنامج',       icon: 'fa-graduation-cap' },
  subject: { label: 'مادة',         icon: 'fa-book' },
  custom:  { label: 'تبويب مخصص',  icon: 'fa-folder' }
};

onAuth((user, userData) => {
  if (!user || !isAdmin(userData)) { goTo("index.html"); return; }
  loadTree();
});

window.doLogout = async () => { await signOutUser(); goTo("index.html"); };

async function loadTree() {
  try {
    const snap = await getDocs(collection(db, "content_tree"));
    treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTree();
  } catch (e) {
    document.getElementById("treeContainer").innerHTML = `<p style="color:red;">خطأ: ${e.message}</p>`;
  }
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  const rootNodes = treeData.filter(n => n.parentId === "root");
  
  if (rootNodes.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--muted); padding: 20px;">لا يوجد محتوى بعد. أضف سنة دراسية للبدء.</p>`;
    return;
  }
  container.innerHTML = buildHTML(rootNodes);
}

function buildHTML(nodes) {
  let html = "";
  nodes.forEach(node => {
    const children = treeData.filter(n => n.parentId === node.id);
    const typeInfo = NODE_TYPES[node.type] || NODE_TYPES.custom;
    
    html += `
      <div class="tree-group">
        <div class="node-card">
          <div class="node-header">
            <div class="node-title-area" onclick="toggleChildren('${node.id}')">
              <div class="node-icon"><i class="fas ${typeInfo.icon}"></i></div>
              <div class="node-text">
                <div class="node-title">${node.title}</div>
                <div class="node-type">${typeInfo.label}</div>
              </div>
            </div>
            <div class="node-actions">
              <button class="action-btn manage" onclick="openManage('${node.id}', '${node.title}')" title="إدارة المحتوى"><i class="fas fa-cog"></i></button>
              <button class="action-btn" onclick="openAddModal('${node.id}', '${node.type}')" title="إضافة فرع"><i class="fas fa-plus"></i></button>
              <button class="action-btn danger" onclick="deleteNode('${node.id}')" title="حذف"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          
          <div class="children-area" id="children-${node.id}">
            ${children.length > 0 ? buildHTML(children) : '<div style="text-align:center; color:#aaa; font-size:12px;">لا يوجد فروع</div>'}
          </div>
        </div>
      </div>
    `;
  });
  return html;
}

window.toggleChildren = function(id) {
  const el = document.getElementById(`children-${id}`);
  if (el) el.classList.toggle('active');
};

// === إضافة فروع ===
window.openAddModal = function(parentId, parentType) {
  let newType = "custom"; let title = "إضافة تبويب فرعي"; let desc = "";
  
  if (parentType === 'root') { newType = 'year'; title = "إضافة سنة"; desc = "مثل: الفرقة الأولى"; }
  else if (parentType === 'year') { newType = 'program'; title = "إضافة برنامج"; desc = "مثل: برنامج عام"; }
  else if (parentType === 'program') { newType = 'subject'; title = "إضافة مادة"; desc = "مثل: Anatomy"; }
  
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalDesc").textContent = desc;
  document.getElementById("nodeParentId").value = parentId || "root";
  document.getElementById("nodeType").value = newType;
  document.getElementById("nodeTitle").value = "";
  document.getElementById("nodeModal").classList.add("active");
};

window.saveNode = async function() {
  const parentId = document.getElementById("nodeParentId").value;
  const type = document.getElementById("nodeType").value;
  const title = document.getElementById("nodeTitle").value.trim();
  
  if (!title) { showToast("أدخل العنوان", "error"); return; }
  const data = { parentId, type, title, updatedAt: serverTimestamp(), createdAt: serverTimestamp() };

  try {
    await addDoc(collection(db, "content_tree"), data);
    showToast("تمت الإضافة");
    closeModal('nodeModal');
    loadTree();
  } catch (e) { showToast("خطأ: " + e.message, "error"); }
};

// === إدارة المحتوى (الـ 5 أجزاء) ===
window.openManage = function(nodeId, nodeTitle) {
  document.getElementById("manageTitle").textContent = `إدارة: ${nodeTitle}`;
  document.getElementById("manageModal").dataset.currentNodeId = nodeId;
  document.getElementById("manageModal").classList.add("active");
};

window.openCodeEditor = function(moduleKey, moduleName) {
  const nodeId = document.getElementById("manageModal").dataset.currentNodeId;
  document.getElementById("codeTitle").textContent = `إضافة ${moduleName}`;
  document.getElementById("currentNodeId").value = nodeId;
  document.getElementById("currentModuleKey").value = moduleKey;
  document.getElementById("moduleCode").value = "";
  
  // نجيب الكود القديم لو موجود
  const node = treeData.find(n => n.id === nodeId);
  if (node && node.modules && node.modules[moduleKey]) {
    document.getElementById("moduleCode").value = node.modules[moduleKey];
  }

  closeModal('manageModal');
  document.getElementById("codeModal").classList.add("active");
};

window.saveModuleCode = async function() {
  const nodeId = document.getElementById("currentNodeId").value;
  const moduleKey = document.getElementById("currentModuleKey").value;
  const code = document.getElementById("moduleCode").value;

  try {
    const nodeRef = doc(db, "content_tree", nodeId);
    const nodeSnap = await getDoc(nodeRef);
    let modules = nodeSnap.data().modules || {};
    modules[moduleKey] = code;

    await updateDoc(nodeRef, { modules });
    showToast("تم حفظ المحتوى بنجاح");
    closeModal('codeModal');
    loadTree();
  } catch (e) {
    showToast("خطأ في الحفظ: " + e.message, "error");
  }
};

window.deleteNode = async function(id) {
  if (treeData.some(n => n.parentId === id)) { showToast("احذف الفروع أولاً!", "error"); return; }
  if (!confirm("هل أنت متأكد من الحذف؟")) return;
  try {
    await deleteDoc(doc(db, "content_tree", id));
    showToast("تم الحذف"); loadTree();
  } catch (e) { showToast("خطأ", "error"); }
};

window.closeModal = function(id) { document.getElementById(id).classList.remove("active"); };
</script>
</body>
</html>
