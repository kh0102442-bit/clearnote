<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار الاتصال</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    .success { color: green; font-size: 24px; font-weight: bold; }
    .error { color: red; font-size: 20px; font-weight: bold; direction: ltr; }
  </style>
</head>
<body>
  <h1>جاري اختبار الاتصال بقاعدة البيانات...</h1>
  <div id="result">انتظر...</div>

  <!-- استدعاء مكتبات Firebase بنظام الـ Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    try {
      // إعداداتك
      const firebaseConfig = {
        apiKey: "AIzaSyCHspBBXBG8DmLPOfKcqE8H8SmAjw5HGpQ",
        authDomain: "clearnote-aefcb.firebaseapp.com",
        projectId: "clearnote-aefcb",
        storageBucket: "clearnote-aefcb.firebasestorage.app",
        messagingSenderId: "909239922660",
        appId: "1:909239922660:web:1db0fbc92c419aa13a21f1"
      };

      // تهيئة Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // محاولة القراءة
      db.collection("content_tree").get().then((snapshot) => {
        document.getElementById("result").innerHTML = `<div class="success">✅ نجح الاتصال! عدد العناصر في قاعدة البيانات: ${snapshot.size}</div>`;
      }).catch((error) => {
        document.getElementById("result").innerHTML = `<div class="error">❌ فشل الاتصال!<br><br>السبب:<br>${error.message}</div>`;
      });

    } catch (e) {
      document.getElementById("result").innerHTML = `<div class="error">❌ خطأ في الكود: <br>${e.message}</div>`;
    }
  </script>
</body>
</html>
