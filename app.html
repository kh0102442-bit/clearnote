<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — منصة المذاكرة</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .app-navbar {
    background: var(--navy); color: white; padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .app-brand { font-family: Georgia, serif; font-size: 22px; font-weight: bold; }
  .app-brand span { color: var(--accent); }
  .user-badge { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }

  .container { padding: 20px; max-width: 800px; margin: 0 auto; }

  /* الكروت */
  .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .card {
    background: white; border: 2px solid var(--border); border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  }
  .card::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: var(--accent); }
  .card-title { font-size: 20px; font-weight: 800; color: var(--navy); margin: 0; display: flex; align-items: center; gap: 10px; }
  .card-type { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  
  .card.module_explain::before { background: #10b981; }
  .card.module_video::before { background: #ef4444; }
  .card.module_questions::before { background: #3b82f6; }
  .card.module_summary::before { background: #8b5cf6; }
  .card.module_terms::before { background: #f59e0b; }

  /* الشاشة الكاملة (Full Screen) */
  #contentView { position: fixed; inset: 0; background: #fff; z-index: 9999; display: none; flex-direction: column; }
  .fullscreen-header { background: var(--navy); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
  .fullscreen-title { font-size: 18px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-close { background: #dc2626; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; border: none; }
  .iframe-wrapper { flex: 1; position: relative; }
  .iframe-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

  @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="app-navbar">
  <div class="app-brand">CLEAR<span>NOTE</span></div>
  <div class="user-badge" id="userAvatar">U</div>
</div>

<div class="container">
  <div class="breadcrumbs" id="breadcrumbs" style="margin-bottom: 20px; font-size:16px; color:var(--muted);"></div>
  <div id="mainView"><div class="grid" id="cardsContainer"></div></div>
</div>

<div id="contentView">
  <div class="fullscreen-header">
    <h2 class="fullscreen-title" id="viewerTitle">عنوان</h2>
    <button class="btn-close" onclick="closeViewer()">خروج <i class="fas fa-times"></i></button>
  </div>
  <div class="iframe-wrapper"><iframe id="contentFrame" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-modals"></iframe></div>
</div>

<script type="module">
import { db, onAuth, goTo, signOutUser } from "./shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let treeData = [];
onAuth((user, data) => {
  if (!user) { goTo("index.html"); return; }
  document.getElementById("userAvatar").textContent = (data.name || user.email).charAt(0).toUpperCase();
  loadTree();
});

async function loadTree() {
  const snap = await getDocs(collection(db, "content_tree"));
  treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render("root");
}

function render(parentId) {
  document.getElementById("mainView").style.display = "block";
  document.getElementById("contentView").style.display = "none";
  const c = document.getElementById("cardsContainer");
  c.innerHTML = "";
  
  const nodes = treeData.filter(n => n.parentId === parentId);
  if(!nodes.length) { c.innerHTML = "<p style='font-size:18px; text-align:center;'>لا يوجد محتوى.</p>"; return; }

  nodes.forEach(node => {
    let label = "تصنيف"; let icon = "";
    if(node.type === 'year') label = "سنة";
    else if(node.type === 'subject') label = "مادة";
    else if(node.type === 'module_explain') { label = "الشرح"; icon = "<i class='fas fa-file-alt' style='color:#10b981'></i>"; }
    else if(node.type === 'module_video') { label = "فيديو"; icon = "<i class='fas fa-video' style='color:#ef4444'></i>"; }
    else if(node.type === 'module_questions') { label = "أسئلة"; icon = "<i class='fas fa-question-circle' style='color:#3b82f6'></i>"; }
    else if(node.type === 'module_summary') { label = "ملخص"; icon = "<i class='fas fa-clipboard-list' style='color:#8b5cf6'></i>"; }
    else if(node.type === 'module_terms') { label = "مصطلحات"; icon = "<i class='fas fa-book' style='color:#f59e0b'></i>"; }

    const card = document.createElement("div");
    card.className = `card ${node.type}`;
    card.onclick = () => node.type.startsWith('module_') ? openViewer(node) : render(node.id);
    card.innerHTML = `<div class="card-type">${label}</div><h3 class="card-title">${icon} ${node.title}</h3>`;
    c.appendChild(card);
  });
}

function openViewer(node) {
  document.getElementById("mainView").style.display = "none";
  document.getElementById("contentView").style.display = "flex";
  document.getElementById("viewerTitle").textContent = node.title;
  document.getElementById("contentFrame").srcdoc = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{font-family:sans-serif; padding:20px; line-height:1.8; font-size:18px;}</style></head><body>${node.htmlContent || '<h2>لا يوجد محتوى</h2>'}</body></html>`;
}

window.closeViewer = () => {
  document.getElementById("mainView").style.display = "block";
  document.getElementById("contentView").style.display = "none";
  document.getElementById("contentFrame").srcdoc = "";
};
</script>
</body>
</html>
