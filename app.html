<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body style="font-family:sans-serif; padding:20px;">
  <h2>اختبار الاتصال بقاعدة البيانات:</h2>
  <div id="result" style="font-size:20px; font-weight:bold; color:blue;">جاري الاتصال...</div>

  <script type="module">
    import { db } from "./shared.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    try {
      const snap = await getDocs(collection(db, "content_tree"));
      document.getElementById("result").innerText = "✅ نجح الاتصال! عدد العناصر: " + snap.size;
      document.getElementById("result").style.color = "green";
    } catch (e) {
      document.getElementById("result").innerText = "❌ فشل الاتصال: " + e.message;
      document.getElementById("result").style.color = "red";
    }
  </script>
</body>
</html>
