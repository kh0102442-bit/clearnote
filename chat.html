<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearNote · الدردشات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152741; --navy-dark:#0f1e33; --accent:#a8741a; --bg:#f4f6f8; --chat-bg:#efeae2;
  --mine:#d9fdd3; --red:#b91c1c; --green:#2f9e5c; --blue:#2c9de0; --line:#e6e9ee;
  --muted:#6b7480; --text:#1b2433; --soft:#475063;
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}

/* ===== Layout ===== */
.app{position:relative;height:100vh;height:100dvh;display:flex;overflow:hidden}
.list-col{position:relative;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;min-width:0}
.main{position:fixed;inset:0;background:var(--chat-bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;z-index:5;min-width:0}
body.room-open .main{transform:none}
.empty-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:20px;font-size:15px}
.empty-main i{font-size:46px;opacity:.5}
.room{flex:1;min-height:0;display:flex;flex-direction:column}

/* ===== List header / search / tabs ===== */
.lhdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy);color:#fff;flex-shrink:0}
.lhdr h1{font-size:18px;margin:0;flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:inherit;flex-shrink:0;text-decoration:none}
.icon-btn:hover{background:rgba(127,127,127,.15)}
.lhdr .icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn.sm{width:30px;height:30px}
.search{padding:10px 12px;position:relative;flex-shrink:0}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 40px 0 14px;background:#f7f8fa;outline:none}
.search>i{position:absolute;right:26px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 10px;flex-shrink:0;border-bottom:1px solid var(--line)}
.tab{padding:6px 12px;border-radius:16px;background:#eef1f5;font-size:13px;font-weight:700;color:var(--soft)}
.tab.on{background:var(--navy);color:#fff}
.list-scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.sec{padding:10px 14px 4px;font-size:12px;color:var(--muted);font-weight:700}
.lnote{padding:10px 14px;font-size:12.5px;color:var(--red);background:#fdf2f2;line-height:1.7}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.hint{font-size:12.5px;color:var(--muted);padding:10px 14px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.grow small{color:var(--muted);font-size:12px}

/* ===== Rows ===== */
.item{display:flex;gap:11px;padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f3f6;content-visibility:auto;contain-intrinsic-size:auto 70px}
.item:hover{background:#f7f9fb}
.item.active{background:#eaf2fb}
.ib{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ir1,.ir2{display:flex;align-items:center;gap:8px;min-width:0}
.title{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.prev{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:11.5px;color:var(--muted);flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f5;color:var(--soft);flex-shrink:0;font-weight:700}
.tag.req{background:#fff4dc;color:var(--accent)}
.tag.kind{background:#e8f1fb;color:var(--navy)}
.res{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f3f6}
.res:hover{background:#f7f9fb}
.res .btn{height:34px;padding:0 12px;font-size:13px}

/* ===== Avatars ===== */
.av{position:relative;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden;font-size:17px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xs{width:34px;height:34px;font-size:13px}
.av.xl{width:88px;height:88px;font-size:32px}
.av.k-group{background:#2c6e9e}
.av.k-channel{background:var(--accent)}
.av.k-community{background:var(--green)}
.rhdr .av{width:40px;height:40px;font-size:15px}

/* ===== Bottom nav ===== */
.bottom-nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff;padding:6px 0 calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
.bottom-nav a{flex:1;text-align:center;color:var(--muted);font-size:11.5px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}
.bottom-nav a i{font-size:18px}
.bottom-nav a.on{color:var(--navy);font-weight:800}

/* ===== Room header ===== */
.rhdr{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--navy);color:#fff;flex-shrink:0}
.rhdr .icon-btn{color:#fff}
.rinfo{flex:1;min-width:0;cursor:pointer}
#rname{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rsub{font-size:12px;opacity:.8}

/* ===== Thread ===== */
.thread-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#threadWrap{flex:1;overflow-y:auto;padding:12px 10px 8px;overscroll-behavior:contain;min-height:0}
#thread{max-width:860px;margin:0 auto;display:flex;flex-direction:column}
#rows{display:flex;flex-direction:column}
.intro-card{background:#fff;border-radius:16px;padding:18px 14px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.i-av-btn{border-radius:50%}
.i-name{font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.vbadge{color:var(--blue);font-size:15px}
.i-role{font-size:13px;color:var(--muted)}
.i-stats{display:flex;gap:18px;font-size:13px;color:var(--soft);margin-top:4px}
.i-stats b{font-size:15px;color:var(--text)}
.i-desc{font-size:13px;color:var(--soft);max-width:520px;white-space:pre-wrap}
.i-hint{font-size:12.5px;color:var(--muted);margin-top:6px;background:#f5f7fa;padding:8px 12px;border-radius:10px;max-width:520px}

.row{display:flex;margin-top:8px}
.row.grouped{margin-top:2px}
.row.mine{justify-content:flex-end}
.row.theirs{justify-content:flex-start}
.bwrap{max-width:82%;display:flex;min-width:0}
.bubble{background:#fff;border-radius:12px;padding:6px 9px 4px;box-shadow:0 1px 1px rgba(0,0,0,.08);min-width:70px;cursor:pointer;overflow-wrap:anywhere;word-wrap:break-word}
.row.mine .bubble{background:var(--mine)}
.row.flash .bubble{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:0 1px 1px rgba(0,0,0,.08)}40%{box-shadow:0 0 0 4px rgba(168,116,26,.55)}}
.sname{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:2px;cursor:pointer}
.row.grouped .sname{display:none}
.txt{font-size:14.5px;line-height:1.6}
.txt.deleted{color:var(--muted);font-style:italic;font-size:13.5px}
.quote{border-inline-start:3px solid var(--accent);background:rgba(0,0,0,.05);border-radius:6px;padding:4px 8px;margin-bottom:5px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.quote b{color:var(--accent)}
.quote span{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:2px}
.ticks{font-size:12px;color:var(--muted)}
.ticks.seen{color:var(--blue)}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:12.5px}
.rc.mine{border-color:var(--navy);background:#eaf2fb}

/* ===== Attachments in bubbles ===== */
.att{border-radius:8px;overflow:hidden;margin-bottom:4px;cursor:pointer;position:relative;background:#e9edf2}
.att-img img{display:block;width:100%;max-width:300px;height:auto;max-height:360px;min-height:110px;object-fit:cover;background:#e4e8ee}
.att-vid{background:#111;width:260px;max-width:100%;min-height:150px}
.att-vid img{width:100%;height:180px;object-fit:cover;opacity:.9;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play i{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:18px}
.att-file{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(0,0,0,.04);min-width:220px}
.ficon{width:40px;height:40px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.ficon.big{width:84px;height:84px;font-size:38px;border-radius:18px}
.fmeta{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.fmeta b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta small{font-size:11.5px;color:var(--muted)}

/* ===== Jump button ===== */
.jump{position:absolute;bottom:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--navy);font-size:15px;z-index:2}
.jump[hidden]{display:none}
#jumpN{position:absolute;top:-4px;left:-4px;background:var(--green);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:18px;text-align:center}

/* ===== Composer ===== */
.composer{background:#f0f2f5;padding:8px 10px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid var(--line)}
.ctx{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 8px;margin-bottom:6px;border-inline-start:4px solid var(--accent)}
.ctx>i{color:var(--accent)}
.ctx>div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12.5px}
.ctx b{color:var(--accent)}
.ctx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.filechip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:6px 8px;margin-bottom:6px}
.fthumb{width:44px;height:44px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fname{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
.fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname small{color:var(--muted)}
.fbar{position:relative;height:24px;background:#fff;border-radius:8px;margin-bottom:6px;overflow:hidden;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.fbar-in{position:absolute;top:0;bottom:0;left:0;width:0;background:rgba(44,157,224,.28);transition:width .15s linear}
.fbar span{position:relative}
.notice{font-size:13px;color:var(--soft);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;text-align:center;line-height:1.7}
.decide{display:flex;gap:8px;margin-bottom:6px}
.decide:empty{display:none}
.decide .btn{flex:1}
.btn{height:42px;border-radius:21px;padding:0 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ok{background:var(--navy);color:#fff}
.btn.danger{background:#fdecec;color:var(--red)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--soft)}
.btn:disabled{opacity:.6;cursor:default}
.inputrow{display:flex;align-items:flex-end;gap:6px}
.inputrow>.icon-btn{color:var(--soft);width:40px;height:40px}
#input{flex:1;min-width:0;resize:none;border:0;outline:none;background:#fff;border-radius:20px;padding:10px 14px;max-height:130px;line-height:1.5;font-size:15px}
.send{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex-shrink:0}
.send:disabled{opacity:.5}

/* ===== Panel (create room) ===== */
.panel{position:absolute;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column}
.panel .form{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.panel label{font-size:13px;color:var(--soft);display:flex;flex-direction:column;gap:6px}
.panel label.check{flex-direction:row;align-items:center;gap:8px}
.panel input[type=text],.panel input:not([type]),.panel select,.panel textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:15px;background:#fff}
.panel .hint{padding:0;color:var(--red)}

/* ===== Bottom sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:41;padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sh-em{display:flex;justify-content:space-around;margin-bottom:10px}
.sh-em:empty{display:none}
.sh-em button{font-size:24px;width:44px;height:44px;border-radius:50%}
.sh-em button:hover{background:#f1f3f6}
.sh-act{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:10px;font-size:15px;text-align:start}
.sh-act:hover{background:#f5f7fa}
.sh-act i{width:20px;text-align:center;color:var(--soft)}
.sh-act.danger,.sh-act.danger i{color:var(--red)}

/* ===== Viewer ===== */
.viewer{position:fixed;inset:0;z-index:60;background:#0b0f16;color:#fff;display:flex;flex-direction:column}
.vhdr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.06);flex-shrink:0}
.vhdr .icon-btn{color:#fff}
.vt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.vt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt small{opacity:.7;font-size:11.5px}
.vbody{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform}
.stage video{width:100%;height:100%;background:#000;object-fit:contain}
.stage audio{width:min(90%,520px)}
.docframe{width:100%;height:100%;border:0;background:#fff}
.textview{width:100%;height:100%;margin:0;overflow:auto;padding:16px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;background:#fff;color:#1b2433;text-align:start}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:18px;z-index:2}
.vnav.prev{inset-inline-start:10px}
.vnav.next{inset-inline-end:10px}
.vtools{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.06);flex-shrink:0}
.vtools>*{height:40px;min-width:40px;padding:0 12px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;cursor:pointer}
.vtools>*:hover{background:rgba(255,255,255,.22)}
.file-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;color:#fff}
.file-card b{font-size:16px;word-break:break-all}
.file-card small{opacity:.7}
.file-card .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.file-card .btn.ok{background:#fff;color:var(--navy)}
.file-card .btn.ghost{color:#fff;border-color:rgba(255,255,255,.3);background:transparent}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1b2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Desktop ===== */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:clamp(320px,30vw,400px) 1fr}
  .list-col{border-inline-end:1px solid var(--line)}
  .main{position:relative;inset:auto;transform:none;z-index:auto;min-width:0}
  .back-btn,.bottom-nav{display:none !important}
  .bwrap{max-width:66%}
  .sheet{left:50%;right:auto;transform:translateX(-50%);width:380px;bottom:24px;border-radius:16px}
}
</style>
</head>
<body>

<div class="app" id="app">

  <aside class="list-col" id="listCol">
    <header class="lhdr">
      <a class="icon-btn" href="app.html" aria-label="الرئيسية" title="الرئيسية"><i class="fa-solid fa-house"></i></a>
      <h1>الدردشات</h1>
      <button class="icon-btn" id="newRoomBtn" aria-label="إنشاء مساحة" title="إنشاء"><i class="fa-solid fa-plus"></i></button>
    </header>

    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="search" type="search" placeholder="بحث بالاسم أو اسم المستخدم أو الهاتف" autocomplete="off">
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="all">الكل</button>
      <button class="tab" data-tab="unread">غير المقروءة</button>
      <button class="tab" data-tab="direct">الخاص</button>
      <button class="tab" data-tab="groups">الجروبات</button>
      <button class="tab" data-tab="channels">القنوات</button>
      <button class="tab" data-tab="communities">المجتمعات</button>
      <button class="tab" data-tab="study">غرف المذاكرة</button>
    </nav>

    <div class="list-scroll" id="listScroll">
      <div class="lnote" id="roomNotice" hidden>الجروبات والقنوات والمجتمعات تحتاج تحديث قواعد Firestore (مجموعة rooms). لن تظهر حتى يُنشر ملف القواعد.</div>
      <div id="resultsWrap" hidden><div class="sec">المستخدمون</div><div id="results"></div></div>
      <div id="chatList"></div>
      <div class="empty" id="listEmpty" hidden></div>
      <div class="empty" id="tabPlaceholder" hidden></div>
      <div id="discover" hidden></div>
    </div>

    <nav class="bottom-nav">
      <a href="app.html"><i class="fa-solid fa-house"></i>الرئيسية</a>
      <a class="on" href="chat.html"><i class="fa-solid fa-comments"></i>الدردشات</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i>حسابي</a>
    </nav>

    <section class="panel" id="createPanel" hidden>
      <header class="lhdr">
        <button class="icon-btn" id="cBack" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <h1>إنشاء مساحة جديدة</h1>
      </header>
      <div class="form">
        <label>النوع
          <select id="cKind">
            <option value="group">جروب</option>
            <option value="channel">قناة (النشر للمشرفين)</option>
            <option value="community">مجتمع</option>
          </select>
        </label>
        <label>الاسم <input type="text" id="cName" maxlength="60" placeholder="اسم المساحة"></label>
        <label>الوصف <textarea id="cDesc" rows="3" maxlength="200" placeholder="وصف مختصر"></textarea></label>
        <label class="check"><input type="checkbox" id="cPublic" checked> عام (يظهر في الاستكشاف)</label>
        <p class="hint" id="cHint"></p>
        <button class="btn ok" id="cSave">إنشاء</button>
      </div>
    </section>
  </aside>

  <main class="main" id="main">
    <div class="empty-main" id="placeholder">

<script type="module">
import { auth, db } from "./shared.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteField, arrayUnion, increment,
  query, where, orderBy, limit, limitToLast, onSnapshot, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================= Constants ================= */
const LOGIN_PAGE = "index.html";
const PROFILE_PAGE = "profile.html";
const PAGE_SIZE = 30;
const CHAT_LIST_LIMIT = 300;
const ROOM_LIST_LIMIT = 200;
const MAX_TEXT = 2000;
const GROUP_GAP_MS = 5 * 60 * 1000;
const MAX_FILE = 10 * 1024 * 1024;
const CLOUD_URL = "https://api.cloudinary.com/v1_1/nopxs3zt/auto/upload";
const CLOUD_PRESET = "clearnote_unsigned";
const CLOUD_PREFIX = "https://res.cloudinary.com/nopxs3zt/";
const EMOJIS = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
const ROLE_LABEL = { admin: "مشرف", moderator: "مشرف", founder: "المؤسس", member: "عضو", user: "عضو" };
const KIND_LABEL = { group: "جروب", channel: "قناة", community: "مجتمع" };
const KIND_ICON = { group: "fa-user-group", channel: "fa-bullhorn", community: "fa-people-roof" };
const PLACEHOLDER_TABS = { study: "غرف المذاكرة قريباً" };
const ROOM_TABS = { groups: "group", channels: "channel", communities: "community" };

/* ================= State ================= */
const S = {
  me: null,
  tab: "all",
  listQuery: "",
  listScheduled: false,
  searchTimer: 0,
  searchToken: 0,
  chats: new Map(),
  rooms: new Map(),
  roomsError: false,
  publicRooms: [],
  discoverHtml: "",
  chatsUnsub: null,
  roomsUnsub: null,
  rowCache: new Map(),
  // active thread
  kind: null,          // "chat" | "room"
  id: null,
  otherUid: null,
  data: null,          // thread doc data
  exists: false,
  loaded: false,
  otherReadMs: 0,
  docUnsub: null,
  msgUnsub: null,
  token: 0,
  windowSize: PAGE_SIZE,
  hasMore: false,
  loadingOlder: false,
  anchorH: 0,
  forceBottom: true,
  followBottom: true,
  newBelow: 0,
  marking: false,
  map: new Map(),      // messageId -> data
  order: [],           // [{id,t}] sorted
  els: new Map(),      // messageId -> row element
  reply: null,
  editingId: null,
  sheetId: null,
  pendingFile: null,
  previewUrl: "",
  busy: false,
  // viewer
  gallery: [],
  viewerIdx: -1,
  viewToken: 0,
  speedIdx: 2,
  zoom: null,
  started: false,
};

const userCache = new Map();
const userPending = new Map();

/* ================= Helpers ================= */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const chatIdFor = (a, b) => [a, b].sort().join("_");
const millis = (v) => {
  if (!v) return 0;
  if (typeof v.toMillis === "function") return v.toMillis();
  return typeof v === "number" ? v : 0;
};
const num = (v) => Number(v || 0).toLocaleString("ar");
const isCloud = (u) => typeof u === "string" && u.startsWith(CLOUD_PREFIX);
const tx = (url, t) => (isCloud(url) && url.includes("/upload/") ? url.replace("/upload/", `/upload/${t}/`) : url);
const dlUrl = (url) => (isCloud(url) && url.includes("/upload/") ? url.replace("/upload/", "/upload/fl_attachment/") : url);
const extOf = (name) => {
  const m = /\.([a-z0-9]+)$/i.exec(String(name || ""));
  return m ? m[1].toLowerCase() : "";
};
const fmtSize = (b) => {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
};
const fmtTime = (ms) => {
  if (!ms) return "";
  const d = new Date(ms), now = new Date();
  const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return hm;
  return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + hm;
};
const badgeHTML = (u) => (u && (u.verified || u.isVerified) ? ' <i class="fa-solid fa-circle-check vbadge" title="موثّق"></i>' : "");

function toast(msg, ms = 2600) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

function goProfile(uid) {
  if (!uid) return;
  location.href = uid === S.me ? PROFILE_PAGE : PROFILE_PAGE + "?uid=" + encodeURIComponent(uid);
}

function avatar(u, extra = "") {
  const name = (u && u.name) || "?";
  const init = esc(name.trim().charAt(0) || "?");
  const img = u && u.avatarUrl
    ? `<img src="${esc(tx(u.avatarUrl, "w_120,h_120,c_fill,q_auto,f_auto"))}" alt="" loading="lazy" onerror="this.remove()">`
    : "";
  return `<span class="av ${extra}">${init}${img}</span>`;
}

/* ================= Users ================= */
function getUser(uid) {
  if (!uid) return Promise.resolve({ uid: "", name: "مستخدم" });
  if (userCache.has(uid)) return Promise.resolve(userCache.get(uid));
  if (userPending.has(uid)) return userPending.get(uid);
  const p = getDoc(doc(db, "users", uid))
    .then((snap) => (snap.exists() ? { uid, ...snap.data() } : { uid, name: "مستخدم" }))
    .catch(() => ({ uid, name: "مستخدم" }))
    .then((d) => {
      userCache.set(uid, d);
      userPending.delete(uid);
      onUserLoaded(uid, d);
      return d;
    });
  userPending.set(uid, p);
  return p;
}

function onUserLoaded(uid, d) {
  document.querySelectorAll(`[data-sn="${uid}"]`).forEach((el) => (el.textContent = d.name || "مستخدم"));
  if (S.kind === "chat" && uid === S.otherUid) {
    paintHeader();
    renderIntro();
  }
  scheduleList();
}

function nameOf(uid) {
  if (uid === S.me) return "أنت";
  return (userCache.get(uid) && userCache.get(uid).name) || "...";
}

function realName(uid) {
  return (userCache.get(uid) && userCache.get(uid).name) || "مستخدم";
}

/* ================= File types ================= */
function fileType(a) {
  if (!a) return "other";
  if (a.kind === "image") return "image";
  const mime = String(a.mime || "").toLowerCase();
  const ext = extOf(a.name);
  if (mime.startsWith("video/") || ["mp4", "webm", "mov", "mkv", "m4v"].includes(ext)) return "video";
  if (mime.startsWith("audio/") || ["mp3", "wav", "ogg", "m4a", "aac", "flac", "opus"].includes(ext)) return "audio";
  if (mime === "application/pdf" || ext === "pdf") return "pdf";
  if (["doc", "docx", "ppt", "pptx", "xls", "xlsx", "odt", "odp", "ods"].includes(ext)) return "office";
  if (mime.startsWith("text/") || ["txt", "md", "csv", "json", "log", "js", "css", "html", "xml", "py", "java", "c", "cpp", "sql"].includes(ext)) return "text";
  return "other";
}

function ficonClass(a) {
  const ft = fileType(a), ext = extOf(a.name);
  if (ft === "pdf") return "fa-file-pdf";
  if (ft === "video") return "fa-file-video";
  if (ft === "audio") return "fa-file-audio";
  if (ft === "text") return "fa-file-lines";
  if (["doc", "docx", "odt", "rtf"].includes(ext)) return "fa-file-word";
  if (["xls", "xlsx", "ods"].includes(ext)) return "fa-file-excel";
  if (["ppt", "pptx", "odp"].includes(ext)) return "fa-file-powerpoint";
  return "fa-file";
}

function vthumb(url) {
  if (!isCloud(url) || !url.includes("/video/upload/")) return "";
  return url
    .replace("/video/upload/", "/video/upload/so_0,w_520,h_360,c_limit,q_auto,f_jpg/")
    .replace(/\.[a-z0-9]+(\?.*)?$/i, ".jpg");
}

/* ================= Chat list ================= */
function needsRead(d) {
  if (!d || !d.lastMessageAt || d.lastSenderUid === S.me) return false;
  const readAt = d.readAt || {};
  if (!(S.me in readAt)) return true;
  const r = readAt[S.me];
  if (!r) return false;
  return millis(r) < millis(d.lastMessageAt);
}

function buildItems() {
  const items = [];
  for (const [id, d] of S.chats) {
    if (d.status === "blocked") continue;
    const other = (d.participants || []).find((x) => x !== S.me) || "";
    items.push({ kind: "chat", id, d, other, t: millis(d.lastMessageAt) || millis(d.createdAt), unread: needsRead(d) });
  }
  for (const [id, d] of S.rooms) {
    items.push({ kind: "room", id, d, other: "", t: millis(d.lastMessageAt) || millis(d.createdAt), unread: false });
  }
  items.sort((a, b) => b.t - a.t);
  return items;
}

function passTab(it) {
  const d = it.d;
  switch (S.tab) {
    case "all": return true;
    case "unread": return it.unread;
    case "direct": return it.kind === "chat" && (d.status || "active") === "active";
    case "groups": return it.kind === "room" && d.kind === "group";
    case "channels": return it.kind === "room" && d.kind === "channel";
    case "communities": return it.kind === "room" && d.kind === "community";
    default: return false;
  }
}

function matchQuery(it, q) {
  if (!q) return true;
  if (it.kind === "room") return String(it.d.name || "").toLowerCase().includes(q);
  const u = userCache.get(it.other);
  if (!u) return false;
  return String(u.name || "").toLowerCase().includes(q) || String(u.username || "").toLowerCase().includes(q);
}

function rowInfo(it) {
  const d = it.d;
  let av, name, tag = "";
  if (it.kind === "room") {
    const k = d.kind || "group";
    av = `<span class="av k-${esc(k)}"><i class="fa-solid ${KIND_ICON[k] || "fa-user-group"}"></i></span>`;
    name = d.name || "مساحة";
    tag = `<span class="tag kind">${KIND_LABEL[k] || ""}</span>`;
  } else {
    const u = userCache.get(it.other) || { name: "..." };
    av = avatar(u);
    name = u.name || "مستخدم";
    if (d.status === "pending") {
      tag = d.requesterUid === S.me ? `<span class="tag">بانتظار الرد</span>` : `<span class="tag req">طلب مراسلة</span>`;
    }
  }
  const prevRaw = d.lastMessage ? (d.lastSenderUid === S.me ? "أنت: " : "") + d.lastMessage : "لا توجد رسائل بعد";
  const time = fmtTime(it.t);
  const dot = it.unread ? '<span class="dot"></span>' : "";
  const html = `${av}<div class="ib"><div class="ir1"><span class="title">${esc(name)}</span><span class="time">${time}</span></div><div class="ir2"><span class="prev">${esc(prevRaw)}</span>${tag}${dot}</div></div>`;
  return { html };
}

function emptyText() {
  if (S.listQuery.trim()) return "لا توجد نتائج مطابقة في المحادثات";
  const map = {
    all: "لا توجد محادثات بعد. ابحث عن شخص للبدء.",
    unread: "لا توجد رسائل غير مقروءة",
    direct: "لا توجد محادثات خاصة",
    groups: "لا توجد جروبات بعد",
    channels: "لا توجد قنوات بعد",
    communities: "لا توجد مجتمعات بعد",
  };
  return map[S.tab] || "";
}

function scheduleList() {
  if (S.listScheduled) return;
  S.listScheduled = true;
  requestAnimationFrame(renderList);
}

function renderList() {
  S.listScheduled = false;
  const q = S.listQuery.trim().toLowerCase();
  const ph = PLACEHOLDER_TABS[S.tab];
  $("#tabPlaceholder").hidden = !ph;
  $("#tabPlaceholder").textContent = ph || "";
  $("#chatList").hidden = !!ph;
  $("#roomNotice").hidden = !S.roomsError;
  renderDiscover();
  if (ph) {
    $("#listEmpty").hidden = true;
    return;
  }
  const items = buildItems().filter((it) => passTab(it) && matchQuery(it, q));
  const frag = document.createDocumentFragment();
  const seen = new Set();
  for (const it of items) {
    const key = it.kind + ":" + it.id;
    seen.add(key);
    if (it.kind === "chat" && it.other && !userCache.has(it.other)) getUser(it.other);
    const info = rowInfo(it);
    let rec = S.rowCache.get(key);
    if (!rec) {
      rec = { sig: "", el: document.createElement("div") };
      S.rowCache.set(key, rec);
    }
    if (rec.sig !== info.html) {
      rec.sig = info.html;
      rec.el.innerHTML = info.html;
    }
    rec.el.className = "item" + (S.id === it.id && S.kind === it.kind ? " active" : "");
    rec.el.dataset.kind = it.kind;
    rec.el.dataset.id = it.id;
    frag.appendChild(rec.el);
  }
  for (const key of S.rowCache.keys()) if (!seen.has(key)) S.rowCache.delete(key);
  $("#chatList").replaceChildren(frag);
  $("#listEmpty").hidden = items.length > 0;
  $("#listEmpty").textContent = emptyText();
}

function renderDiscover() {
  const kind = ROOM_TABS[S.tab];
  const list = kind ? S.publicRooms.filter((r) => r.kind === kind && !(r.members || []).includes(S.me)) : [];
  const html = list.length
    ? `<div class="sec">اكتشف</div>` + list.map((r) => `
        <div class="res">
          <span class="av k-${esc(r.kind)}"><i class="fa-solid ${KIND_ICON[r.kind] || "fa-user-group"}"></i></span>
          <div class="grow"><div class="title">${esc(r.name || "مساحة")}</div><small>${esc(r.desc || KIND_LABEL[r.kind] || "")}</small></div>
          <button class="btn ok" data-join="${esc(r.id)}">انضمام</button>
        </div>`).join("")
    : "";
  if (html === S.discoverHtml) return;
  S.discoverHtml = html;
  $("#discover").innerHTML = html;
  $("#discover").hidden = !html;
}

async function loadDiscover() {
  try {
    const snap = await getDocs(query(collection(db, "rooms"), where("isPublic", "==", true), limit(60)));
    S.publicRooms = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.warn("discover:", e);
    S.publicRooms = [];
  }
  S.discoverHtml = "";
  renderDiscover();
}

function startLists() {
  S.chatsUnsub = onSnapshot(
    query(collection(db, "chats"), where("participants", "array-contains", S.me), limit(CHAT_LIST_LIMIT)),
    (snap) => {
      snap.docChanges().forEach((c) => {
        if (c.type === "removed") S.chats.delete(c.doc.id);
        else S.chats.set(c.doc.id, c.doc.data());
      });
      scheduleList();
    },
    (err) => {
      console.error("chats list:", err);
      toast("تعذر تحميل المحادثات");
    }
  );

  S.roomsUnsub = onSnapshot(
    query(collection(db, "rooms"), where("members", "array-contains", S.me), limit(ROOM_LIST_LIMIT)),
    (snap) => {
      S.roomsError = false;
      snap.docChanges().forEach((c) => {
        if (c.type === "removed") S.rooms.delete(c.doc.id);
        else S.rooms.set(c.doc.id, c.doc.data());
      });
      scheduleList();
    },
    (err) => {
      console.warn("rooms list:", err);
      S.roomsError = true;
      scheduleList();
    }
  );
}

/* ================= User search ================= */
async function runUserSearch(raw) {
  const box = $("#resultsWrap");
  const res = $("#results");
  const q = raw.replace(/^@/, "").trim();
  const token = ++S.searchToken;
  if (!q) {
    box.hidden = true;
    res.innerHTML = "";
    return;
  }
  box.hidden = false;
  res.innerHTML = `<div class="hint">جارٍ البحث…</div>`;

  const usersCol = collection(db, "users");
  const digits = q.replace(/\D/g, "");
  const tasks = [
    getDocs(query(usersCol, where("name", ">=", q), where("name", "<=", q + "\uf8ff"), limit(15))),
    getDocs(query(usersCol, where("username", "==", q), limit(10))),
    getDocs(query(usersCol, where("lower", "==", q.toLowerCase()), limit(10))),
  ];
  if (digits.length >= 6) tasks.push(getDocs(query(usersCol, where("digits", "==", digits), limit(10))));

  const results = await Promise.allSettled(tasks);
  if (token !== S.searchToken) return;

  const found = new Map();
  results.forEach((r) => {
    if (r.status !== "fulfilled") return;
    r.value.docs.forEach((d) => {
      if (d.id !== S.me) found.set(d.id, { uid: d.id, ...d.data() });
    });
  });

  if (!found.size) {
    res.innerHTML = `<div class="hint">لا توجد نتائج</div>`;
    return;
  }
  for (const u of found.values()) userCache.set(u.uid, u);
  res.innerHTML = [...found.values()].map((u) => `
    <div class="res" data-uid="${esc(u.uid)}">
      ${avatar(u)}
      <div class="grow">
        <div class="title">${esc(u.name || "مستخدم")}${badgeHTML(u)}</div>
        <small>${u.username ? "@" + esc(u.username) : esc(ROLE_LABEL[u.role] || "عضو")}</small>
      </div>
    </div>`).join("");
}

function openFromSearch(uid) {
  S.searchToken++;
  $("#search").value = "";
  S.listQuery = "";
  $("#resultsWrap").hidden = true;
  $("#results").innerHTML = "";
  scheduleList();
  openChat(uid);
}

/* ================= Thread: refs & state ================= */
function threadRef() {
  return S.kind === "room" ? doc(db, "rooms", S.id) : doc(db, "chats", S.id);
}
function msgsCol() {
  return collection(threadRef(), "messages");
}
function msgRef(id) {
  return doc(msgsCol(), id);
}

function computeState() {
  if (!S.id) return "none";
  if (!S.loaded) return "loading";
  if (S.kind === "room") {
    if (!S.exists) return "gone";
    const r = S.data || {};
    if (!(r.members || []).includes(S.me)) return r.isPublic ? "join" : "closed";
    const isAdmin = r.ownerUid === S.me || (r.admins || []).includes(S.me);
    if (r.kind === "channel" && !isAdmin) return "readonly";
    return "active";
  }
  if (!S.exists) return "new";
  const st = (S.data && S.data.status) || "active";
  if (st === "blocked") return "blocked";
  if (st === "pending") return S.data.requesterUid === S.me ? "wait" : "decide";
  return "active";
}

function closeSubs() {
  if (S.docUnsub) { S.docUnsub(); S.docUnsub = null; }
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
}

function openChat(uid) {
  if (!uid || uid === S.me) return;
  openThread("chat", chatIdFor(S.me, uid), uid);
}

function openThread(kind, id, otherUid = null) {
  closeSubs();
  S.token++;
  S.kind = kind;
  S.id = id;
  S.otherUid = otherUid;
  S.data = null;
  S.exists = false;
  S.loaded = false;
  S.otherReadMs = 0;
  S.map.clear();
  S.order = [];
  S.els.clear();
  $("#rows").replaceChildren();
  $("#intro").innerHTML = "";
  S.windowSize = PAGE_SIZE;
  S.hasMore = false;
  S.loadingOlder = false;
  S.reply = null;
  S.editingId = null;
  S.newBelow = 0;
  S.forceBottom = true;
  S.followBottom = true;
  clearPendingFile();
  $("#input").value = "";
  autosize();
  $("#placeholder").hidden = true;
  $("#room").hidden = false;
  document.body.classList.add("room-open");

  if (kind === "chat" && otherUid) {
    getUser(otherUid);
    history.replaceState(null, "", "chat.html?uid=" + encodeURIComponent(otherUid));
  } else {
    history.replaceState(null, "", "chat.html");
  }

  const token = S.token;
  S.docUnsub = onSnapshot(
    threadRef(),
    (snap) => {
      if (token !== S.token) return;
      S.loaded = true;
      S.data = snap.exists() ? snap.data() : null;
      S.exists = snap.exists();
      if (S.kind === "chat") S.otherReadMs = millis(S.data && S.data.readAt ? S.data.readAt[S.otherUid] : 0);
      refreshState();
    },
    (err) => {
      console.error("thread doc:", err);
      toast("تعذر فتح المحادثة");
    }
  );
  scheduleList();
  refreshState();
}

function closeThread() {
  closeSubs();
  S.token++;
  S.kind = null;
  S.id = null;
  S.data = null;
  S.exists = false;
  S.loaded = false;
  S.map.clear();
  S.order = [];
  S.els.clear();
  $("#rows").replaceChildren();
  $("#intro").innerHTML = "";
  $("#room").hidden = true;
  $("#placeholder").hidden = false;
  document.body.classList.remove("room-open");
  closeSheet();
  closeViewer();
  history.replaceState(null, "", "chat.html");
  scheduleList();
}

function refreshState() {
  if (!S.id) return;
  const st = computeState();
  const needMsgs = ["wait", "decide", "active", "readonly", "blocked"].includes(st);
  if (needMsgs && !S.msgUnsub) subscribeMessages();
  else if (!needMsgs && S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  paintHeader();
  renderIntro();
  renderComposer();
  applyTicks();
  scheduleList();
  maybeMarkRead();
}

function paintHeader() {
  if (!S.id) return;
  const rav = $("#rav"), rname = $("#rname"), rsub = $("#rsub");
  if (S.kind === "room") {
    const r = S.data || {};
    const k = r.kind || "group";
    rav.innerHTML = `<span class="av k-${esc(k)}"><i class="fa-solid ${KIND_ICON[k] || "fa-user-group"}"></i></span>`;
    rname.textContent = r.name || "مساحة";
    rsub.textContent = `${KIND_LABEL[k] || ""} · ${(r.members || []).length} عضو`;
  } else {
    const u = userCache.get(S.otherUid) || { name: "..." };
    rav.innerHTML = avatar(u);
    rname.textContent = u.name || "مستخدم";
    rsub.textContent = u.username ? "@" + u.username : (ROLE_LABEL[u.role] || "عضو");
  }
}

function renderIntro() {
  const el = $("#intro");
  const st = computeState();
  if (!S.id || st === "loading" || st === "none") {
    el.innerHTML = "";
    return;
  }
  if (S.kind === "room") {
    const r = S.data || {};
    const k = r.kind || "group";
    const hint = {
      join: "هذه المساحة عامة. انضم لتشارك فيها.",
      active: "مرحباً بك في المساحة.",
      readonly: "القناة للنشر من المشرفين. يمكنك المتابعة فقط.",
      closed: "هذه مساحة خاصة.",
      gone: "هذه المساحة لم تعد متاحة.",
    }[st] || "";
    el.innerHTML = `
      <div class="intro-card">
        <span class="av xl k-${esc(k)}"><i class="fa-solid ${KIND_ICON[k] || "fa-user-group"}"></i></span>
        <div class="i-name">${esc(r.name || "مساحة")}</div>
        <div class="i-role">${KIND_LABEL[k] || ""} · ${(r.members || []).length} عضو</div>
        ${r.desc ? `<div class="i-desc">${esc(r.desc)}</div>` : ""}
        ${hint ? `<div class="i-hint">${hint}</div>` : ""}
      </div>`;
    return;
  }
  const u = userCache.get(S.otherUid) || { name: "..." };
  const hint = {
    new: "لا توجد رسائل بعد. أرسل أول رسالة وستصل إلى الطرف الآخر كطلب مراسلة.",
    wait: "أُرسل طلب المراسلة. بانتظار رد الطرف الآخر قبل إرسال رسالة أخرى.",
    decide: "أرسل إليك هذا المستخدم طلب مراسلة. وافق لتبدأ المحادثة، أو احظره لإيقاف رسائله.",
    active: "",
    blocked: "",
  }[st] || "";
  el.innerHTML = `
    <div class="intro-card">
      <button class="i-av-btn" id="introAv" aria-label="الملف الشخصي">${avatar(u, "xl")}</button>
      <div class="i-name">${esc(u.name || "مستخدم")}${badgeHTML(u)}</div>
      <div class="i-role">${esc(ROLE_LABEL[u.role] || "عضو")}</div>
      <div class="i-stats"><span><b>${num(u.followersCount)}</b> متابع</span><span><b>${num(u.postsCount)}</b> منشور</span></div>
      ${hint ? `<div class="i-hint">${esc(hint)}</div>` : ""}
    </div>`;
  $("#introAv").onclick = () => goProfile(S.otherUid);
}

/* ================= Composer ================= */
function canSend() {
  const st = computeState();
  return st === "new" || st === "active";
}

function renderComposer() {
  const st = computeState();
  const show = !!S.id && st !== "loading" && st !== "gone";
  $("#composer").hidden = !show;
  if (!show) return;
  const typing = st === "new" || st === "active";

  const ctx = $("#ctx");
  if (typing && (S.editingId || S.reply)) {
    ctx.hidden = false;
    ctx.innerHTML = S.editingId
      ? `<i class="fa-solid fa-pen"></i><div><b>تعديل الرسالة</b><span>اضغط للإلغاء</span></div>`
      : `<i class="fa-solid fa-reply"></i><div><b>رد على ${esc(S.reply.name)}</b><span>${esc(S.reply.text)}</span></div>`;
  } else {
    ctx.hidden = true;
    ctx.innerHTML = "";
  }

  const fc = $("#filechip");
  const f = S.pendingFile;
  fc.hidden = !(typing && f && !S.editingId);
  if (!fc.hidden) {
    fc.innerHTML = `
      <div class="fthumb">${S.previewUrl ? `<img src="${S.previewUrl}" alt="">` : `<i class="fa-solid fa-file"></i>`}</div>
      <div class="fname"><span>${esc(f.name)}</span><small>${fmtSize(f.size)}</small></div>
      <button class="icon-btn sm" id="fileRemove" aria-label="إزالة الملف"><i class="fa-solid fa-xmark"></i></button>`;
  } else {
    fc.innerHTML = "";
  }

  let mode = "type", msg = "", dec = "";
  if (st === "wait") {
    mode = "notice";
    msg = "أُرسل طلب المراسلة. بانتظار رد الطرف الآخر قبل إرسال رسالة أخرى.";
  } else if (st === "blocked") {
    mode = "notice";
    msg = "هذه المحادثة محظورة.";
  } else if (st === "decide") {
    mode = "decide";
    dec = `<button class="btn ok" id="acceptBtn"><i class="fa-solid fa-circle-check"></i> موافقة</button>
           <button class="btn danger" id="blockBtn"><i class="fa-solid fa-ban"></i> حظر</button>`;
  } else if (st === "join") {
    mode = "decide";
    dec = `<button class="btn ok" id="joinBtn">انضمام للمساحة</button>`;
  } else if (st === "readonly") {
    mode = "notice";
    msg = "القناة للنشر من المشرفين. يمكنك المتابعة فقط.";
  } else if (st === "closed") {
    mode = "notice";
    msg = "هذه مساحة خاصة.";
  }
  $("#inputrow").hidden = mode !== "type";
  $("#notice").hidden = mode !== "notice";
  $("#notice").textContent = msg;
  $("#decide").hidden = mode !== "decide";
  $("#decide").innerHTML = dec;
  $("#send").disabled = S.busy;
  $("#attach").disabled = S.busy;
  $("#input").disabled = S.busy;
}

function clearPendingFile() {
  if (S.previewUrl) URL.revokeObjectURL(S.previewUrl);
  S.previewUrl = "";
  S.pendingFile = null;
  $("#fileInput").value = "";
  renderComposer();
}

function autosize() {
  const el = $("#input");
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function setFbar(pct, label) {
  $("#fbar").hidden = false;
  $("#fbarIn").style.width = pct + "%";
  $("#fbarTxt").textContent = label;
}

function hideFbar() {
  $("#fbar").hidden = true;
  $("#fbarIn").style.width = "0";
}

function cancelCtx() {
  S.reply = null;
  if (S.editingId) {
    S.editingId = null;
    $("#input").value = "";
    autosize();
  }
  renderComposer();
}

function setReply(id) {
  const rec = S.map.get(id);
  if (!rec) return;
  const d = rec.d;
  const text = d.deleted
    ? "تم حذف الرسالة"
    : (d.text || (d.attachment ? "📎 " + (d.attachment.name || "مرفق") : "")).slice(0, 140);
  S.reply = { id, senderUid: d.senderUid, name: realName(d.senderUid), text };
  S.editingId = null;
  renderComposer();
  $("#input").focus();
}

function startEdit(id) {
  const rec = S.map.get(id);
  if (!rec) return;
  S.editingId = id;
  S.reply = null;
  $("#input").value = rec.d.text || "";
  autosize();
  renderComposer();
  $("#input").focus();
}

function copyText(t) {
  if (!t) return;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject(new Error("no clipboard")))
    .then(() => toast("تم النسخ"))
    .catch(() => toast("تعذر النسخ"));
}

/* ================= Read state & ticks ================= */
async function markRead() {
  if (S.kind !== "chat" || !S.exists || !S.data || S.marking) return;
  const d = S.data;
  if (!d.lastMessageAt || d.lastSenderUid === S.me) return;
  if (millis(d.readAt && d.readAt[S.me]) >= millis(d.lastMessageAt)) return;
  S.marking = true;
  try {
    await updateDoc(threadRef(), { ["readAt." + S.me]: serverTimestamp() });
  } catch (e) {
    console.warn("markRead:", e);
  } finally {
    S.marking = false;
  }
}

function maybeMarkRead() {
  if (S.kind !== "chat" || !S.loaded || !S.followBottom || document.hidden) return;
  markRead();
}

function applyTicks() {
  if (S.kind !== "chat") return;
  for (const [id, el] of S.els) {
    const rec = S.map.get(id);
    if (!rec || rec.d.senderUid !== S.me) continue;
    const icon = el.querySelector(".ticks i");
    if (!icon) continue;
    const seen = S.otherReadMs > 0 && rec.t <= S.otherReadMs;
    icon.className = seen ? "fa-solid fa-check-double" : "fa-solid fa-check";
    icon.parentElement.classList.toggle("seen", seen);
  }
}

/* ================= Message list (ordered, incremental) ================= */
function lowerBound(t) {
  let lo = 0, hi = S.order.length;
  while (lo < hi) {
    const m = (lo + hi) >> 1;
    if (S.order[m].t < t) lo = m + 1;
    else hi = m;
  }
  return lo;
}

function indexOfId(id, t) {
  let i = lowerBound(t);
  while (i < S.order.length && S.order[i].t === t) {
    if (S.order[i].id === id) return i;
    i++;
  }
  return -1;
}

function insertOrder(id, t) {
  S.order.splice(lowerBound(t), 0, { id, t });
}

const DAY_STYLE = "align-self:center;background:rgba(0,0,0,.14);color:#fff;font-size:12px;padding:3px 10px;border-radius:8px;margin:12px 0 4px";

function dayStr(t) {
  return new Date(t).toDateString();
}

function dayLabel(t) {
  const d = new Date(t), now = new Date();
  const y = new Date(now);
  y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return "اليوم";
  if (d.toDateString() === y.toDateString()) return "أمس";
  return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
}

function nl2br(s) {
  return s.replace(/\n/g, "<br>");
}

function attachHTML(id, a) {
  const ft = fileType(a);
  if (ft === "image") {
    return `<div class="att att-img" data-open="${id}"><img src="${esc(tx(a.url, "w_520,h_360,c_limit,q_auto,f_auto"))}" alt="" loading="lazy"></div>`;
  }
  if (ft === "video") {
    const th = vthumb(a.url);
    return `<div class="att att-vid" data-open="${id}">${th ? `<img src="${esc(th)}" alt="" loading="lazy">` : ""}<div class="play"><i class="fa-solid fa-play"></i></div></div>`;
  }
  return `<div class="att att-file" data-open="${id}"><span class="ficon"><i class="fa-solid ${ficonClass(a)}"></i></span><div class="fmeta"><b>${esc(a.name || "ملف")}</b><small>${fmtSize(a.size || 0)}</small></div></div>`;
}

function reactHTML(r) {
  if (!r) return "";
  const groups = new Map();
  for (const [uid, em] of Object.entries(r)) {
    if (!em) continue;
    const g = groups.get(em) || { n: 0, mine: false };
    g.n++;
    if (uid === S.me) g.mine = true;
    groups.set(em, g);
  }
  if (!groups.size) return "";
  return `<div class="reacts">${[...groups].map(([em, g]) => `<span class="rc${g.mine ? " mine" : ""}">${esc(em)} ${g.n}</span>`).join("")}</div>`;
}

function rowHTML(id, d, t, grouped) {
  const mine = d.senderUid === S.me;
  if (!mine) getUser(d.senderUid);
  const sname = mine
    ? ""
    : `<div class="sname" data-profile="${esc(d.senderUid)}" data-sn="${esc(d.senderUid)}">${esc(realName(d.senderUid))}</div>`;
  const quote = d.replyTo
    ? `<div class="quote" data-jump="${esc(d.replyTo.id)}"><b>${esc(d.replyTo.name || "")}</b><span>${esc(d.replyTo.text || "")}</span></div>`
    : "";
  const att = d.attachment && !d.deleted ? attachHTML(id, d.attachment) : "";
  const txt = d.deleted
    ? `<div class="txt deleted">تم حذف الرسالة</div>`
    : d.text ? `<div class="txt">${nl2br(esc(d.text))}</div>` : "";
  const reacts = d.deleted ? "" : reactHTML(d.reactions);
  const ticks = mine ? `<span class="ticks"><i class="fa-solid fa-check"></i></span>` : "";
  const meta = `<div class="meta">${d.isEdited && !d.deleted ? "<span>معدّلة</span>" : ""}<span>${fmtTime(t)}</span>${ticks}</div>`;
  return `<div class="row ${mine ? "mine" : "theirs"}${grouped ? " grouped" : ""}"><div class="bwrap"><div class="bubble">${sname}${quote}${att}${txt}${reacts}${meta}</div></div></div>`;
}

function paintEntry(el, id, i, rec) {
  const prev = i > 0 ? S.map.get(S.order[i - 1].id) : null;
  const newDay = !prev || dayStr(prev.t) !== dayStr(rec.t);
  const grouped = !newDay && prev.d.senderUid === rec.d.senderUid && rec.t - prev.t < GROUP_GAP_MS;
  const sig = `${grouped ? 1 : 0}|${newDay ? dayStr(rec.t) : ""}|${rec.t}|` + JSON.stringify([
    rec.d.senderUid, rec.d.text, rec.d.deleted, rec.d.isEdited, rec.d.attachment, rec.d.replyTo, rec.d.reactions,
  ]);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = (newDay ? `<div class="day" style="${DAY_STYLE}">${dayLabel(rec.t)}</div>` : "")
    + rowHTML(id, rec.d, rec.t, grouped);
}

function placeAndPaint(id) {
  const rec = S.map.get(id);
  if (!rec) return;
  const i = indexOfId(id, rec.t);
  if (i < 0) return;
  const rows = $("#rows");
  let el = S.els.get(id);
  if (!el) {
    el = document.createElement("div");
    el.className = "mrow";
    el.dataset.id = id;
    S.els.set(id, el);
  }
  let next = null;
  for (let k = i + 1; k < S.order.length; k++) {
    const e = S.els.get(S.order[k].id);
    if (e) { next = e; break; }
  }
  if (el.parentNode !== rows || el.nextSibling !== next) rows.insertBefore(el, next);
  paintEntry(el, id, i, rec);
}

function applyMessageChanges(snap) {
  const touched = new Set();
  let incoming = 0;
  for (const c of snap.docChanges()) {
    const id = c.doc.id;
    if (c.type === "removed") {
      const prev = S.map.get(id);
      if (!prev) continue;
      const i = indexOfId(id, prev.t);
      if (i > 0) touched.add(S.order[i - 1].id);
      if (i >= 0) S.order.splice(i, 1);
      S.map.delete(id);
      const el = S.els.get(id);
      if (el) el.remove();
      S.els.delete(id);
      continue;
    }
    const d = c.doc.data();
    const t = millis(d.createdAt) || Date.now();
    const prev = S.map.get(id);
    if (!prev) {
      insertOrder(id, t);
      if (d.senderUid !== S.me) incoming++;
    } else if (prev.t !== t) {
      const i = indexOfId(id, prev.t);
      if (i >= 0) S.order.splice(i, 1);
      insertOrder(id, t);
    }
    S.map.set(id, { d, t });
    touched.add(id);
  }

  const repaint = new Set();
  for (const id of touched) {
    if (!S.map.has(id)) continue;
    const i = indexOfId(id, S.map.get(id).t);
    if (i < 0) continue;
    repaint.add(id);
    if (i + 1 < S.order.length) repaint.add(S.order[i + 1].id);
  }
  for (const id of repaint) placeAndPaint(id);

  const wrap = $("#threadWrap");
  S.hasMore = snap.size >= S.windowSize;
  if (S.loadingOlder) {
    wrap.scrollTop += wrap.scrollHeight - S.anchorH;
    S.loadingOlder = false;
  } else if (S.forceBottom || S.followBottom) {
    wrap.scrollTop = wrap.scrollHeight;
    S.forceBottom = false;
    S.followBottom = true;
    S.newBelow = 0;
  } else if (incoming) {
    S.newBelow += incoming;
  }
  updateJump();
  applyTicks();
  maybeMarkRead();
}

function subscribeMessages() {
  if (S.msgUnsub) return;
  const token = S.token;
  if (!S.map.size) S.forceBottom = true;
  const q = query(msgsCol(), orderBy("createdAt"), limitToLast(S.windowSize));
  S.msgUnsub = onSnapshot(
    q,
    (snap) => {
      if (token === S.token) applyMessageChanges(snap);
    },
    (err) => {
      console.error("messages:", err);
      toast("تعذر تحميل الرسائل");
    }
  );
}

function restartMessages() {
  if (S.msgUnsub) {
    S.msgUnsub();
    S.msgUnsub = null;
  }
  subscribeMessages();
}

function loadOlder() {
  if (!S.hasMore || S.loadingOlder || !S.msgUnsub) return;
  S.loadingOlder = true;
  S.anchorH = $("#threadWrap").scrollHeight;
  S.windowSize += PAGE_SIZE;
  restartMessages();
}

function updateJump() {
  const j = $("#jump");
  j.hidden = S.followBottom || S.kind == null;
  const n = $("#jumpN");
  n.hidden = !S.newBelow;
  n.textContent = S.newBelow > 99 ? "99+" : String(S.newBelow);
}

function scrollToBottom() {
  const wrap = $("#threadWrap");
  wrap.scrollTop = wrap.scrollHeight;
  S.followBottom = true;
  S.newBelow = 0;
  updateJump();
  maybeMarkRead();
}

function scrollToMsg(id) {
  const el = S.els.get(id);
  if (!el) {
    toast("الرسالة غير محمّلة");
    return;
  }
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  const row = el.querySelector(".row");
  if (!row) return;
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1300);
}

function onThreadScroll() {
  const wrap = $("#threadWrap");
  const dist = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight;
  S.followBottom = dist < 80;
  if (S.followBottom) S.newBelow = 0;
  updateJump();
  if (S.followBottom) maybeMarkRead();
  if (wrap.scrollTop < 150) loadOlder();
}

function onRowsClick(e) {
  const open = e.target.closest("[data-open]");
  if (open) return openViewerFor(open.dataset.open);
  const jump = e.target.closest("[data-jump]");
  if (jump) return scrollToMsg(jump.dataset.jump);
  const prof = e.target.closest("[data-profile]");
  if (prof) return goProfile(prof.dataset.profile);
  const bub = e.target.closest(".bubble");
  if (bub) {
    const row = bub.closest(".mrow");
    if (row) openSheet(row.dataset.id);
  }
}

/* ================= Message options sheet ================= */
function actBtn(a, icon, label, cls = "") {
  return `<button class="sh-act ${cls}" data-act="${a}"><i class="fa-solid ${icon}"></i>${label}</button>`;
}

function openSheet(id) {
  const rec = S.map.get(id);
  if (!rec || rec.d.deleted) return;
  S.sheetId = id;
  const mine = rec.d.senderUid === S.me;
  const can = canSend();
  $("#shEmojis").innerHTML = can
    ? EMOJIS.map((e) => `<button data-em="${e}" aria-label="تفاعل">${e}</button>`).join("")
    : "";
  const acts = [];
  if (can) acts.push(actBtn("reply", "fa-reply", "رد"));
  if (rec.d.text) acts.push(actBtn("copy", "fa-copy", "نسخ"));
  if (mine && !rec.d.attachment) acts.push(actBtn("edit", "fa-pen", "تعديل"));
  if (mine) acts.push(actBtn("delete", "fa-trash", "حذف", "danger"));
  $("#shActions").innerHTML = acts.join("");
  $("#sheet").hidden = false;
  $("#sheetBg").hidden = false;
}

function closeSheet() {
  $("#sheet").hidden = true;
  $("#sheetBg").hidden = true;
  S.sheetId = null;
}

function runAct(id, a) {
  if (!id) return;
  if (a === "reply") setReply(id);
  else if (a === "copy") copyText((S.map.get(id) || { d: {} }).d.text || "");
  else if (a === "edit") startEdit(id);
  else if (a === "delete") deleteMsg(id);
}

async function toggleReaction(id, em) {
  const rec = S.map.get(id);
  if (!rec) return;
  const cur = (rec.d.reactions || {})[S.me];
  const val = cur === em ? deleteField() : em;
  try {
    await updateDoc(msgRef(id), { [`reactions.${S.me}`]: val });
  } catch (e) {
    console.error("reaction:", e);
    toast("تعذر التفاعل");
  }
}

async function saveEdit(text) {
  const id = S.editingId;
  if (!id) return;
  if (!text) {
    toast("لا يمكن أن تكون الرسالة فارغة");
    return;
  }
  try {
    await updateDoc(msgRef(id), { text, isEdited: true, editedAt: serverTimestamp() });
    if (S.data && S.data.lastMessageId === id) {
      await updateDoc(threadRef(), { lastMessage: text.slice(0, 120) });
    }
    S.editingId = null;
    $("#input").value = "";
    autosize();
    renderComposer();
  } catch (e) {
    console.error("edit:", e);
    toast("تعذر حفظ التعديل");
  }
}

async function deleteMsg(id) {
  if (!confirm("حذف هذه الرسالة؟")) return;
  try {
    await updateDoc(msgRef(id), { text: "", deleted: true, deletedAt: serverTimestamp(), attachment: null });
    if (S.data && S.data.lastMessageId === id) {
      await updateDoc(threadRef(), { lastMessage: "تم حذف الرسالة" });
    }
  } catch (e) {
    console.error("delete:", e);
    toast("تعذر حذف الرسالة");
  }
}

/* ================= Sending ================= */
function uploadAttachment(file) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", CLOUD_URL);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        setFbar(pct, "جارٍ الرفع… " + pct + "%");
      }
    };
    xhr.onload = () => {
      let j = {};
      try { j = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300 && j.secure_url) {
        const isImg = file.type.startsWith("image/");
        const att = {
          kind: isImg ? "image" : "file",
          url: j.secure_url,
          name: String(file.name || "ملف").slice(0, 255),
          size: file.size,
          mime: file.type || "",
        };
        if (isImg && j.width && j.height) {
          att.w = j.width;
          att.h = j.height;
        }
        resolve(att);
      } else {
        reject(new Error("upload failed " + xhr.status));
      }
    };
    xhr.onerror = () => reject(new Error("network"));
    xhr.send(fd);
  });
}

async function sendMessage(text, attachment, reply) {
  const tref = threadRef();
  const mid = doc(msgsCol()).id;

  if (S.kind === "chat" && !S.exists) {
    await setDoc(tref, {
      participants: [S.me, S.otherUid].sort(),
      createdAt: serverTimestamp(),
      status: "pending",
      requesterUid: S.me,
      readAt: { [S.me]: serverTimestamp() },
    });
  }

  const msg = {
    senderUid: S.me,
    text,
    createdAt: serverTimestamp(),
    isEdited: false,
    deleted: false,
    replyTo: reply ? { id: reply.id, senderUid: reply.senderUid, name: reply.name, text: reply.text } : null,
    reactions: {},
    attachment,
  };
  const preview = (text || (attachment ? "📎 " + attachment.name : "")).slice(0, 120);

  const batch = writeBatch(db);
  batch.set(doc(msgsCol(), mid), msg);
  batch.update(tref, {
    lastMessage: preview,
    lastMessageAt: serverTimestamp(),
    lastSenderUid: S.me,
    lastMessageId: mid,
  });
  await batch.commit();
}

async function onSend() {
  if (S.busy || !S.id) return;
  const st = computeState();
  if (st !== "new" && st !== "active") return;
  const input = $("#input");
  const text = input.value.trim();

  if (S.editingId) {
    await saveEdit(text);
    return;
  }

  const file = S.pendingFile;
  if (!text && !file) return;
  if (text.length > MAX_TEXT) {
    toast("الرسالة أطول من 2000 حرف");
    return;
  }

  const reply = S.reply;
  S.busy = true;
  renderComposer();
  try {
    let attachment = null;
    if (file) {
      setFbar(0, "جارٍ الرفع…");
      attachment = await uploadAttachment(file);
    }
    S.forceBottom = true;
    await sendMessage(text, attachment, reply);
    input.value = "";
    autosize();
    S.reply = null;
    clearPendingFile();
  } catch (e) {
    console.error("send:", e);
    toast(file ? "تعذر رفع الملف أو إرسال الرسالة" : "تعذر إرسال الرسالة");
  } finally {
    hideFbar();
    S.busy = false;
    renderComposer();
  }
}

function onFilePicked() {
  const input = $("#fileInput");
  const f = input.files && input.files[0];
  if (!f) return;
  if (!f.size) {
    toast("الملف فارغ");
    input.value = "";
    return;
  }
  if (f.size > MAX_FILE) {
    toast("الحد الأقصى للملف 10 ميغابايت");
    input.value = "";
    return;
  }
  if (S.previewUrl) URL.revokeObjectURL(S.previewUrl);
  S.pendingFile = f;
  S.previewUrl = f.type.startsWith("image/") ? URL.createObjectURL(f) : "";
  renderComposer();
}

/* ================= Requests, membership, rooms ================= */
async function acceptRequest() {
  try {
    await updateDoc(threadRef(), { status: "active", acceptedAt: serverTimestamp() });
  } catch (e) {
    console.error("accept:", e);
    toast("تعذر قبول الطلب");
  }
}

async function blockRequest() {
  if (!confirm("حظر هذا المستخدم؟ لن تصلك رسائله بعد الآن.")) return;
  try {
    await updateDoc(threadRef(), { status: "blocked", blockedBy: S.me, blockedAt: serverTimestamp() });
  } catch (e) {
    console.error("block:", e);
    toast("تعذر الحظر");
  }
}

async function joinRoom(id) {
  if (!id) return;
  try {
    await updateDoc(doc(db, "rooms", id), { members: arrayUnion(S.me), memberCount: increment(1) });
    S.publicRooms = S.publicRooms.filter((r) => r.id !== id);
    S.discoverHtml = "";
    if (S.id !== id || S.kind !== "room") openThread("room", id);
  } catch (e) {
    console.error("join:", e);
    toast("تعذر الانضمام");
  }
}

async function createRoom() {
  const name = $("#cName").value.trim();
  const hint = $("#cHint");
  hint.textContent = "";
  if (name.length < 2) {
    hint.textContent = "اكتب اسماً من حرفين على الأقل";
    return;
  }
  const btn = $("#cSave");
  btn.disabled = true;
  try {
    const ref = await addDoc(collection(db, "rooms"), {
      kind: $("#cKind").value,
      name,
      desc: $("#cDesc").value.trim().slice(0, 200),
      ownerUid: S.me,
      admins: [],
      members: [S.me],
      memberCount: 1,
      isPublic: $("#cPublic").checked,
      createdAt: serverTimestamp(),
    });
    $("#cName").value = "";
    $("#cDesc").value = "";
    $("#createPanel").hidden = true;
    openThread("room", ref.id);
  } catch (e) {
    console.error("createRoom:", e);
    hint.textContent = "تعذر إنشاء المساحة. تحقق من قواعد Firestore.";
  } finally {
    btn.disabled = false;
  }
}

function onComposerClick(e) {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.id === "acceptBtn") acceptRequest();
  else if (t.id === "blockBtn") blockRequest();
  else if (t.id === "joinBtn") joinRoom(S.id);
  else if (t.id === "fileRemove") clearPendingFile();
}

/* ================= Viewer ================= */
const TYPE_LABEL = { image: "صورة", video: "فيديو", audio: "صوت", pdf: "PDF", office: "مستند", text: "نص", other: "ملف" };

function setDisabled(id, v) {
  const el = $("#" + id);
  el.disabled = v;
  el.style.opacity = v ? ".35" : "";
}

function applyXf() {
  const img = $("#vstage img");
  if (img) img.style.transform = `translate(${S.px}px,${S.py}px) rotate(${S.rot}deg) scale(${S.zoom})`;
}

function setZoom(z) {
  S.zoom = Math.max(0.5, Math.min(5, Math.round(z * 100) / 100));
  if (S.zoom <= 1) { S.px = 0; S.py = 0; }
  applyXf();
}

function applyRate() {
  const rate = SPEEDS[S.speedIdx];
  $("#vspeedTxt").textContent = rate + "×";
  const m = document.querySelector("#vstage video, #vstage audio");
  if (m) m.playbackRate = rate;
}

function openViewerFor(id) {
  const gallery = [];
  for (const o of S.order) {
    const rec = S.map.get(o.id);
    if (rec && rec.d.attachment && !rec.d.deleted) gallery.push({ id: o.id, att: rec.d.attachment });
  }
  const idx = gallery.findIndex((g) => g.id === id);
  if (idx < 0) return;
  S.gallery = gallery;
  $("#viewer").hidden = false;
  showViewer(idx);
}

function showViewer(idx) {
  const n = S.gallery.length;
  if (!n) return;
  S.viewerIdx = ((idx % n) + n) % n;
  const a = S.gallery[S.viewerIdx].att;
  const ft = fileType(a);
  const token = ++S.viewToken;
  S.zoom = 1; S.rot = 0; S.px = 0; S.py = 0;

  const stage = $("#vstage");
  stage.replaceChildren();
  $("#vtTitle").textContent = a.name || "ملف";
  $("#vtSub").textContent = `${TYPE_LABEL[ft] || "ملف"} · ${fmtSize(a.size || 0)} · ${S.viewerIdx + 1}/${n}`;
  $("#vopen").href = a.url;
  $("#vdown").href = dlUrl(a.url);
  $("#vdown").setAttribute("download", a.name || "");
  $("#vprev").hidden = n < 2;
  $("#vnext").hidden = n < 2;
  setDisabled("vrotate", ft !== "image");
  setDisabled("vzoomIn", ft !== "image");
  setDisabled("vzoomOut", ft !== "image");
  setDisabled("vreset", ft !== "image");
  setDisabled("vspeed", ft !== "video" && ft !== "audio");
  $("#vspeedTxt").textContent = SPEEDS[S.speedIdx] + "×";

  if (ft === "image") {
    const img = document.createElement("img");
    img.alt = a.name || "";
    img.src = a.url;
    stage.appendChild(img);
    applyXf();
  } else if (ft === "video") {
    const v = document.createElement("video");
    v.src = a.url;
    v.controls = true;
    v.playsInline = true;
    v.preload = "metadata";
    v.playbackRate = SPEEDS[S.speedIdx];
    stage.appendChild(v);
  } else if (ft === "audio") {
    const au = document.createElement("audio");
    au.src = a.url;
    au.controls = true;
    au.playbackRate = SPEEDS[S.speedIdx];
    stage.appendChild(au);
  } else if (ft === "pdf") {
    stage.innerHTML = `<iframe class="docframe" src="${esc(a.url)}" title="${esc(a.name || "")}"></iframe>`;
  } else if (ft === "office") {
    const src = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(a.url);
    stage.innerHTML = `<iframe class="docframe" src="${esc(src)}" title="${esc(a.name || "")}"></iframe>`;
  } else if (ft === "text") {
    const pre = document.createElement("div");
    pre.className = "textview";
    pre.textContent = "جارٍ التحميل…";
    stage.appendChild(pre);
    fetch(a.url)
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then((t) => {
        if (token !== S.viewToken) return;
        pre.textContent = t.length > 300000
          ? t.slice(0, 300000) + "\n\n… (عرض أول 300 ألف حرف، حمّل الملف لعرضه كاملاً)"
          : t;
      })
      .catch(() => {
        if (token === S.viewToken) pre.textContent = "تعذر تحميل النص. يمكنك فتح الأصل أو تنزيله.";
      });
  } else {
    stage.innerHTML = `
      <div class="file-card">
        <span class="ficon big"><i class="fa-solid ${ficonClass(a)}"></i></span>
        <b>${esc(a.name || "ملف")}</b>
        <small>${fmtSize(a.size || 0)}</small>
        <div class="btns">
          <a class="btn ok" href="${esc(a.url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح الأصل</a>
          <a class="btn ghost" href="${esc(dlUrl(a.url))}"><i class="fa-solid fa-download"></i> تنزيل</a>
        </div>
      </div>`;
  }
}

function closeViewer() {
  S.viewToken++;
  $("#vstage").replaceChildren();
  $("#viewer").hidden = true;
  S.gallery = [];
  S.viewerIdx = -1;
}

/* ================= Thread lifecycle ================= */
function threadRef() {
  return S.kind === "room" ? doc(db, "rooms", S.id) : doc(db, "chats", S.id);
}

function msgsCol() {
  return collection(threadRef(), "messages");
}

function msgRef(id) {
  return doc(msgsCol(), id);
}

async function deleteUnusedGuard() {}

function refreshState() {
  if (!S.id) return;
  const st = computeState();
  const needMsgs = ["wait", "decide", "active", "readonly", "blocked"].includes(st);
  if (needMsgs && !S.msgUnsub) subscribeMessages();
  else if (!needMsgs && S.msgUnsub) {
    S.msgUnsub();
    S.msgUnsub = null;
  }
  paintHeader();
  renderIntro();
  renderComposer();
  applyTicks();
  scheduleList();
  maybeMarkRead();
}

function bind() {
  $("#search").addEventListener("input", (e) => {
    const v = e.target.value;
    S.listQuery = v;
    clearTimeout(S.searchTimer);
    S.searchTimer = setTimeout(() => runUserSearch(v), 250);
    scheduleList();
  });

  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (!b) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === b));
    scheduleList();
  });

  $("#chatList").addEventListener("click", (e) => {
    const it = e.target.closest(".item");
    if (!it) return;
    const id = it.dataset.id;
    if (it.dataset.kind === "room") {
      if (S.id !== id || S.kind !== "room") openThread("room", id);
      return;
    }
    const d = S.chats.get(id);
    const other = d && (d.participants || []).find((x) => x !== S.me);
    if (other && (S.id !== id || S.kind !== "chat")) openChat(other);
  });

  $("#discover").addEventListener("click", (e) => {
    const b = e.target.closest("[data-join]");
    if (b) joinRoom(b.dataset.join);
  });

  $("#results").addEventListener("click", (e) => {
    const r = e.target.closest("[data-uid]");
    if (r) openFromSearch(r.dataset.uid);
  });

  $("#newRoomBtn").addEventListener("click", () => {
    $("#createPanel").hidden = false;
    $("#cHint").textContent = "";
    $("#cName").focus();
  });
  $("#cBack").addEventListener("click", () => { $("#createPanel").hidden = true; });
  $("#cSave").addEventListener("click", createRoom);

  $("#backBtn").addEventListener("click", closeThread);
  $("#rinfo").addEventListener("click", () => {
    if (S.kind === "chat" && S.otherUid) goProfile(S.otherUid);
  });
  $("#rows").addEventListener("click", onRowsClick);
  $("#threadWrap").addEventListener("scroll", onThreadScroll, { passive: true });
  $("#jump").addEventListener("click", scrollToBottom);
  $("#composer").addEventListener("click", onComposerClick);
  $("#ctx").addEventListener("click", cancelCtx);
  $("#attach").addEventListener("click", () => $("#fileInput").click());
  $("#fileInput").addEventListener("change", onFilePicked);
  $("#send").addEventListener("click", onSend);
  $("#input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      onSend();
    }
  });
  $("#input").addEventListener("input", autosize);

  $("#sheetBg").addEventListener("click", closeSheet);
  $("#sheet").addEventListener("click", (e) => {
    const id = S.sheetId;
    const em = e.target.closest("[data-em]");
    if (em) {
      closeSheet();
      toggleReaction(id, em.dataset.em);
      return;
    }
    const a = e.target.closest("[data-act]");
    if (a) {
      closeSheet();
      runAct(id, a.dataset.act);
    }
  });

  $("#vclose").addEventListener("click", closeViewer);
  $("#vprev").addEventListener("click", () => showViewer(S.viewerIdx - 1));
  $("#vnext").addEventListener("click", () => showViewer(S.viewerIdx + 1));
  $("#vrotate").addEventListener("click", () => {
    S.rot = (S.rot + 90) % 360;
    applyXf();
  });
  $("#vzoomIn").addEventListener("click", () => setZoom(S.zoom + 0.25));
  $("#vzoomOut").addEventListener("click", () => setZoom(S.zoom - 0.25));
  $("#vreset").addEventListener("click", () => {
    S.zoom = 1; S.rot = 0; S.px = 0; S.py = 0;
    applyXf();
  });
  $("#vspeed").addEventListener("click", () => {
    S.speedIdx = (S.speedIdx + 1) % SPEEDS.length;
    applyRate();
  });

  const stage = $("#vstage");
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest("video,audio,iframe")) return;
    drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
    if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (S.zoom > 1) {
      S.px += e.clientX - drag.lx;
      S.py += e.clientY - drag.ly;
      applyXf();
    }
    drag.lx = e.clientX;
    drag.ly = e.clientY;
  });
  stage.addEventListener("pointerup", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = null;
    if (S.zoom <= 1 && S.gallery.length > 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      showViewer(S.viewerIdx + (dx < 0 ? 1 : -1));
    }
  });
  stage.addEventListener("pointercancel", () => { drag = null; });
  stage.addEventListener("dblclick", (e) => {
    if (e.target.closest("video,audio,iframe")) return;
    if (!$("#vstage img")) return;
    setZoom(S.zoom > 1 ? 1 : 2.5);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (!$("#viewer").hidden) closeViewer();
      else if (!$("#sheet").hidden) closeSheet();
      else if (S.reply || S.editingId) cancelCtx();
      return;
    }
    if (!$("#viewer").hidden && S.gallery.length > 1) {
      if (e.key === "ArrowLeft") showViewer(S.viewerIdx + 1);
      else if (e.key === "ArrowRight") showViewer(S.viewerIdx - 1);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) maybeMarkRead();
  });
}

function init() {
  bind();
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      location.replace(LOGIN_PAGE);
      return;
    }
    if (S.started) return;
    S.started = true;
    S.me = user.uid;
    getUser(S.me);
    startLists();
    loadDiscover();
    const uid = new URLSearchParams(location.search).get("uid");
    if (uid && uid !== S.me) openChat(uid);
  });
}

init();
</script>
