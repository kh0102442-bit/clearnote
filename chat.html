<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152741">
<title>ClearNote · الدردشات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152741; --navy-dark:#0f1e33; --accent:#a8741a;
  --bg:#f4f6f8; --chat-bg:#efeae2; --mine:#d9fdd3; --red:#b91c1c;
  --line:#e6e9ee; --muted:#6b7480; --text:#1b2433;
  --shadow:0 2px 10px rgba(15,30,51,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;direction:rtl}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}

.app{height:100vh;height:100dvh;display:flex;overflow:hidden}

/* ================= قائمة الدردشات ================= */
.list-col{width:100%;height:100%;display:flex;flex-direction:column;background:#fff;min-width:0}
.lhdr{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--navy);color:#fff;box-shadow:var(--shadow)}
.lhdr h1{font-size:18px;font-weight:800;flex:1}
.hbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.12)}

.search{margin:10px 12px 6px;position:relative;flex:0 0 auto}
.search i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:21px;padding:0 38px 0 14px;background:#f5f7f9;outline:none;transition:.15s}
.search input:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(21,39,65,.08)}

.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
  flex:0 0 auto;border-bottom:1px solid var(--line);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;scroll-snap-align:start;
  padding:8px 14px;border-radius:18px;background:#eef1f5;color:#334;
  font-size:13px;font-weight:700;white-space:nowrap;transition:.15s;
  display:flex;align-items:center;gap:5px;
}
.tab:hover{background:#e3e8ee}
.tab.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(21,39,65,.25)}
.tab i{font-size:12px}

.list-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sec-title{padding:10px 14px 4px;font-size:12px;color:var(--muted);font-weight:700}
.res-hint{padding:6px 14px;font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #f1f3f6;content-visibility:auto;contain-intrinsic-size:auto 68px;transition:.1s}
.item:hover{background:#f7f9fb}
.item.sel{background:#eef3f9}
.item .av{width:50px;height:50px;border-radius:50%;flex:0 0 50px;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.item .av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.top,.bot{display:flex;align-items:center;gap:6px;min-width:0}
.nm{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:12px;color:var(--muted);flex:0 0 auto}
.pv{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.unread .pv.strong{color:#111;font-weight:700}
.item.unread .tm{color:var(--accent);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.tag{flex:0 0 auto;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f5;color:#334;font-weight:700;white-space:nowrap}
.tag.gold{background:#fbf1de;color:#7a4f0c}
.vbadge{color:var(--accent);font-size:14px;flex:0 0 auto}

/* حالات فارغة احترافية */
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.empty .empty-ill{font-size:72px;color:#d1d8e0;margin-bottom:14px;line-height:1}
.empty h3{font-size:17px;color:var(--navy);margin-bottom:8px;font-weight:800}
.empty p{max-width:340px;margin:0 auto}

/* placeholder للتبويبات القادمة */
.soon-card{
  margin:20px 16px;padding:28px 20px;background:#fff;border-radius:16px;
  text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);
}
.soon-card .soon-icon{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#e7eef6,#d4dfe9);
  display:grid;place-items:center;margin:0 auto 16px;
  font-size:34px;color:var(--navy);
}
.soon-card h3{color:var(--navy);font-size:18px;margin-bottom:8px;font-weight:800}
.soon-card p{color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:18px}
.soon-card .soon-badge{
  display:inline-block;padding:6px 14px;background:#fff8e6;color:#7a4f0c;
  border-radius:20px;font-size:12px;font-weight:700;
}

.bottom-nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.bottom-nav a i{font-size:18px}
.bottom-nav a.on{color:var(--navy);font-weight:800}

/* ================= الغرفة ================= */
.main{position:fixed;inset:0;z-index:20;background:var(--chat-bg);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;min-width:0}
body.room-open .main{transform:none}
.empty-main{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#5b6472;text-align:center;padding:20px}
.empty-main i{font-size:48px;color:#b8c0ca}
.room{flex:1;display:flex;flex-direction:column;min-height:0}
.rhdr{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.back-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto;transition:.15s}
.back-btn:hover{background:rgba(255,255,255,.12)}
.rav{width:42px;height:42px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;cursor:pointer;flex:0 0 42px}
.rav img{width:100%;height:100%;object-fit:cover}
.rinfo{flex:1;min-width:0;cursor:pointer}
.rname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;min-width:0}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .vbadge{color:#e0b25a}
.rsub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thread-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;padding:6px 10px 12px}

.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px 16px;gap:6px}
.intro-av{width:104px;height:104px;border-radius:50%;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;margin-bottom:6px;box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer}
.intro-av img{width:100%;height:100%;object-fit:cover}
.intro-name{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.intro-role{font-size:13px;color:var(--accent);font-weight:700}
.intro-stats{display:flex;gap:28px;margin-top:6px}
.intro-stats div{display:flex;flex-direction:column;align-items:center}
.intro-stats b{font-size:16px}
.intro-stats span{font-size:12px;color:var(--muted)}
.intro-hint{font-size:12px;color:#5b6472;background:rgba(255,255,255,.75);border-radius:10px;padding:6px 12px;margin-top:8px;max-width:360px;line-height:1.7}

/* ===== تصميم الرسائل المحسن ===== */
.row{content-visibility:auto;contain-intrinsic-size:auto 60px}
.day{display:flex;justify-content:center;margin:14px 0 8px}
.day span{background:rgba(255,255,255,.9);padding:4px 14px;border-radius:12px;font-size:12px;color:#4d5663;box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:600}
.mrow{display:flex;margin:2px 0;padding:0 4px}
.mrow.head{margin-top:12px}
.mrow.mine{justify-content:flex-end}

.bubble{
  max-width:min(85%,540px);min-width:0;background:#fff;
  border-radius:16px;padding:8px 12px 6px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  cursor:pointer;transition:box-shadow .2s;
  position:relative;
}
.theirs.tail .bubble{border-top-right-radius:4px}
.mine .bubble{background:var(--mine)}
.mine.tail .bubble{border-top-left-radius:4px}

/* ذيل الفقاعة */
.bubble::before{
  content:'';position:absolute;top:0;width:12px;height:12px;
}
.theirs.tail .bubble::before{
  right:-8px;
  background:radial-gradient(circle at 100% 0, transparent 12px, #fff 12px);
}
.mine.tail .bubble::before{
  left:-8px;
  background:radial-gradient(circle at 0 0, transparent 12px, var(--mine) 12px);
}

.bubble.flash{box-shadow:0 0 0 3px rgba(168,116,26,.55)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6;color:#1a1a1a}
.deleted{font-style:italic;color:#7a808a;font-size:14px}

/* الاقتباس */
.quote{display:flex;flex-direction:column;gap:2px;border-inline-start:3px solid var(--accent);background:rgba(0,0,0,.04);border-radius:6px;padding:4px 8px;margin-bottom:4px;cursor:pointer;min-width:0}
.quote b{font-size:12px;color:var(--accent);font-weight:700}
.quote span{font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* التوقيت */
.meta{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:#7a808a;margin-top:4px;padding:0 2px}
.ticks{font-size:13px;color:#8a929c}
.ticks.seen{color:#34b7f1}

/* التفاعلات */
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rx.on{border-color:var(--accent);background:#fff8ea}
.rx small{font-size:11px;color:var(--muted);margin-inline-start:2px}

/* ================= المرفقات ================= */
.att-img{display:block;margin-bottom:4px;border-radius:10px;overflow:hidden;max-width:100%;position:relative;cursor:zoom-in;border:none;background:none;padding:0}
.att-img img{display:block;max-width:100%;max-height:340px;border-radius:10px;object-fit:cover}
.att-video{display:block;margin-bottom:4px;border-radius:10px;overflow:hidden;max-width:100%;position:relative;cursor:pointer;background:#000;aspect-ratio:16/9;width:280px;border:none;padding:0}
.att-video video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.att-video .play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.7);
  display:grid;place-items:center;color:#fff;font-size:24px;
  backdrop-filter:blur(4px);pointer-events:none;transition:.2s;
}
.att-video:hover .play-badge{background:rgba(168,116,26,.9);transform:translate(-50%,-50%) scale(1.1)}
.att-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.05);border-radius:10px;padding:10px 12px;margin-bottom:4px;text-decoration:none;color:inherit;min-width:0;cursor:pointer;width:100%;text-align:start;font:inherit;border:none;transition:.15s}
.att-file:hover{background:rgba(0,0,0,.08)}
.att-file i{font-size:24px;color:var(--navy);flex:0 0 auto}
.att-file span{display:flex;flex-direction:column;min-width:0;flex:1}
.att-file b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;font-weight:700}
.att-file small{font-size:12px;color:var(--muted)}
.att-pdf{background:rgba(185,28,28,.08)}
.att-pdf i{color:var(--red)}

.jump{position:absolute;bottom:12px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--navy);z-index:5}
.jump b{position:absolute;top:-6px;inset-inline-start:-4px;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:20px;text-align:center}

/* ===== صندوق الإرسال المحسن ===== */
.composer-wrap{flex:0 0 auto;background:#f0f2f5;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;box-shadow:0 -2px 10px rgba(0,0,0,.04)}
.ctx{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;border-inline-start:4px solid var(--accent)}
.ctx > div{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx b{font-size:13px;color:var(--accent)}
.ctx span{font-size:13px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#667;flex:0 0 auto;transition:.15s}
.icon-x:hover{background:rgba(0,0,0,.05)}

.filechip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;position:relative;overflow:hidden}
.filechip .fi{font-size:22px;color:var(--navy)}
.filechip .fn{flex:1;min-width:0;display:flex;flex-direction:column}
.filechip .fn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filechip .fn small{font-size:12px;color:var(--muted)}
.fbar{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--accent);width:0;transition:width .15s}

.notice{background:#fff;border-radius:10px;padding:12px;text-align:center;font-size:14px;color:#44505e;line-height:1.7}
.notice.red{color:var(--red)}
.decide{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.decide p{font-size:14px;text-align:center}
.decide .btns{display:flex;gap:8px}
.btn{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:14px}
.btn.ok{background:var(--navy);color:#fff}
.btn.no{background:#fde8e8;color:var(--red)}

.inputrow{display:flex;align-items:flex-end;gap:8px}
.attach{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#5a6470;flex:0 0 auto;font-size:18px;transition:.15s}
.attach:hover{background:#e5e8ec}

/* ===== textarea محسن ===== */
.inputrow textarea{
  flex:1;min-width:0;resize:none;border:none;outline:none;
  border-radius:22px;padding:11px 16px;background:#fff;
  min-height:44px;max-height:120px;
  line-height:22px;font-size:15px;
  transition:box-shadow .15s;
  overflow-y:auto;
  scrollbar-width:thin;
}
.inputrow textarea:focus{box-shadow:0 0 0 2px rgba(21,39,65,.1)}
.inputrow textarea::-webkit-scrollbar{width:6px}
.inputrow textarea::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

.send{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:16px;transition:.15s}
.send:hover{background:var(--navy-dark);transform:scale(1.05)}
.send:disabled{opacity:.45;cursor:default;transform:none}

/* ================= لوحة الخيارات ================= */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;width:min(440px,100%);transform:translate(-50%,105%);background:#fff;border-radius:18px 18px 0 0;z-index:51;padding:10px 14px calc(16px + env(safe-area-inset-bottom));transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.sheet.open{transform:translate(-50%,0)}
.sh-grip{width:40px;height:4px;border-radius:2px;background:#d6dbe2;margin:0 auto 10px}
.sh-emojis{display:flex;justify-content:space-between;gap:4px;margin-bottom:8px}
.sh-emojis button{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.sh-emojis button:hover{background:#f4f6f8}
.sh-emojis button.on{background:#fff3da;box-shadow:inset 0 0 0 2px var(--accent)}
.sh-actions{display:flex;flex-direction:column}
.sh-actions button{display:flex;align-items:center;gap:12px;padding:12px 8px;font-size:15px;border-radius:10px;text-align:start;transition:.15s}
.sh-actions button:hover{background:#f4f6f8}
.sh-actions i{width:20px;text-align:center;color:var(--navy)}
.sh-actions .danger,.sh-actions .danger i{color:var(--red)}

/* ================= عارض الوسائط الاحترافي ================= */
.media-viewer{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.96);
  display:flex;flex-direction:column;color:#fff;
}
.mv-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:rgba(0,0,0,.5);flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.mv-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;
  display:grid;place-items:center;font-size:16px;transition:.15s;
}
.mv-btn:hover{background:rgba(255,255,255,.22)}
.mv-title{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.mv-body > img{
  max-width:100%;max-height:100%;object-fit:contain;
  transition:transform .25s ease;cursor:zoom-in;
  user-select:none;-webkit-user-select:none;
}
.mv-body > img.zoomed{transform:scale(2.5);cursor:zoom-out}
.mv-body iframe{width:100%;height:100%;border:none;background:#fff}

.vp-wrap{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:#000;
}
.vp-video{flex:1;width:100%;min-height:0;background:#000;object-fit:contain}
.vp-ctrl{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:#111;
  border-top:1px solid rgba(255,255,255,.08);
}
.vp-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;
  display:grid;place-items:center;font-size:15px;transition:.15s;
}
.vp-btn:hover{background:rgba(168,116,26,.8)}
.vp-seek{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;background:#333;outline:none;cursor:pointer}
.vp-seek::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;
}
.vp-time{font-size:12px;font-family:monospace;color:#ccc;min-width:88px;text-align:center}
.vp-speed{
  background:#222;color:#fff;border:none;
  padding:6px 8px;border-radius:6px;font-size:12px;cursor:pointer;
}

.attach-sheet{
  position:fixed;bottom:0;left:50%;width:min(440px,100%);
  transform:translate(-50%,105%);background:#fff;
  border-radius:18px 18px 0 0;z-index:51;
  padding:12px 14px calc(16px + env(safe-area-inset-bottom));
  transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.15);
}
.attach-sheet.open{transform:translate(-50%,0)}
.attach-sheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.attach-sheet .item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;border-radius:12px;background:#f4f6f8;
  font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;transition:.15s;
  border:none;width:100%;
}
.attach-sheet .item:hover{background:#e7eef6;transform:translateY(-2px)}
.attach-sheet .item i{font-size:24px}
.attach-sheet .item.photo i{color:#e74c3c}
.attach-sheet .item.video i{color:#2980b9}
.attach-sheet .item.file i{color:#8e44ad}
.attach-sheet .item.camera i{color:#16a085}

/* ================= الإعدادات ================= */
.settings-modal{
  position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.settings-modal.open{opacity:1;pointer-events:auto}
.settings-box{
  background:#fff;width:100%;max-width:440px;
  border-radius:20px 20px 0 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s;
  max-height:85vh;overflow-y:auto;
}
.settings-modal.open .settings-box{transform:translateY(0)}
.settings-hdr{display:flex;align-items:center;gap:10px;padding:8px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.settings-hdr h3{flex:1;font-size:17px;color:var(--navy);font-weight:800}
.settings-close{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.15s}
.settings-close:hover{background:#f4f6f8}
.settings-item{
  display:flex;align-items:center;gap:12px;padding:14px 8px;
  border-radius:10px;cursor:pointer;transition:.15s;font-size:15px;
}
.settings-item:hover{background:#f4f6f8}
.settings-item i{width:24px;text-align:center;font-size:17px;color:var(--navy)}
.settings-item span{flex:1}
.settings-item .badge-on{font-size:11px;color:var(--green);font-weight:700}
.settings-item.danger,.settings-item.danger i{color:var(--red)}

/* ================= الشاشات الواسعة ================= */
@media (min-width:900px){
  .list-col{width:380px;flex:0 0 380px;border-inline-end:1px solid var(--line)}
  .bottom-nav{display:none}
  .back-btn{display:none}
  .main{position:relative;inset:auto;transform:none;flex:1;transition:none;z-index:auto}
  body:not(.has-room) .empty-main{display:flex}
  body:not(.has-room) .room{display:none}
  .bubble{max-width:min(70%,540px)}
}
</style>
</head>
<body>
<div class="app">

  <aside class="list-col" id="listCol">
    <header class="lhdr">
      <a class="hbtn" href="app.html" title="الرئيسية"><i class="fa-solid fa-house"></i></a>

    </header>

    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>

    <nav class="tabs" id="tabs">

      <button class="tab" data-tab="channels"><i class="fa-solid fa-bullhorn"></i> قنوات</button>
      <button class="tab" data-tab="communities"><i class="fa-solid fa-globe"></i> مجتمعات</button>

    <div class="list-scroll" id="listScroll">

    <nav class="bottom-nav">

  </aside>

  <main class="main" id="main">
    <div class="empty-main">

    <section class="room" id="room">
      <header class="rhdr">
        <button class="back-btn" id="backBtn" title="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <div class="rav" id="rav"></div>

          <div class="rname"><span id="rname"></span><i class="fa-solid fa-circle-check vbadge" id="rverified" hidden></i></div>

      <div class="thread-wrap">

      </div>

      <div class="composer-wrap" id="composer" hidden>
        <div class="ctx" id="ctx" hidden>
          <div><b id="ctxTitle"></b><span id="ctxText"></span></div>
          <button class="icon-x" id="ctxClose" title="إلغاء"><i class="fa-solid fa-xmark"></i></button>

        <div class="filechip" id="filechip" hidden>
          <i class="fa-solid fa-file fi" id="fchipIcon"></i>
          <div class="fn"><b id="fchipName"></b><small id="fchipSize"></small></div>
          <button class="icon-x" id="fchipX" title="إزالة"><i class="fa-solid fa-xmark"></i></button>

        <div class="decide" id="decide" hidden>
          <p id="decideText"></p>
          <div class="btns">
            <button class="btn ok" id="acceptBtn">موافقة</button>

        <div class="inputrow" id="inputrow">
          <button class="attach" id="attach" title="إرفاق ملف"><i class="fa-solid fa-paperclip"></i></button>
          <textarea id="input" rows="1" maxlength="2000" placeholder="اكتب رسالة"></textarea>

</div>

<input type="file" id="fileInput" hidden>

<!-- لوحة الرد/التفاعل -->

<script type="module">
import { auth, db, showToast } from './shared.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  collection, doc, getDoc, getDocs, onSnapshot, query, where, orderBy, limit,
  writeBatch, updateDoc, serverTimestamp, deleteField, deleteDoc
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ================= ثوابت ================= */
const LOGIN_PAGE = 'index.html';
const PROFILE_PAGE = 'profile.html';
const PAGE_SIZE = 30;
const CHAT_LIST_LIMIT = 300;
const MAX_TEXT = 2000;
const MAX_FILE = 50 * 1024 * 1024; // 50MB
const GROUP_GAP_MS = 5 * 60 * 1000;
const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
const CLOUD_URL = 'https://api.cloudinary.com/v1_1/nopxs3zt/auto/upload';
const CLOUD_PRESET = 'clearnote_unsigned';
const FOLLOWERS_KEY = 'followersCount';
const POSTS_KEY = 'postsCount';
const ROLE_LABEL = { admin: 'مشرف', moderator: 'مشرف', founder: 'المؤسس', member: 'عضو', user: 'عضو' };

const COMING_TABS = {
  groups: { icon: 'fa-users', title: 'الجروبات', desc: 'أنشئ جروباً للتواصل مع زملائك، وشاركوا الرسائل والملفات في مساحة خاصة بكم.', eta: 'قريباً' },
  channels: { icon: 'fa-bullhorn', title: 'القنوات', desc: 'تابع القنوات التعليمية وأرقى المحتوى من المدرسين والمبدعين.', eta: 'قريباً' },
  communities: { icon: 'fa-globe', title: 'المجتمعات', desc: 'مجتمعات كبيرة تجمع طلاباً من كل مكان، بنقاشات ومنشورات.', eta: 'قريباً' },
  study: { icon: 'fa-book-open', title: 'غرف المذاكرة', desc: 'ادرس مع أصدقائك في نفس الوقت، بمؤقت بومودورو مشترك.', eta: 'قريباً' }
};

/* ================= الحالة ================= */
const S = {
  me: null,
  tab: 'all',
  listQuery: '',
  chats: new Map(),
  listUnsub: null,
  activeId: null,
  otherUid: null,
  chatExists: false,
  chatData: null,
  otherReadMs: 0,
  roomUnsub: null,
  msgUnsub: null,
  windowSize: PAGE_SIZE,
  hasMore: true,
  loadingOlder: false,
  anchorH: null,
  ready: false,
  forceBottom: true,
  newBelow: 0,
  order: [],
  map: new Map(),
  reply: null,
  editingId: null,
  sheetId: null,
  pendingFile: null,
  uploading: false,
  thread: null,
  intro: null,
  mv: { url: null, name: null, videoEl: null, isZoomed: false }
};

/* ================= أدوات ================= */
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const toMs = (v) => {
  if (!v) return null;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (typeof v.seconds === 'number') return v.seconds * 1000;
  return null;
};

const chatIdFor = (a, b) => [a, b].sort().join('_');
const otherOf = (d) => (d.participants || []).find((x) => x !== S.me) || null;
const initialOf = (name) => (name || '?').trim().charAt(0) || '?';
const fmtTime = (ms) => new Date(ms).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate(); };
const fmtNum = (n) => Number(n || 0).toLocaleString('ar');
const roleLabel = (r) => ROLE_LABEL[r] || r || 'عضو';

function dayLabel(ms) {
  const now = Date.now();
  if (dayKey(ms) === dayKey(now)) return 'اليوم';
  if (dayKey(ms) === dayKey(now - 86400000)) return 'أمس';
  const d = new Date(ms);
  return d.toLocaleDateString('ar', {
    weekday: 'long', day: 'numeric', month: 'long',
    year: d.getFullYear() === new Date(now).getFullYear() ? undefined : 'numeric'
  });
}

function shortTime(ms) {
  return dayKey(ms) === dayKey(Date.now())
    ? fmtTime(ms)
    : new Date(ms).toLocaleDateString('ar', { day: 'numeric', month: 'numeric' });
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

function transformUrl(url, t) {
  return url && url.includes('/upload/') ? url.replace('/upload/', `/upload/${t}/`) : url;
}
const avatarSrc = (u, s) => (u && u.avatarUrl ? transformUrl(u.avatarUrl, `w_${s},h_${s},c_fill,q_auto,f_auto`) : '');
const thumbSrc = (url) => transformUrl(url, 'w_520,h_360,c_limit,q_auto,f_auto');

function fillAv(node, u, size) {
  const src = avatarSrc(u, size);
  const key = src + '|' + (u?.name || '');
  if (node._key === key) return;
  node._key = key;
  node.textContent = '';
  if (src) {
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'lazy';
    img.onerror = () => { img.remove(); node.textContent = initialOf(u.name); };
    img.src = src;
    node.appendChild(img);
  } else {
    node.textContent = initialOf(u?.name);
  }
}

function goProfile(uid) {
  if (!uid) return;
  location.href = uid === S.me ? PROFILE_PAGE : `${PROFILE_PAGE}?uid=${encodeURIComponent(uid)}`;
}

function fileKind(file) {
  const m = (file.type || '').toLowerCase();
  if (m.startsWith('image/')) return 'image';
  if (m.startsWith('video/')) return 'video';
  if (m.startsWith('audio/')) return 'audio';
  if (m === 'application/pdf') return 'pdf';
  return 'file';
}

function fileIcon(a) {
  const m = a.mime || '';
  if (m.includes('pdf')) return 'fa-file-pdf';
  if (m.startsWith('video/')) return 'fa-file-video';
  if (m.startsWith('audio/')) return 'fa-file-audio';
  return 'fa-file';
}

/* ================= المستخدمون ================= */
const userCache = new Map();
const userPending = new Map();

function normUser(uid, d) {
  return {
    uid,
    name: d.name || d.username || 'مستخدم',
    username: d.username || '',
    avatarUrl: d.avatarUrl || '',
    role: d.role || '',
    verified: d.verified === true || d.isVerified === true,
    followers: Number(d[FOLLOWERS_KEY]) || 0,
    posts: Number(d[POSTS_KEY]) || 0
  };
}

const placeholder = (uid) => normUser(uid, { name: '…' });

function fetchUser(uid) {
  if (userPending.has(uid)) return userPending.get(uid);
  const p = getDoc(doc(db, 'users', uid))
    .then((s) => normUser(uid, s.exists() ? s.data() : {}))
    .catch(() => normUser(uid, { name: 'مستخدم' }))
    .then((u) => {
      userCache.set(uid, u);
      userPending.delete(uid);
      onUserLoaded(uid);
      return u;
    });
  userPending.set(uid, p);
  return p;
}

function cachedUser(uid) {
  if (!uid) return null;
  const u = userCache.get(uid);
  if (u) return u;
  if (!userPending.has(uid)) fetchUser(uid);
  return null;
}

function onUserLoaded(uid) {
  scheduleList();
  if (S.otherUid === uid) { renderHeader(); renderIntro(); }
}

/* ================= الحالة ================= */
function needsRead(d) {
  if (!d || !S.me) return false;
  if ((d.status || 'active') === 'blocked') return false;
  if (d.lastSenderUid === S.me) return false;
  const last = toMs(d.lastMessageAt) ?? Date.now();
  const rv = d.readAt ? d.readAt[S.me] : undefined;
  const read = rv === undefined ? 0 : (toMs(rv) ?? Date.now());
  return last > read;
}

function roomState() {
  if (!S.activeId) return 'none';
  if (!S.chatExists || !S.chatData) return 'new';
  const st = S.chatData.status || 'active';
  if (st === 'blocked') return 'blocked';
  if (st === 'pending') return S.chatData.requesterUid === S.me ? 'wait' : 'decide';
  return 'active';
}

const canSend = () => { const s = roomState(); return s === 'new' || s === 'active'; };

/* ================= قائمة الدردشات ================= */
const listEls = new Map();
let listScheduled = false;

function scheduleList() {
  if (listScheduled) return;
  listScheduled = true;
  requestAnimationFrame(() => { listScheduled = false; renderList(); });
}

function visibleChats() {
  const q = S.listQuery.toLowerCase();
  const out = [];
  for (const [id, d] of S.chats) {
    if (!d.participants || !d.participants.includes(S.me)) continue;
    const st = d.status || 'active';
    if (st === 'blocked') continue;
    if (st === 'archived') continue; // أخفِ المؤرشفة
    if (S.tab === 'direct' && st !== 'active' && st !== 'archived') continue;
    if (S.tab === 'unread' && !needsRead(d)) continue;
    if (q) {
      const u = cachedUser(otherOf(d));
      if (!u || !(u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q))) continue;
    }
    out.push({ id, d, ms: toMs(d.lastMessageAt) ?? Date.now() });
  }
  out.sort((a, b) => b.ms - a.ms);
  return out;
}

function makeListRow() {
  const row = el('div', 'item');
  const av = el('div', 'av');
  av.dataset.profile = '';
  const info = el('div', 'info');
  const top = el('div', 'top');
  const nm = el('div', 'nm');
  const nmText = el('span');
  const vb = el('i', 'fa-solid fa-circle-check vbadge');
  nm.append(nmText, vb);
  const tm = el('span', 'tm');
  top.append(nm, tm);
  const bot = el('div', 'bot');
  const pv = el('div', 'pv');
  const tag = el('span', 'tag');
  const dot = el('span', 'dot');
  bot.append(pv, tag, dot);
  info.append(top, bot);
  row.append(av, info);
  row._r = { av, nm: nmText, vb, tm, pv, tag, dot };
  return row;
}

function previewOf(d) {
  const t = d.lastMessage || '';
  return d.lastSenderUid === S.me ? 'أنت: ' + t : t;
}

function paintListRow(row, id, d) {
  const r = row._r;
  const other = otherOf(d);
  const u = cachedUser(other);
  row.dataset.id = id;
  row.dataset.uid = other || '';
  row.classList.toggle('sel', id === S.activeId);
  fillAv(r.av, u || placeholder(other), 100);
  r.nm.textContent = u ? u.name : '…';
  r.vb.hidden = !(u && u.verified);
  r.tm.textContent = shortTime(toMs(d.lastMessageAt) ?? Date.now());
  const st = d.status || 'active';
  const incoming = st === 'pending' && d.requesterUid !== S.me;
  r.tag.hidden = st !== 'pending';
  r.tag.className = 'tag' + (incoming ? ' gold' : '');
  r.tag.textContent = incoming ? 'طلب مراسلة' : 'بانتظار الرد';
  const unread = needsRead(d);
  row.classList.toggle('unread', unread);
  r.dot.hidden = !unread;
  r.pv.classList.toggle('strong', unread);
  r.pv.textContent = previewOf(d);
}

function renderList() {
  if (!S.me) return;
  const list = $('chatList'), empty = $('listEmpty');
  const coming = COMING_TABS[S.tab];
  if (coming) {
    list.replaceChildren();
    empty.hidden = true;
    list.innerHTML = `
      <div class="soon-card">
        <div class="soon-icon"><i class="fa-solid ${coming.icon}"></i></div>
        <h3>${coming.title}</h3>
        <p>${coming.desc}</p>
        <span class="soon-badge">${coming.eta}</span>
      </div>
    `;
    return;
  }

  list.hidden = false;
  empty.hidden = true;

  const items = visibleChats();
  const frag = document.createDocumentFragment();
  const seen = new Set();
  for (const it of items) {
    let row = listEls.get(it.id);
    if (!row) { row = makeListRow(); listEls.set(it.id, row); }
    paintListRow(row, it.id, it.d);
    seen.add(it.id);
    frag.appendChild(row);
  }
  for (const [id, row] of listEls) {
    if (!seen.has(id)) { row.remove(); listEls.delete(id); }
  }
  list.replaceChildren(frag);
  if (!items.length) {
    empty.hidden = false;
    empty.innerHTML = `
      <div class="empty-ill"><i class="fa-solid fa-comment-dots"></i></div>
      <h3>${S.tab === 'unread' ? 'لا رسائل غير مقروءة' : 'لا توجد محادثات'}</h3>
      <p>${S.tab === 'unread' ? 'أنت على اطلاع بكل شيء 👌' : 'ابحث عن شخص بالاسم أو اسم المستخدم لبدء المراسلة'}</p>
    `;
  }
}

function startList() {
  if (S.listUnsub) S.listUnsub();
  S.listUnsub = onSnapshot(
    query(collection(db, 'chats'), where('participants', 'array-contains', S.me), limit(CHAT_LIST_LIMIT)),
    (snap) => {
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') S.chats.delete(ch.doc.id);
        else S.chats.set(ch.doc.id, ch.doc.data());
      }
      scheduleList();
    },
    () => showToast('تعذر تحميل الدردشات')
  );
}

/* ================= البحث ================= */
let searchTimer = 0;
let searchSeq = 0;

function makeUserItem(u) {
  const row = el('div', 'item');
  row.dataset.uid = u.uid;
  const av = el('div', 'av');
  av.dataset.profile = '';
  fillAv(av, u, 100);
  const info = el('div', 'info');
  const top = el('div', 'top');
  const nm = el('div', 'nm');

async function runSearch(raw) {
  const seq = ++searchSeq;
  const wrap = $('resultsWrap'), hint = $('resHint'), empty = $('resEmpty');
  if (!raw) { wrap.hidden = true; $('results').replaceChildren(); return; }
  const q = raw.replace(/^@/, '').trim();
  const lower = q.toLowerCase();
  const digits = raw.replace(/\D/g, '');
  const canName = q.length >= 2;
  const canPhone = digits.length >= 6;
  wrap.hidden = false;
  empty.hidden = true;
  hint.hidden = canName || canPhone;
  if (!canName && !canPhone) { $('results').replaceChildren(); return; }

  const usersRef = collection(db, 'users');
  const jobs = [];
  if (canName) {
    jobs.push(getDocs(query(usersRef, where('name', '>=', q), where('name', '<=', q + '\uf8ff'), limit(10))));
    jobs.push(getDocs(query(usersRef, where('lower', 'in', [lower]), limit(5))));
    jobs.push(getDocs(query(usersRef, where('term', 'in', [q, lower]), limit(10))));
  }
  if (canPhone) jobs.push(getDocs(query(usersRef, where('digits', 'in', [digits]), limit(5))));

  const snaps = await Promise.all(jobs.map((p) => p.catch(() => null)));
  if (seq !== searchSeq) return;

  const found = new Map();
  for (const s of snaps) {
    if (!s) continue;
    s.forEach((d) => {
      if (d.id !== S.me && !found.has(d.id)) found.set(d.id, normUser(d.id, d.data()));
    });
  }
  const frag = document.createDocumentFragment();
  for (const u of found.values()) {
    if (!userCache.has(u.uid)) userCache.set(u.uid, u);
    frag.appendChild(makeUserItem(u));
  }
  $('results').replaceChildren(frag);
  empty.hidden = found.size > 0;
}

function teardownRoom() {
  if (S.roomUnsub) { S.roomUnsub(); S.roomUnsub = null; }
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  S.activeId = null;
  S.otherUid = null;
  S.chatExists = false;
  S.chatData = null;
  S.otherReadMs = 0;
  S.order = [];
  S.map = new Map();
  S.anchorH = null;
  S.loadingOlder = false;
  S.ready = false;
  S.newBelow = 0;
  S.forceBottom = true;
  S.hasMore = true;
  S.windowSize = PAGE_SIZE;

function openRoomFor(chatId, uid) {
  if (!chatId || !uid) return;
  if (S.activeId === chatId) {
    document.body.classList.add('room-open', 'has-room');
    return;
  }
  teardownRoom();
  S.activeId = chatId;
  S.otherUid = uid;
  const cached = S.chats.get(chatId) || null;
  S.chatExists = !!cached;
  S.chatData = cached;
  document.body.classList.add('room-open', 'has-room');
  renderHeader();
  renderIntro();
  renderComposer();
  if (S.chatExists) subscribeMessages();
  fetchUser(uid).then(() => {
    if (S.activeId === chatId) { renderHeader(); renderIntro(); }
  });
  S.roomUnsub = onSnapshot(
    doc(db, 'chats', chatId),
    (snap) => { if (S.activeId === chatId) onRoomChat(snap); },
    () => showToast('تعذر فتح المحادثة')
  );
  // ✅ إضافة حالة الرجوع
  history.pushState({ chatId, uid }, '', `?uid=${uid}`);
  scheduleList();
}

function closeRoom() {
  if (!S.activeId) return;
  teardownRoom();
  document.body.classList.remove('room-open', 'has-room');
  history.pushState({}, '', 'chat.html');
  scheduleList();
}

function onRoomChat(snap) {
  S.chatExists = snap.exists();
  S.chatData = snap.exists() ? snap.data() : null;
  if (S.chatExists && !S.msgUnsub) subscribeMessages();
  const om = toMs(S.chatData?.readAt?.[S.otherUid]) ?? 0;
  if (om !== S.otherReadMs) {
    S.otherReadMs = om;
    refreshTicks();
  }
  renderHeader();
  renderIntro();
  renderComposer();
  maybeMarkRead();
}

const sigOf = (d) => [
  d.text || '',
  d.deleted ? 1 : 0,
  d.isEdited ? 1 : 0,
  d.attachment?.url || '',
  d.replyTo?.id || '',
  JSON.stringify(d.reactions || {})

/* ===== بناء المرفقات ===== */
function buildAttachment(a) {
  const btn = el('button', '');
  btn.type = 'button';

  if (a.kind === 'image') {
    btn.className = 'att-img';
    btn.onclick = () => openMedia(a.url, a.name, 'image');
    const img = new Image();
    img.alt = a.name || '';
    img.loading = 'lazy';
    img.decoding = 'async';
    if (a.w && a.h) img.style.aspectRatio = `${a.w} / ${a.h}`;
    img.src = thumbSrc(a.url);
    btn.appendChild(img);
    return btn;
  }

  if (a.kind === 'video') {
    btn.className = 'att-video';
    btn.onclick = () => openMedia(a.url, a.name, 'video');
    const vid = document.createElement('video');
    vid.src = a.url;
    vid.preload = 'metadata';
    vid.muted = true;
    vid.playsInline = true;
    btn.appendChild(vid);
    btn.appendChild(el('div', 'play-badge', '▶'));
    return btn;
  }

  if (a.kind === 'pdf') {
    btn.className = 'att-file att-pdf';
    btn.onclick = () => openMedia(a.url, a.name, 'pdf');
    const info = el('span');
    info.append(el('b', null, a.name || 'ملف PDF'), el('small', null, fmtSize(a.size)));
    btn.append(el('i', 'fa-solid fa-file-pdf'), info);
    return btn;
  }

  btn.className = 'att-file';
  btn.onclick = () => {
    const link = document.createElement('a');
    link.href = a.url;
    link.download = a.name || 'file';
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    link.remove();
  };
  const info = el('span');
  info.append(el('b', null, a.name || 'ملف'), el('small', null, fmtSize(a.size)));
  btn.append(el('i', 'fa-solid ' + fileIcon(a)), info);
  return btn;
}

function buildReactions(reacts) {
  const wrap = el('div', 'rxs');

  for (const emo of Object.values(reacts)) counts.set(emo, (counts.get(emo) || 0) + 1);
  const mine = reacts[S.me];
  for (const [emo, n] of counts) {
    const chip = el('span', 'rx' + (mine === emo ? ' on' : ''), emo);
    if (n > 1) chip.appendChild(el('small', null, ' ' + n));

function makeEntry(id, ms, data) {

function setTick(e) {
  if (!e.tick) return;
  const seen = !!S.otherReadMs && e.ms <= S.otherReadMs;
  e.tick.className = 'fa-solid ticks ' + (seen ? 'fa-check-double seen' : 'fa-check');
}

function refreshTicks() {
  for (const e of S.order) if (e.tick) setTick(e);
}

function paintEntry(e) {
  const d = e.data;
  const sig = sigOf(d);
  if (sig === e.sig) return;
  e.sig = sig;
  const mine = d.senderUid === S.me;
  e.mrow.classList.toggle('mine', mine);
  e.mrow.classList.toggle('theirs', !mine);
  const b = e.bubble;
  b.textContent = '';
  e.tick = null;

  if (d.replyTo && !d.deleted) {
    const q = el('div', 'quote');
    q.dataset.jump = d.replyTo.id;
    q.append(el('b', null, d.replyTo.name || 'رسالة'), el('span', null, d.replyTo.text || '📎 مرفق'));
    b.appendChild(q);
  }

  if (d.deleted) {
    b.appendChild(el('div', 'txt deleted', 'تم حذف الرسالة'));
  } else {
    if (d.attachment) b.appendChild(buildAttachment(d.attachment));
    if (d.text) b.appendChild(el('div', 'txt', d.text));
    if (d.reactions && Object.keys(d.reactions).length) b.appendChild(buildReactions(d.reactions));
  }

  const meta = el('div', 'meta');
  if (d.isEdited && !d.deleted) meta.appendChild(el('span', null, 'معدّلة'));
  meta.appendChild(el('span', null, fmtTime(e.ms)));
  if (mine) {
    e.tick = el('i');
    meta.appendChild(e.tick);
    setTick(e);
  }
  b.appendChild(meta);
}

function lowerBound(ms, id) {
  let lo = 0, hi = S.order.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    const m = S.order[mid];
    if (m.ms < ms || (m.ms === ms && m.id < id)) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function findIdx(e) {
  const i = lowerBound(e.ms, e.id);
  return S.order[i] === e ? i : S.order.indexOf(e);
}

function relayout(from, to) {
  const arr = S.order;
  const lo = Math.max(0, from), hi = Math.min(arr.length - 1, to);
  for (let i = lo; i <= hi; i++) {
    const e = arr[i], p = arr[i - 1];
    const newDay = !p || dayKey(p.ms) !== dayKey(e.ms);
    const head = newDay || p.data.senderUid !== e.data.senderUid || e.ms - p.ms > GROUP_GAP_MS;
    if (newDay) {
      e.day.hidden = false;
      e.dspan.textContent = dayLabel(e.ms);
    } else {
      e.day.hidden = true;
    }
    e.mrow.classList.toggle('head', head);
    e.mrow.classList.toggle('tail', head);
  }
}

function detach(e) {
  const i = findIdx(e);
  if (i < 0) return;
  S.order.splice(i, 1);
  e.row.remove();
  relayout(i - 1, i);
}

function attach(e) {
  const i = lowerBound(e.ms, e.id);
  S.order.splice(i, 0, e);
  const next = S.order[i + 1];
  S.thread.insertBefore(e.row, next ? next.row : null);
  relayout(i - 1, i + 1);
}

function upsertMessage(id, d) {
  const ms = toMs(d.createdAt) ?? Date.now();
  let e = S.map.get(id);
  if (e) {
    e.data = d;
    if (e.ms === ms) { paintEntry(e); return; }
    detach(e);
    e.ms = ms;
  } else {
    e = makeEntry(id, ms, d);
    S.map.set(id, e);
  }
  paintEntry(e);
  attach(e);
}

function subscribeMessages() {
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  const chatId = S.activeId;
  if (!chatId) return;
  const q = query(
    collection(db, 'chats', chatId, 'messages'),
    orderBy('createdAt', 'desc'),
    limit(S.windowSize)
  );
  S.msgUnsub = onSnapshot(
    q,
    (snap) => { if (S.activeId === chatId) applySnapshot(snap); },
    () => {
      S.loadingOlder = false;
      S.anchorH = null;
      if (S.activeId === chatId) showToast('تعذر تحميل الرسائل');
    }
  );
}

function applySnapshot(snap) {
  const thread = S.thread;
  const wasBottom = S.forceBottom || nearBottom();
  let incoming = 0;
  for (const ch of snap.docChanges()) {
    if (ch.type === 'removed') continue;
    const id = ch.doc.id, d = ch.doc.data();
    const isNew = !S.map.has(id);
    upsertMessage(id, d);
    if (isNew && d.senderUid !== S.me) incoming++;
  }
  if (!snap.metadata.fromCache) S.hasMore = snap.size >= S.windowSize;
  S.ready = true;

  if (S.anchorH != null) {
    thread.scrollTop += thread.scrollHeight - S.anchorH;
    S.anchorH = null;
    S.loadingOlder = false;
  } else if (wasBottom) {
    thread.scrollTop = thread.scrollHeight;
    S.forceBottom = false;
    S.newBelow = 0;
  } else if (incoming) {
    S.newBelow += incoming;
  }
  updateJump();
  if (wasBottom) maybeMarkRead();
}

function loadOlder() {
  if (S.loadingOlder || !S.hasMore || !S.ready || !S.activeId) return;
  S.loadingOlder = true;
  S.anchorH = S.thread.scrollHeight;
  S.windowSize += PAGE_SIZE;
  subscribeMessages();
}

function scrollToMsg(id) {
  const e = S.map.get(id);
  if (!e) { showToast('الرسالة أقدم من المحمّل'); return; }
  e.row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  e.bubble.classList.add('flash');
  setTimeout(() => e.bubble.classList.remove('flash'), 1200);
}

async function markRead() {

/* ================= الرفع ================= */
function uploadAttachment(file) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CLOUD_URL);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $('fbar').style.width = Math.round((e.loaded / e.total) * 100) + '%';
    };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText); } catch (_) { j = null; }
      if (xhr.status >= 200 && xhr.status < 300 && j && j.secure_url) {
        resolve({
          kind: fileKind(file),
          url: j.secure_url,
          name: file.name,
          size: file.size,
          mime: file.type || '',
          w: j.width || null,
          h: j.height || null
        });
      } else {
        reject(new Error('upload failed'));
      }
    };
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(fd);
  });
}

function showChip(f) {

  $('fchipName').textContent = f.name;

}

function clearChip() {

/* ================= الإرسال ================= */
function autoSize() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

function updateSendBtn() {
  const has = $('input').value.trim().length > 0 || !!S.pendingFile;
  $('send').disabled = S.uploading || !has;
}

async function onSend() {
  if (S.uploading) return;
  const input = $('input');
  const text = input.value.trim();

  if (S.editingId) { await saveEdit(text); return; }

  const file = S.pendingFile;
  if (!text && !file) return;
  if (text.length > MAX_TEXT) { showToast('الرسالة طويلة جداً'); return; }
  if (!canSend()) return;

  const chatId = S.activeId, other = S.otherUid, me = S.me;
  let attachment = null;

  if (file) {
    S.uploading = true;
    updateSendBtn();
    try { attachment = await uploadAttachment(file); }
    catch (err) {
      showToast('تعذر رفع الملف');
      S.uploading = false;
      updateSendBtn();
      return;
    }
    S.uploading = false;
  }

  if (S.activeId !== chatId || !canSend()) { updateSendBtn(); return; }

  const reply = S.reply;
  const chatRef = doc(db, 'chats', chatId);
  const msgRef = doc(collection(db, 'chats', chatId, 'messages'));
  const replyTo = reply
    ? { id: reply.id, senderUid: reply.senderUid, name: reply.name, text: reply.text }
    : null;
  const payload = {
    senderUid: me,
    text,
    createdAt: serverTimestamp(),
    isEdited: false,
    deleted: false,
    replyTo,
    reactions: {},
    attachment
  };
  const preview = (text || (attachment
    ? (attachment.kind === 'image' ? '📷 صورة' : attachment.kind === 'video' ? '🎥 فيديو' : '📎 ' + attachment.name)
    : '')).slice(0, 120);
  const meta = {
    lastMessage: preview,
    lastMessageAt: serverTimestamp(),
    lastSenderUid: me,
    lastMessageId: msgRef.id
  };

  const batch = writeBatch(db);
  const creating = !S.chatExists;
  if (S.chatExists) {
    batch.update(chatRef, meta);
  } else {
    batch.set(chatRef, {
      participants: [me, other].sort(),
      createdAt: serverTimestamp(),
      status: 'pending',
      requesterUid: me,
      readAt: { [me]: serverTimestamp() },
      ...meta
    });
  }
  batch.set(msgRef, payload);

  if (creating) {
    S.chatExists = true;
    S.chatData = {
      participants: [me, other].sort(),
      status: 'pending',
      requesterUid: me,
      lastSenderUid: me,
      lastMessage: preview
    };
  }

  input.value = '';
  autoSize();
  clearChip();
  S.reply = null;
  $('ctx').hidden = true;
  renderComposer();
  renderHeader();
  renderIntro();
  S.forceBottom = true;

  try {
    await batch.commit();
    if (!S.msgUnsub && S.activeId === chatId) subscribeMessages();
  } catch (err) {
    showToast('تعذر الإرسال');
    if (creating && S.activeId === chatId) {
      S.chatExists = false;
      S.chatData = null;
      if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
      renderComposer();
    }
    if (S.activeId === chatId && !input.value) {
      input.value = text;
      autoSize();
    }
    updateSendBtn();
  }
}

/* ================= التعديل والحذف والتفاعل ================= */
function showCtx(title, text) {
  $('ctxTitle').textContent = title;
  $('ctxText').textContent = text;
  $('ctx').hidden = false;
}

function clearCtx() {
  const wasEdit = S.editingId !== null;
  S.reply = null;
  S.editingId = null;
  $('ctx').hidden = true;
  if (wasEdit) $('input').value = '';
  autoSize();
  updateSendBtn();
}

function startReply(id) {
  const e = S.map.get(id);
  if (!e) return;
  const d = e.data;
  const name = d.senderUid === S.me ? 'أنت' : (userCache.get(S.otherUid)?.name || 'الطرف الآخر');
  const text = d.text || (d.attachment
    ? (d.attachment.kind === 'image' ? '📷 صورة' : d.attachment.kind === 'video' ? '🎥 فيديو' : '📎 ' + (d.attachment.name || 'ملف'))
    : '');
  S.reply = { id, senderUid: d.senderUid, name, text: text.slice(0, 140) };
  S.editingId = null;
  showCtx('الرد على ' + name, S.reply.text);
  $('input').focus();
}

function startEdit(id) {
  const e = S.map.get(id);
  if (!e) return;
  S.reply = null;
  S.editingId = id;
  clearChip();
  showCtx('تعديل الرسالة', e.data.text);
  const input = $('input');
  input.value = e.data.text;
  autoSize();
  input.focus();
  updateSendBtn();
}

async function saveEdit(text) {
  const id = S.editingId;
  const e = S.map.get(id);
  if (!e || !text) return;
  if (text === e.data.text) { clearCtx(); return; }
  if (text.length > MAX_TEXT) { showToast('الرسالة طويلة جداً'); return; }
  const chatId = S.activeId;
  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), {
    text, isEdited: true, editedAt: serverTimestamp()
  });
  if (S.chatData?.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: text.slice(0, 120) });
  }
  S.editingId = null;
  $('input').value = '';
  clearCtx();
  try { await batch.commit(); }
  catch (err) { showToast('تعذر حفظ التعديل'); }
}

async function deleteMsg(id) {
  if (!confirm('حذف هذه الرسالة؟')) return;
  const chatId = S.activeId;
  if (!chatId) return;
  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), {
    text: '', deleted: true, deletedAt: serverTimestamp()
  });
  if (S.chatData?.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: 'تم حذف الرسالة' });
  }
  try { await batch.commit(); }
  catch (err) { showToast('تعذر الحذف'); }
}

async function toggleReaction(id, emo) {
  const e = S.map.get(id);
  if (!e || e.data.deleted || !S.activeId) return;
  const ref = doc(db, 'chats', S.activeId, 'messages', id);
  const cur = e.data.reactions?.[S.me];
  try {
    await updateDoc(ref, { [`reactions.${S.me}`]: cur === emo ? deleteField() : emo });
  } catch (err) { showToast('تعذر إضافة التفاعل'); }
}

function copyText(text) {
  if (!navigator.clipboard) { showToast('النسخ غير مدعوم'); return; }
  navigator.clipboard.writeText(text)
    .then(() => showToast('تم النسخ'))
    .catch(() => showToast('تعذر النسخ'));
}

/* ================= لوحة الخيارات ================= */
function openSheet(id) {
  const e = S.map.get(id);
  if (!e) return;
  const d = e.data;
  const mine = d.senderUid === S.me;
  S.sheetId = id;

  const emo = $('shEmojis');
  emo.replaceChildren();
  if (!d.deleted) {
    for (const x of EMOJIS) {
      const b = el('button', d.reactions?.[S.me] === x ? 'on' : null, x);
      b.onclick = () => { closeSheet(); toggleReaction(id, x); };
      emo.appendChild(b);
    }
  }

  const acts = $('shActions');
  acts.replaceChildren();
  const add = (icon, label, fn, danger) => {
    const b = el('button', danger ? 'danger' : null);
    b.append(el('i', 'fa-solid ' + icon), document.createTextNode(label));
    b.onclick = () => { closeSheet(); fn(); };
    acts.appendChild(b);
  };
  if (!d.deleted) add('fa-reply', 'رد', () => startReply(id));
  if (!d.deleted && d.text) add('fa-copy', 'نسخ', () => copyText(d.text));
  if (mine && !d.deleted && d.text && !d.attachment) add('fa-pen', 'تعديل', () => startEdit(id));
  if (mine && !d.deleted) add('fa-trash', 'حذف', () => deleteMsg(id), true);

  $('sheetBg').classList.add('open');
  $('sheet').classList.add('open');
}

function closeSheet() {
  $('sheetBg').classList.remove('open');
  $('sheet').classList.remove('open');
  S.sheetId = null;
}

/* ================= لوحة الإرفاق ================= */
function openAttachSheet() {
  if (!canSend()) return;
  if (S.editingId) { showToast('لا يمكن إرفاق ملف أثناء التعديل'); return; }
  $('attachBg').classList.add('open');
  $('attachSheet').classList.add('open');
}

function closeAttachSheet() {
  $('attachBg').classList.remove('open');
  $('attachSheet').classList.remove('open');
}

window.pickAttach = (accept) => {
  closeAttachSheet();
  $('fileInput').accept = accept;
  $('fileInput').click();
};

/* ================= عارض الوسائط ================= */
function openMedia(url, name, kind) {
  const MV = S.mv;
  MV.url = url;
  MV.name = name;
  MV.videoEl = null;
  MV.isZoomed = false;

  $('mvTitle').textContent = name || 'معاينة';
  const body = $('mvBody');
  body.innerHTML = '';

  if (kind === 'image') {
    const img = new Image();
    img.src = url;
    img.alt = name || '';
    img.onclick = () => {
      MV.isZoomed = !MV.isZoomed;
      img.classList.toggle('zoomed', MV.isZoomed);
    };
    body.appendChild(img);
  } else if (kind === 'video') {
    body.innerHTML = `
      <div class="vp-wrap">
        <video class="vp-video" id="mvVideo" src="${url}" playsinline preload="metadata"></video>
        <div class="vp-ctrl">
          <button class="vp-btn" id="mvPlay" onclick="mvTogglePlay()"><i class="fa-solid fa-play"></i></button>
          <input class="vp-seek" type="range" id="mvSeek" min="0" max="100" step="0.1" value="0" oninput="mvSeekTo(this.value)">
          <span class="vp-time" id="mvTime">0:00 / 0:00</span>
          <select class="vp-speed" id="mvSpeed" onchange="mvSetSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2x</option>
          </select>
          <button class="vp-btn" onclick="mvFullscreen()" title="ملء الشاشة"><i class="fa-solid fa-expand"></i></button>
        </div>
      </div>
    `;
    MV.videoEl = $('mvVideo');
    MV.videoEl.addEventListener('timeupdate', mvUpdateTime);
    MV.videoEl.addEventListener('loadedmetadata', mvUpdateTime);
    MV.videoEl.addEventListener('play', () => {
      $('mvPlay').innerHTML = '<i class="fa-solid fa-pause"></i>';
    });
    MV.videoEl.addEventListener('pause', () => {
      $('mvPlay').innerHTML = '<i class="fa-solid fa-play"></i>';
    });
  } else if (kind === 'pdf') {
    body.innerHTML = `<iframe src="${url}#toolbar=1&navpanes=0&view=FitH" title="${name}"></iframe>`;
  } else {
    body.innerHTML = `
      <div style="text-align:center;color:#fff;padding:40px;">
        <i class="fa-solid fa-file" style="font-size:72px;opacity:.5;margin-bottom:20px;display:block;"></i>
        <p style="font-size:16px;margin-bottom:20px;">لا يمكن معاينة هذا النوع داخل التطبيق</p>
        <a href="${url}" download="${name}" style="display:inline-block;padding:12px 24px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">
          <i class="fa-solid fa-download"></i> تنزيل الملف
        </a>
      </div>
    `;
    $('mvDownload').hidden = true;
  }

  $('mediaViewer').hidden = false;
}

function closeMedia() {
  const MV = S.mv;
  if (MV.videoEl) {
    MV.videoEl.pause();
    MV.videoEl.src = '';
  }
  $('mvBody').innerHTML = '';
  $('mediaViewer').hidden = true;
  $('mvDownload').hidden = false;
  MV.url = null;
  MV.name = null;
  MV.videoEl = null;
}

function downloadMedia() {
  if (!S.mv.url) return;
  const a = document.createElement('a');
  a.href = S.mv.url;
  a.download = S.mv.name || 'download';
  a.target = '_blank';
  a.click();
}

function mvTogglePlay() {
  if (!S.mv.videoEl) return;
  if (S.mv.videoEl.paused) S.mv.videoEl.play();
  else S.mv.videoEl.pause();
}

function mvSeekTo(val) {
  if (!S.mv.videoEl || !S.mv.videoEl.duration) return;
  S.mv.videoEl.currentTime = (val / 100) * S.mv.videoEl.duration;
}

function mvSetSpeed(val) {
  if (S.mv.videoEl) S.mv.videoEl.playbackRate = parseFloat(val);
}

function mvUpdateTime() {
  if (!S.mv.videoEl) return;
  const cur = S.mv.videoEl.currentTime;
  const dur = S.mv.videoEl.duration || 0;
  $('mvSeek').value = dur ? (cur / dur) * 100 : 0;
  const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  $('mvTime').textContent = `${fmt(cur)} / ${fmt(dur)}`;
}

function mvFullscreen() {
  const wrap = S.mv.videoEl?.closest('.vp-wrap');
  if (!wrap) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else wrap.requestFullscreen?.();
}

window.closeMedia = closeMedia;
window.downloadMedia = downloadMedia;
window.mvTogglePlay = mvTogglePlay;
window.mvSeekTo = mvSeekTo;
window.mvSetSpeed = mvSetSpeed;
window.mvFullscreen = mvFullscreen;

/* ================= إعدادات المحادثة ================= */
async function openSettings() {
  if (!S.activeId) return;
  const isMuted = S.chatData?.muted?.[S.me] === true;
  const isArchived = S.chatData?.archived?.[S.me] === true;
  const content = $('settingsContent');
  content.innerHTML = `
    <div class="settings-item" onclick="toggleMute()">
      <i class="fa-solid fa-bell${isMuted ? '-slash' : ''}"></i>
      <span>${isMuted ? 'إلغاء كتم' : 'كتم الإشعارات'}</span>
      ${isMuted ? '<span class="badge-on">مكتوم</span>' : ''}
    </div>
    <div class="settings-item" onclick="toggleArchive()">
      <i class="fa-solid fa-box-archive"></i>
      <span>${isArchived ? 'إلغاء الأرشفة' : 'أرشفة المحادثة'}</span>
      ${isArchived ? '<span class="badge-on">مؤرشف</span>' : ''}
    </div>
    <div class="settings-item danger" onclick="deleteChat()">
      <i class="fa-solid fa-trash"></i>
      <span>حذف المحادثة</span>
    </div>
    <div class="settings-item danger" onclick="blockUser()">
      <i class="fa-solid fa-ban"></i>
      <span>حظر المستخدم</span>
    </div>
  `;
  $('settingsModal').classList.add('open');
}

function closeSettings() {
  $('settingsModal').classList.remove('open');
}

async function toggleMute() {
  if (!S.activeId) return;
  const isMuted = S.chatData?.muted?.[S.me] === true;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), {
      [`muted.${S.me}`]: !isMuted
    });
    closeSettings();
    showToast(isMuted ? 'تم إلغاء الكتم' : 'تم كتم الإشعارات');
  } catch (e) { showToast('تعذر التحديث'); }
}

async function toggleArchive() {
  if (!S.activeId) return;
  const isArchived = S.chatData?.archived?.[S.me] === true;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), {
      [`archived.${S.me}`]: !isArchived
    });
    closeSettings();
    showToast(isArchived ? 'تم إلغاء الأرشفة' : 'تم الأرشفة');
    if (!isArchived) closeRoom(); // اخرج من الشات المؤرشف
  } catch (e) { showToast('تعذر التحديث'); }
}

async function deleteChat() {
  if (!S.activeId) return;
  if (!confirm('حذف المحادثة بالكامل؟')) return;
  try {
    await deleteDoc(doc(db, 'chats', S.activeId));
    closeSettings();
    closeRoom();
    showToast('تم الحذف');
  } catch (e) { showToast('تعذر الحذف'); }
}

async function blockUser() {
  if (!S.activeId) return;
  if (!confirm('حظر هذا المستخدم؟')) return;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), {
      status: 'blocked',
      blockedBy: S.me,
      blockedAt: serverTimestamp()
    });
    closeSettings();
    showToast('تم الحظر');
  } catch (e) { showToast('تعذر الحظر'); }
}

window.toggleMute = toggleMute;
window.toggleArchive = toggleArchive;
window.deleteChat = deleteChat;
window.blockUser = blockUser;
window.openSettings = openSettings;
window.closeSettings = closeSettings;

/* ================= الأحداث ================= */
function bindEvents() {
  const input = $('input');

  $('chatList').addEventListener('click', (e) => {
    const row = e.target.closest('.item');
    if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openRoomFor(row.dataset.id, row.dataset.uid);
  });

  $('results').addEventListener('click', (e) => {
    const row = e.target.closest('.item');
    if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openWith(row.dataset.uid);
  });

  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === b));
    renderList();
  });

  $('search').addEventListener('input', () => {
    S.listQuery = $('search').value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(S.listQuery), 250);
    scheduleList();
  });

  $('backBtn').addEventListener('click', closeRoom);
  $('rav').addEventListener('click', () => goProfile(S.otherUid));
  $('rinfo').addEventListener('click', () => goProfile(S.otherUid));
  $('roomSettingsBtn').addEventListener('click', openSettings);

  const thread = S.thread;
  thread.addEventListener('click', (e) => {
    if (e.target.closest('[data-profile]')) { goProfile(S.otherUid); return; }
    const q = e.target.closest('.quote');
    if (q) { e.stopPropagation(); scrollToMsg(q.dataset.jump); return; }
    const attBtn = e.target.closest('.att-img, .att-video, .att-file');
    if (attBtn) { e.stopPropagation(); return; }
    const row = e.target.closest('.row');
    if (row && row.dataset.id) openSheet(row.dataset.id);
  });

  thread.addEventListener('scroll', () => {
    if (nearBottom() && S.newBelow) S.newBelow = 0;
    if (thread.scrollTop < 120) loadOlder();
    maybeMarkRead();
    updateJump();
  }, { passive: true });

  $('jump').addEventListener('click', () => {
    thread.scrollTop = thread.scrollHeight;
    S.newBelow = 0;
    updateJump();
    maybeMarkRead();
  });

  $('acceptBtn').addEventListener('click', acceptRequest);
  $('blockBtn').addEventListener('click', blockRequest);

  $('send').addEventListener('click', onSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      onSend();
    }
  });
  input.addEventListener('input', () => { autoSize(); updateSendBtn(); });

  $('ctxClose').addEventListener('click', clearCtx);

  $('attach').addEventListener('click', openAttachSheet);
  $('attachBg').addEventListener('click', closeAttachSheet);

  $('fileInput').addEventListener('change', () => {
    const f = $('fileInput').files[0];
    $('fileInput').value = '';
    if (!f) return;
    if (f.size > MAX_FILE) { showToast('الحد الأقصى 50 ميغابايت'); return; }
    if (S.editingId || !canSend()) return;
    S.pendingFile = f;
    showChip(f);
    updateSendBtn();
    closeAttachSheet();
  });

  $('fchipX').addEventListener('click', clearChip);

  $('sheetBg').addEventListener('click', closeSheet);

  // ✅ زر الرجوع
  window.addEventListener('popstate', () => {
    if (document.body.classList.contains('room-open')) {
      closeRoom();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('mediaViewer').hidden) { closeMedia(); return; }
    if ($('settingsModal').classList.contains('open')) { closeSettings(); return; }
    if ($('attachSheet').classList.contains('open')) { closeAttachSheet(); return; }
    if ($('sheet').classList.contains('open')) { closeSheet(); return; }
    if (S.editingId || S.reply) clearCtx();
  });
}

/* ================= التشغيل ================= */
function init() {
  S.thread = $('thread');
  S.intro = makeIntro();
  S.thread.appendChild(S.intro.root);
  bindEvents();

  onAuthStateChanged(auth, (user) => {
    if (!user) { location.href = LOGIN_PAGE; return; }
    if (S.me) return;
    S.me = user.uid;
    startList();
    renderList();
    const target = new URLSearchParams(location.search).get('uid');
    if (target && target !== S.me) openWith(target);
  });
}

init();
</script>
