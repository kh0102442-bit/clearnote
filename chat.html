<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ClearNote — الدردشات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --navy:#152741; --navy-dark:#0f1e33; --accent:#a8741a;
  --bg:#f4f6f8; --card:#fff; --text:#1a1a1a; --muted:#5b6472;
  --line:#e9ecef; --line-soft:#f0f2f5; --red:#b91c1c;
  --chat-bg:#efeae2; --mine:#d9fdd3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:'Cairo',sans-serif;font-size:15px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
.hide{display:none!important}

/* ===== Layout ===== */
.app{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;display:flex}
.list-col{width:100%;height:100%;display:flex;flex-direction:column;background:var(--card);min-width:0;border-left:1px solid var(--line)}
.topbar{background:var(--navy);color:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.brand{font-family:Georgia,serif;font-weight:700;letter-spacing:1px;font-size:16px}
.brand span{color:var(--accent)}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.25)}

/* ===== Avatar ===== */
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.hide{visibility:hidden}
.top-av{width:36px;height:36px;font-size:13px}
.head-av{width:42px;height:42px;font-size:16px}

/* ===== Search & list ===== */
.search{padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.search input{width:100%;padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--line-soft);font-size:13.5px;outline:none}
.search input:focus{border-color:var(--navy);background:#fff}
.chat-list{flex:1;overflow-y:auto;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.chat-row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
.chat-row:hover{background:var(--line-soft)}
.chat-row.active{background:#eef2fa}
.chat-row .av{width:50px;height:50px;font-size:18px}
.cbody{flex:1;min-width:0}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.cname{font-weight:800;color:var(--navy);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{font-size:11px;color:var(--muted);flex-shrink:0}
.cprev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{text-align:center;color:var(--muted);padding:24px 12px;font-size:13px}
.hint.big i{font-size:44px;color:#cbd5e0;display:block;margin-bottom:10px}
.hint.big h3{margin:0 0 4px;font-size:15px;color:var(--navy);font-weight:800}
.hint.big p{margin:0}

/* ===== Mobile nav ===== */
.fab{position:fixed;left:18px;bottom:80px;width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;font-size:20px;box-shadow:0 4px 16px rgba(21,39,65,.4);z-index:30;display:flex;align-items:center;justify-content:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:200;box-shadow:0 -2px 12px rgba(21,39,65,.08)}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:#8a94a3;position:relative}
.bottom-nav i{font-size:19px}
.bottom-nav a.active{color:var(--navy)}
.bottom-nav a.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
body.room-open .fab,body.room-open .bottom-nav{display:none}

/* ===== Main / room ===== */
.main{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--chat-bg);transform:translateX(100%);transition:transform .25s ease;min-width:0}
body.room-open .main{transform:none}
.empty-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px}
.empty-main i{font-size:72px;color:#cbd5e0;margin-bottom:14px}
.empty-main h2{font-size:22px;color:var(--navy);margin:0 0 8px;font-weight:800}
.empty-main p{margin:0 0 20px;font-size:14px;max-width:340px}
.room{flex:1;display:flex;flex-direction:column;min-height:0}
.room-head{background:var(--navy);color:#fff;height:62px;display:flex;align-items:center;gap:10px;padding:0 10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.back-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;display:none;align-items:center;justify-content:center;flex-shrink:0}
.head-body{flex:1;min-width:0;cursor:pointer}
.head-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-sub{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.messages{flex:1;overflow-y:auto;position:relative;padding:14px 10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msgs-inner{max-width:800px;margin:0 auto;display:flex;flex-direction:column}
.chat-hint{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}

/* ===== Message rows ===== */
.msg-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:auto 60px}
.msg-row.cont{margin-bottom:2px}
.msg-row.mine{flex-direction:row-reverse}
.msg-row.flash .bubble{box-shadow:0 0 0 3px rgba(168,116,26,.5)}
.mcol{max-width:78%;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg-row.mine .mcol{align-items:flex-end}
.bubble{background:#fff;border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.55;color:var(--text);word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;max-width:100%}
.msg-row.mine .bubble{background:var(--mine)}
.bubble.deleted{font-style:italic;color:var(--muted);background:#f0f2f5;cursor:default}
.quote{background:rgba(0,0,0,.05);border-right:3px solid var(--accent);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:12px;color:var(--muted);cursor:pointer;max-width:100%;overflow:hidden}
.quote b{display:block;color:var(--accent);font-size:11.5px}
.quote div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edited{font-size:11px;opacity:.7;font-style:italic}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer}
.rx.mine{background:#e7f5ff;border-color:#b6e0fe;color:#0d47a1}
.meta{font-size:10.5px;color:var(--muted);margin-top:3px;padding:0 4px;display:flex;gap:4px;align-items:center}
.meta .fa-check-double{color:#2980b9}

/* ===== Composer ===== */
.composer{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));flex-shrink:0}
.ctx{max-width:800px;margin:0 auto 8px;background:#e7f5ff;border-right:3px solid #2980b9;border-radius:8px;padding:6px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#0d47a1}
.ctx.edit{background:#fff8e1;border-color:var(--accent);color:#7b5c00}
.ctx-text{flex:1;min-width:0}
.ctx-text div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button{color:var(--red);padding:4px 6px}
.composer-inner{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:42px;max-height:120px;padding:10px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--line-soft);font-size:14px;resize:none;outline:none;line-height:1.4}
.composer textarea:focus{border-color:var(--navy);background:#fff}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn:active{background:var(--navy-dark)}

/* ===== Overlays ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.box h3{margin:0 0 14px;text-align:center;color:var(--navy);font-size:17px;font-weight:800}
.sheet-emojis{display:flex;justify-content:space-around;background:var(--line-soft);border-radius:14px;padding:8px;margin-bottom:12px}
.sheet-emojis button{font-size:26px;width:44px;height:44px;border-radius:50%}
.sheet-emojis button:active{background:#e4e8ee}
.sheet-btn{width:100%;padding:13px 14px;border-radius:10px;background:#fafbfc;margin-bottom:6px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px;color:var(--navy)}
.sheet-btn i{width:20px;text-align:center;color:var(--accent)}
.sheet-btn.danger,.sheet-btn.danger i{color:var(--red)}
.btn{width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:14.5px;margin-top:6px}
.btn.cancel{background:#e9ecef;color:var(--muted)}
.field{position:relative;margin-bottom:12px}
.field i{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field input{width:100%;padding:12px 40px 12px 14px;border:2px solid var(--line);border-radius:10px;font-size:14px;background:#fafbfc;outline:none}
.field input:focus{border-color:var(--navy)}
.results{max-height:52vh;overflow-y:auto}
.user-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer}
.user-row:hover{background:var(--line-soft)}
.user-row .av{width:42px;height:42px;font-size:16px}
.uinfo{flex:1;min-width:0}
.uname{font-weight:800;color:var(--navy);font-size:14px}
.usub{font-size:12px;color:var(--muted)}

/* ===== Desktop: two columns ===== */
@media (min-width:900px){
  .list-col{width:360px;flex-shrink:0}
  .main{position:relative;inset:auto;transform:none;flex:1;z-index:auto}
  .bottom-nav,.fab{display:none!important}
  .chat-list{padding-bottom:0}
}
@media (max-width:899px){
  .back-btn{display:flex}
}
@media (min-width:600px){
  .overlay{align-items:center}
  .box{border-radius:20px}
}
</style>
</head>
<body>
<div class="app">

  <section class="list-col" id="listCol">
    <header class="topbar">
      <div class="brand">CLEAR<span>NOTE</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="newChatBtn" title="محادثة جديدة"><i class="fas fa-plus"></i></button>
      <a class="icon-btn" href="app.html" title="الرئيسية"><i class="fas fa-home"></i></a>
      <div class="av top-av" id="topAv" title="حسابي"></div>
    </header>
    <div class="search">
      <input id="listSearch" type="text" placeholder="ابحث في الدردشات...">
    </div>
    <div class="chat-list" id="chatList"></div>
  </section>

  <main class="main" id="main">
    <div class="empty-main" id="emptyMain">
      <i class="fas fa-comments"></i>
      <h2>الدردشات</h2>
      <p>اختر محادثة من القائمة، أو ابحث عن مستخدم بالاسم أو اسم المستخدم أو رقم الهاتف</p>
      <button class="btn primary" id="emptyNewBtn" style="background:var(--navy);color:#fff;width:auto;padding:12px 22px;border-radius:10px;font-weight:800;">محادثة جديدة</button>
    </div>

    <div class="room hide" id="room">
      <header class="room-head">
        <button class="back-btn" id="backBtn" title="رجوع"><i class="fas fa-arrow-right"></i></button>
        <div class="av head-av" id="hAv" title="الملف الشخصي"></div>
        <div class="head-body" id="hBody">
          <div class="head-name" id="hName"></div>
          <div class="head-sub" id="hSub"></div>
        </div>
      </header>
      <div class="messages" id="messages">
        <div class="chat-hint hide" id="chatHint">ابدأ المحادثة بإرسال أول رسالة</div>
        <div class="msgs-inner" id="msgsInner"></div>
      </div>
      <div class="composer">
        <div class="ctx hide" id="ctx">
          <div class="ctx-text" id="ctxText"></div>
          <button id="ctxClose" title="إلغاء"><i class="fas fa-times"></i></button>
        </div>
        <div class="composer-inner">
          <textarea id="msgInput" rows="1" placeholder="اكتب رسالة..."></textarea>
          <button class="send-btn" id="sendBtn" title="إرسال"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </main>

  <button class="fab" id="fab" title="محادثة جديدة"><i class="fas fa-plus"></i></button>

  <nav class="bottom-nav">
    <a href="app.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="app.html"><i class="fas fa-book-open"></i><span>المحتوى</span></a>
    <a href="chat.html" class="active"><i class="fas fa-comments"></i><span>دردشات</span></a>
    <a href="app.html"><i class="fas fa-clock"></i><span>بومودورو</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>حسابي</span></a>
  </nav>
</div>

<div class="overlay" id="sheet">
  <div class="box">
    <div id="sheetBody"></div>
    <button class="btn cancel" id="sheetClose">إغلاق</button>
  </div>
</div>

<div class="overlay" id="newModal">
  <div class="box">
    <h3>محادثة جديدة</h3>
    <div class="field">
      <i class="fas fa-search"></i>
      <input id="userSearch" type="text" placeholder="الاسم أو اسم المستخدم أو رقم الهاتف">
    </div>
    <div class="results" id="searchResults"></div>
    <button class="btn cancel" id="newClose">إغلاق</button>
  </div>
</div>

<script type="module">
import { auth, db, showToast } from './shared.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  collection, doc, getDoc, getDocs, onSnapshot, query, where, orderBy, limit,
  writeBatch, updateDoc, serverTimestamp, deleteField, Timestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ===== Constants ===== */
const LOGIN_PAGE = 'index.html';
const PROFILE_PAGE = 'profile.html';
const PAGE_SIZE = 30;
const CHAT_LIST_LIMIT = 300;
const MAX_TEXT = 2000;
const GROUP_GAP_MS = 5 * 60 * 1000;
const MAX_SAFE = Number.MAX_SAFE_INTEGER;
const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

/* ===== State ===== */
const S = {
  me: null,
  token: 0,
  chats: new Map(),
  chatUnsub: null,
  listSearch: '',

  activeId: null,
  otherUid: null,
  chatExists: false,
  chatData: null,
  chatLoaded: false,
  roomUnsub: null,
  msgUnsub: null,

  boundaryMs: null,
  hasMore: true,
  loadingOlder: false,
  anchor: null,
  forceBottom: false,

  msgOrder: [],
  msgEntry: new Map(),
  msgData: new Map(),
  msgEls: new Map(),
  sig: new Map(),

  reply: null,
  editingId: null,
  sheetId: null
};
const userCache = new Map();
const userPending = new Map();
const $ = (id) => document.getElementById(id);

/* ===== Helpers ===== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function msTime(ts) {
  if (!ts) return null;
  if (typeof ts.toMillis === 'function') return ts.toMillis();
  if (ts instanceof Date) return ts.getTime();
  return null;
}
function fmtTime(ms) {
  if (!ms) return '';
  const d = new Date(ms), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' });
}
function fmtClock(ms) {
  return ms ? new Date(ms).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
}
function thumb(url, size) {
  if (!url || !url.includes('/upload/')) return url || '';
  return url.replace('/upload/', `/upload/w_${size},h_${size},c_fill,q_auto,f_auto/`);
}
function displayName(u) {
  return (u && (u.name || u.username)) || 'مستخدم';
}
function nameOf(uid) {
  return displayName(userCache.get(uid));
}
function avatarInner(u, size) {
  if (u && u.avatarUrl) return `<img src="${esc(thumb(u.avatarUrl, size))}" alt="" loading="lazy">`;
  const base = (u && (u.name || u.username)) || 'U';
  return esc(String(base).trim().charAt(0).toUpperCase());
}
function chatIdFor(a, b) {
  return [a, b].sort().join('_');
}
function otherOf(id) {
  if (!S.me) return null;
  const parts = id.split('_');
  if (parts.length !== 2 || !parts.includes(S.me)) return null;
  return parts[0] === S.me ? parts[1] : parts[0];
}
function otherOfChat(c) {
  return (c.participants || []).find(p => p !== S.me) || otherOf(c.id);
}
function goProfile(uid) {
  if (!uid) return;
  location.href = uid === S.me ? PROFILE_PAGE : `${PROFILE_PAGE}?uid=${encodeURIComponent(uid)}`;
}
function sigOf(d) {
  return [
    d.text, d.isEdited ? 1 : 0, d.deleted ? 1 : 0,
    d.replyTo ? d.replyTo.text : '', JSON.stringify(d.reactions || {}),
    d.createdAt ? 1 : 0
  ].join('\u0001');
}
function autoGrow() {
  const t = $('msgInput');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}

/* ===== Users (cached, deduplicated) ===== */
function loadUser(uid) {
  if (userCache.has(uid)) return Promise.resolve(userCache.get(uid));
  if (userPending.has(uid)) return userPending.get(uid);
  const p = getDoc(doc(db, 'users', uid))
    .then(s => {
      const d = s.exists() ? s.data() : {};
      userCache.set(uid, d);
      return d;
    })
    .catch(() => ({}))
    .finally(() => userPending.delete(uid));
  userPending.set(uid, p);
  return p;
}

/* ===== Auth ===== */
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.replace(LOGIN_PAGE); return; }
  S.me = user.uid;
  const me = await loadUser(S.me);
  renderTopAvatar(me);
  listenChats();
  route();
});
window.addEventListener('hashchange', route);

function renderTopAvatar(me) {
  const el = $('topAv');
  el.innerHTML = avatarInner(me, 80);
}

/* ===== Routing ===== */
function route() {
  if (!S.me) return;
  const m = location.hash.match(/^#\/c\/([^/]+)$/);
  if (m) openChat(decodeURIComponent(m[1]));
  else closeRoomUI();
}

/* ===== Chat list ===== */
function listenChats() {
  if (S.chatUnsub) S.chatUnsub();
  const q = query(
    collection(db, 'chats'),
    where('participants', 'array-contains', S.me),
    limit(CHAT_LIST_LIMIT)
  );
  S.chatUnsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') S.chats.delete(ch.doc.id);
      else S.chats.set(ch.doc.id, { id: ch.doc.id, ...ch.doc.data() });
    });
    S.chats.forEach(c => {
      const o = otherOfChat(c);
      if (o && !userCache.has(o)) loadUser(o).then(scheduleList);
    });
    scheduleList();
  }, (err) => {
    console.error(err);
    showToast('تعذر تحميل الدردشات', 'error');
  });
}

let listRaf = 0;
function scheduleList() {
  if (listRaf) return;
  listRaf = requestAnimationFrame(() => { listRaf = 0; renderList(); });
}
const sortKey = (c) => msTime(c.lastMessageAt) ?? Date.now();
function chatTitle(c) {
  return displayName(userCache.get(otherOfChat(c)));
}

/* ===== Messages: subscription ===== */
// المرحلة 1: آخر PAGE_SIZE رسالة (بدون where).
// بعد أول رد من السيرفر: نافذة مستمرة من أقدم رسالة محمّلة حتى الآن،
// فتصل التعديلات والتفاعلات لكل الرسائل المحمّلة لحظياً.
function subscribeMessages(token) {
  if (S.msgUnsub) S.msgUnsub();
  S.msgUnsub = null;
  const col = collection(db, 'chats', S.activeId, 'messages');
  const q = S.boundaryMs === null
    ? query(col, orderBy('createdAt', 'desc'), limit(PAGE_SIZE))
    : query(col, where('createdAt', '>=', Timestamp.fromMillis(S.boundaryMs)), orderBy('createdAt', 'asc'));
  S.msgUnsub = onSnapshot(q, (snap) => {
    if (token !== S.token) return;
    applyMessageChanges(snap);
  }, (err) => {
    console.error(err);
    showToast('تعذر تحميل الرسائل', 'error');
  });
}

function applyMessageChanges(snap) {
  const fromServer = !snap.metadata.fromCache;
  const anchor = S.anchor;
  const wasNear = isNearBottom();

  snap.docChanges().forEach(ch => {
    if (ch.type !== 'removed') upsertMessage(ch.doc.id, ch.doc.data());
  });

  if (S.boundaryMs === null && fromServer) {
    let min = null;
    snap.docs.forEach(d => {
      const t = msTime(d.data().createdAt);
      if (t !== null && (min === null || t < min)) min = t;
    });
    S.boundaryMs = min === null ? 0 : min;
    S.hasMore = snap.size === PAGE_SIZE;
    subscribeMessages(S.token);
  }

  if (S.loadingOlder) {
    if (anchor) restoreAnchor(anchor);
    if (fromServer) { S.loadingOlder = false; S.anchor = null; }
  } else if (S.forceBottom && snap.size > 0) {
    scrollBottom();
    S.forceBottom = false;
  } else if (wasNear) {
    scrollBottom();
  }
  updateHint();
}

/* ===== Messages: ordered DOM (binary search, minimal repaint) ===== */
function lowerBound(e) {
  let lo = 0, hi = S.msgOrder.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    const m = S.msgOrder[mid];
    const less = m.t !== e.t ? m.t < e.t : m.id < e.id;
    if (less) lo = mid + 1; else hi = mid;
  }
  return lo;
}
function upsertMessage(id, data) {
  const t = msTime(data.createdAt) ?? MAX_SAFE;
  const entry = S.msgEntry.get(id);
  S.msgData.set(id, data);
  if (!entry) {
    const e = { id, t };
    S.msgEntry.set(id, e);
    const el = document.createElement('div');
    el.className = 'msg-row';
    el.dataset.id = id;
    S.msgEls.set(id, el);
    placeEntry(e);
    return;
  }
  if (entry.t !== t) {
    detachEntry(entry);
    entry.t = t;
    placeEntry(entry);
    return;
  }
  if (S.sig.get(id) !== sigOf(data)) paintAt(lowerBound(entry));
}
function placeEntry(e) {
  const idx = lowerBound(e);
  S.msgOrder.splice(idx, 0, e);
  const el = S.msgEls.get(e.id);
  const next = S.msgOrder[idx + 1];
  $('msgsInner').insertBefore(el, next ? S.msgEls.get(next.id) : null);
  paintAt(idx);
  paintAt(idx + 1);
}
function detachEntry(e) {
  const idx = lowerBound(e);
  if (S.msgOrder[idx] !== e) return;
  S.msgOrder.splice(idx, 1);
  const el = S.msgEls.get(e.id);
  if (el) el.remove();
  paintAt(idx);
}
function paintAt(i) {
  const e = S.msgOrder[i];
  if (!e) return;
  const el = S.msgEls.get(e.id);
  if (!el) return;
  const d = S.msgData.get(e.id);
  const prevE = i > 0 ? S.msgOrder[i - 1] : null;
  const prevD = prevE ? S.msgData.get(prevE.id) : null;
  const cont = !!prevD && prevD.senderUid === d.senderUid && (e.t - prevE.t) < GROUP_GAP_MS;
  const mine = d.senderUid === S.me;
  el.className = 'msg-row' + (mine ? ' mine' : '') + (cont ? ' cont' : '');
  el.innerHTML = rowHtml(e.id, d, mine, cont);
  S.sig.set(e.id, sigOf(d));
}
function repaintFor(uid) {
  for (let i = 0; i < S.msgOrder.length; i++) {
    const d = S.msgData.get(S.msgOrder[i].id);
    if (d && d.senderUid === uid) paintAt(i);
  }
}
function rowHtml(id, d, mine, cont) {
  let avatar = '';
  if (!mine) {
    const u = userCache.get(d.senderUid);
    avatar = `<div class="av${cont ? ' hide' : ''}" data-profile="${esc(d.senderUid)}">${avatarInner(u, 64)}</div>`;
  }
  let body;
  if (d.deleted) {
    body = `<div class="bubble deleted">تم حذف هذه الرسالة</div>`;
  } else {
    const quote = d.replyTo
      ? `<div class="quote" data-jump="${esc(d.replyTo.id)}"><b>${esc(d.replyTo.name || '')}</b><div>${esc(d.replyTo.text || '')}</div></div>`
      : '';
    const text = esc(d.text || '').replace(/\n/g, '<br>');
    body = `${quote}<div class="bubble" data-msg="${esc(id)}">${text}${d.isEdited ? ' <span class="edited">(معدّلة)</span>' : ''}</div>`;
  }
  const rx = d.deleted ? '' : reactionsHtml(id, d.reactions);
  const time = fmtClock(msTime(d.createdAt));
  return `${avatar}<div class="mcol">${body}${rx}<div class="meta">${time}${mine ? ' <i class="fas fa-check-double"></i>' : ''}</div></div>`;
}
function reactionsHtml(id, rx) {
  if (!rx) return '';
  const counts = new Map();
  Object.values(rx).forEach(emo => counts.set(emo, (counts.get(emo) || 0) + 1));
  if (!counts.size) return '';
  const mineEmo = rx[S.me] || null;
  let h = '<div class="rxs">';
  counts.forEach((n, emo) => {
    h += `<button class="rx${emo === mineEmo ? ' mine' : ''}" data-rx="${esc(emo)}" data-msg="${esc(id)}">${esc(emo)} ${n}</button>`;
  });
  return h + '</div>';
}

/* ===== Scrolling ===== */
function isNearBottom() {
  const sc = $('messages');
  return sc.scrollHeight - sc.scrollTop - sc.clientHeight < 150;
}
function scrollBottom() {
  const sc = $('messages');
  sc.scrollTop = sc.scrollHeight;
}
function captureAnchor() {
  const sc = $('messages');
  const top = sc.scrollTop;
  const rows = $('msgsInner').children;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.offsetTop + r.offsetHeight > top) return { el: r, off: r.offsetTop - top };
  }
  return null;
}
function restoreAnchor(a) {
  if (!a || !a.el.isConnected) return;
  $('messages').scrollTop = a.el.offsetTop - a.off;
}
$('messages').addEventListener('scroll', () => {
  if (!S.activeId || S.boundaryMs === null || !S.hasMore || S.loadingOlder) return;
  if ($('messages').scrollTop < 120) loadOlder();
}, { passive: true });

async function loadOlder() {
  const token = S.token;
  const id = S.activeId;
  S.loadingOlder = true;
  S.anchor = captureAnchor();
  try {
    const col = collection(db, 'chats', id, 'messages');
    const snap = await getDocs(query(
      col,
      where('createdAt', '<', Timestamp.fromMillis(S.boundaryMs)),
      orderBy('createdAt', 'desc'),
      limit(PAGE_SIZE)
    ));
    if (token !== S.token) return;
    if (snap.empty) {
      S.hasMore = false;
      S.loadingOlder = false;
      S.anchor = null;
      return;
    }
    const oldest = msTime(snap.docs[snap.docs.length - 1].data().createdAt);
    S.hasMore = snap.size === PAGE_SIZE;
    if (oldest !== null) S.boundaryMs = oldest;
    subscribeMessages(token);
  } catch (e) {
    console.error(e);
    S.loadingOlder = false;
    S.anchor = null;
    showToast('تعذر تحميل رسائل أقدم', 'error');
  }
}

/* ===== Send / edit / delete / react ===== */
$('msgInput').addEventListener('input', autoGrow);
$('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    onSend();
  }
});
$('sendBtn').addEventListener('click', onSend);

async function onSend() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !S.activeId) return;
  if (text.length > MAX_TEXT) { showToast(`الحد الأقصى ${MAX_TEXT} حرف`, 'error'); return; }
  if (S.editingId) { await saveEdit(text); return; }

  const id = S.activeId;
  const otherUid = S.otherUid;
  const reply = S.reply;
  input.value = '';
  autoGrow();
  S.reply = null;
  $('ctx').classList.add('hide');
  S.forceBottom = true;

  const chatRef = doc(db, 'chats', id);
  const msgRef = doc(collection(db, 'chats', id, 'messages'));
  const meta = {
    lastMessage: text.slice(0, 120),
    lastMessageAt: serverTimestamp(),
    lastSenderUid: S.me,
    lastMessageId: msgRef.id
  };
  const batch = writeBatch(db);
  const wasExists = S.chatExists;
  if (wasExists) {
    batch.update(chatRef, meta);
  } else {
    batch.set(chatRef, { participants: [S.me, otherUid].sort(), createdAt: serverTimestamp(), ...meta });
  }
  batch.set(msgRef, {
    senderUid: S.me,
    text,
    createdAt: serverTimestamp(),
    isEdited: false,
    deleted: false,
    replyTo: reply ? { id: reply.id, senderUid: reply.senderUid, name: reply.name || '', text: reply.text || '' } : null,
    reactions: {}
  });
  S.chatExists = true;

  try {
    await batch.commit();
  } catch (e) {
    console.error(e);
    S.chatExists = wasExists;
    if (S.activeId === id) {
      input.value = text;
      autoGrow();
      S.reply = reply;
      if (reply) showCtx('الرد على ' + reply.name, reply.text, false);
    }
    showToast('فشل الإرسال', 'error');
  }
}

async function saveEdit(text) {
  const id = S.editingId;
  const d = S.msgData.get(id);
  const input = $('msgInput');
  if (!d || d.senderUid !== S.me || d.deleted) { cancelCtx(); return; }
  if (text === (d.text || '').trim()) { cancelCtx(); return; }

  const chatId = S.activeId;
  S.editingId = null;
  $('ctx').classList.add('hide');
  input.value = '';
  autoGrow();

  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), { text, isEdited: true, editedAt: serverTimestamp() });
  if (S.chatData && S.chatData.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: text.slice(0, 120) });
  }
  try {
    await batch.commit();
  } catch (e) {
    console.error(e);
    input.value = text;
    autoGrow();
    S.editingId = id;
    showCtx('تعديل الرسالة', d.text || '', true);
    showToast('تعذر حفظ التعديل', 'error');
  }
}

async function deleteMessage(id) {
  const d = S.msgData.get(id);
  if (!d || d.senderUid !== S.me || d.deleted || !S.activeId) return;
  const chatId = S.activeId;
  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), { text: '', deleted: true, deletedAt: serverTimestamp() });
  if (S.chatData && S.chatData.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: 'تم حذف الرسالة' });
  }
  try {
    await batch.commit();
  } catch (e) {
    console.error(e);
    showToast('تعذر حذف الرسالة', 'error');
  }
}

function confirmDelete(id) {
  if (!confirm('حذف هذه الرسالة؟')) return;
  deleteMessage(id);
}

async function toggleReaction(id, emoji) {
  const d = S.msgData.get(id);
  if (!d || d.deleted || !S.activeId) return;
  const cur = d.reactions ? d.reactions[S.me] : undefined;
  const value = cur === emoji ? deleteField() : emoji;
  try {
    await updateDoc(doc(db, 'chats', S.activeId, 'messages', id), { [`reactions.${S.me}`]: value });
  } catch (e) {
    console.error(e);
    showToast('تعذر تنفيذ التفاعل', 'error');
  }
}

let searchTimer = 0;
let searchSeq = 0;
$('userSearch').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const term = e.target.value.trim();
  if (term.length < 2) {
    $('searchResults').innerHTML = `<div class="hint">اكتب حرفين على الأقل أو رقم الهاتف كاملاً</div>`;

async function runUserSearch(term) {
  const seq = ++searchSeq;
  $('searchResults').innerHTML = `<div class="hint">جاري البحث...</div>`;
  const usersCol = collection(db, 'users');
  const lower = term.toLowerCase();
  const digits = term.replace(/\D/g, '');
  const reqs = [
    getDocs(query(usersCol, where('username', 'in', [...new Set([term, lower])]), limit(10))),
    getDocs(query(usersCol, where('name', '>=', term), where('name', '<=', term + '\uf8ff'), limit(10)))
  ];
  if (digits.length >= 6) {
    reqs.push(getDocs(query(usersCol, where('phone', 'in', [...new Set([term, digits])]), limit(10))));
  }
  try {
    const snaps = await Promise.all(reqs);
    if (seq !== searchSeq) return;
    const hits = new Map();
    snaps.forEach(s => s.docs.forEach(d => {
      if (d.id !== S.me && !hits.has(d.id)) hits.set(d.id, d.data());
    }));
    hits.forEach((data, uid) => { if (!userCache.has(uid)) userCache.set(uid, data); });
    renderHits([...hits.entries()]);
  } catch (e) {
    console.error(e);
    if (seq === searchSeq) $('searchResults').innerHTML = `<div class="hint">تعذر البحث، حاول مرة أخرى</div>`;
  }
}

function renderHits(list) {
  const el = $('searchResults');
  if (!list.length) { el.innerHTML = `<div class="hint">لا توجد نتائج</div>`; return; }
  el.innerHTML = list.map(([uid, u]) => `
    <div class="user-row" data-uid="${esc(uid)}">
      <div class="av" data-profile="${esc(uid)}">${avatarInner(u, 80)}</div>
      <div class="uinfo">
        <div class="uname">${esc(displayName(u))}</div>
        <div class="usub">${u.username ? '@' + esc(u.username) : ''}</div>
      </div>
    </div>`).join('');
}
$('searchResults').addEventListener('click', (e) => {
  const av = e.target.closest('[data-profile]');
  if (av) { goProfile(av.dataset.profile); return; }
  const row = e.target.closest('[data-uid]');
  if (!row) return;
  closeNewChat();
  location.hash = '#/c/' + encodeURIComponent(chatIdFor(S.me, row.dataset.uid));
});
</script>
