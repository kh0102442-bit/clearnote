<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearNote — الدردشات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Cairo', sans-serif; background: #f3f4f6; color: #111827; }

    .app { display: flex; height: 100vh; }

    /* ===== القائمة ===== */
    .sidebar {
      width: 340px; background: #fff; border-left: 1px solid #e5e7eb;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-head {
      padding: 16px; font-size: 20px; font-weight: 700; color: #1e293b;
      border-bottom: 1px solid #e5e7eb;
    }
    .search { padding: 12px; border-bottom: 1px solid #e5e7eb; }
    .search input {
      width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 10px;
      font: inherit; outline: none;
    }
    .search input:focus { border-color: #1e293b; }
    .list { flex: 1; overflow-y: auto; }

    .item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      cursor: pointer; border-bottom: 1px solid #f1f5f9;
    }
    .item:hover { background: #f8fafc; }
    .item.active { background: #e2e8f0; }
    .item-body { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub {
      font-size: 13px; color: #64748b; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .item-time { font-size: 12px; color: #94a3b8; flex-shrink: 0; }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%; background: #1e293b; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0;
    }
    .hint { padding: 20px; text-align: center; color: #64748b; font-size: 14px; }

    /* ===== منطقة المحادثة ===== */
    .main {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      background: #efeae2; position: relative;
    }
    .empty { margin: auto; color: #64748b; font-size: 16px; }
    .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    .chat-head {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: #1e293b; color: #fff;
    }
    .chat-head .avatar { background: #fff; color: #1e293b; width: 38px; height: 38px; }
    .chat-title { font-weight: 700; font-size: 16px; }
    .back {
      display: none; background: none; border: none; color: #fff;
      font: inherit; font-size: 15px; cursor: pointer;
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .bubble {
      max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 15px;
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 1px 1px rgba(0,0,0,.06);
    }
    .bubble.mine { align-self: flex-start; background: #d9fdd3; border-bottom-right-radius: 2px; }
    .bubble.theirs { align-self: flex-end; background: #fff; border-bottom-left-radius: 2px; }
    .bubble time { display: block; font-size: 11px; color: #64748b; margin-top: 4px; text-align: left; }

    .composer {
      display: flex; gap: 8px; padding: 12px; background: #f8fafc;
      border-top: 1px solid #e5e7eb;
    }
    .composer input {
      flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 10px;
      font: inherit; outline: none;
    }
    .composer input:focus { border-color: #1e293b; }
    .composer button {
      padding: 10px 20px; background: #1e293b; color: #fff; border: none;
      border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .composer button:disabled { opacity: .5; cursor: default; }

    .hidden { display: none !important; }

    /* ===== الموبايل ===== */
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .app.chat-open .sidebar { display: none; }
      .app:not(.chat-open) .main { display: none; }
      .back { display: inline-block; }
      .bubble { max-width: 85%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">

    <aside class="sidebar">
      <div class="sidebar-head">الدردشات</div>
      <div class="search">
        <input id="searchInput" type="text" placeholder="ابحث بالاسم أو اسم المستخدم أو رقم الهاتف" autocomplete="off">
      </div>
      <div class="list" id="listArea"></div>
    </aside>

    <main class="main">
      <div class="empty" id="emptyState">ابحث عن شخص لبدء محادثة</div>

      <div class="chat-view hidden" id="chatView">
        <header class="chat-head">
          <button class="back" id="backBtn">رجوع</button>
          <div class="avatar" id="chatAvatar"></div>
          <div class="chat-title" id="chatTitle"></div>
        </header>

        <div class="messages" id="messages"></div>

        <form class="composer" id="composer">
          <input id="msgInput" type="text" placeholder="اكتب رسالة..." autocomplete="off">
          <button type="submit" id="sendBtn">إرسال</button>
        </form>
      </div>
    </main>

  </div>

  <script type="module">
    import { auth, db, showToast } from './shared.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      collection, doc, getDoc, getDocs, setDoc, updateDoc, addDoc,
      query, where, orderBy, limit, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // غيّر هذا الاسم إذا كانت صفحة تسجيل الدخول باسم مختلف
    const LOGIN_PAGE = 'index.html';

    /* ===== العناصر ===== */
    const $ = id => document.getElementById(id);
    const els = {
      app: $('app'),
      searchInput: $('searchInput'),
      listArea: $('listArea'),
      emptyState: $('emptyState'),
      chatView: $('chatView'),
      chatTitle: $('chatTitle'),
      chatAvatar: $('chatAvatar'),
      backBtn: $('backBtn'),
      messages: $('messages'),
      composer: $('composer'),
      msgInput: $('msgInput'),
      sendBtn: $('sendBtn')
    };

    /* ===== الحالة ===== */
    let me = null;
    let chats = [];
    let activeChat = null;     // { id, otherUid, otherName }
    let unsubChats = null;
    let unsubMsgs = null;
    let searching = false;
    let searchTimer = null;
    let searchToken = 0;
    let renderToken = 0;
    const userCache = new Map();

    /* ===== أدوات ===== */
    const chatIdFor = (a, b) => [a, b].sort().join('_');
    const displayName = u => u?.name || u?.username || 'مستخدم';
    const initial = name => (name || '?').trim().charAt(0).toUpperCase();
    const tsToMs = t => (t && t.toMillis) ? t.toMillis() : (t ? new Date(t).getTime() : Date.now());

    function formatTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function getUser(uid) {
      if (userCache.has(uid)) return userCache.get(uid);
      let data = { name: 'مستخدم' };
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) data = { id: uid, ...snap.data() };
      } catch (e) {
        console.warn('user read failed:', e);
      }
      userCache.set(uid, data);
      return data;
    }

    /* ===== تسجيل الدخول ===== */
    onAuthStateChanged(auth, user => {
      if (!user) {
        location.href = LOGIN_PAGE;
        return;
      }
      me = user;
      listenChats();
    });

    /* ===== قائمة المحادثات ===== */
    function listenChats() {
      if (unsubChats) return;
      const q = query(collection(db, 'chats'), where('participants', 'array-contains', me.uid));
      unsubChats = onSnapshot(q, snap => {
        chats = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => tsToMs(b.lastMessageAt) - tsToMs(a.lastMessageAt));
        renderChatList();
      }, err => {
        console.error('chats listener error:', err);
        showToast('تعذّر تحميل المحادثات: ' + (err.code || err.message), 'error');
      });
    }

    async function renderChatList() {
      if (searching) return;
      const token = ++renderToken;

      const items = await Promise.all(chats.map(async c => {
        const otherUid = c.participants.find(u => u !== me.uid);
        const other = await getUser(otherUid);
        return { chat: c, otherUid, otherName: displayName(other) };
      }));

      if (token !== renderToken || searching) return;

      els.listArea.replaceChildren();
      if (!items.length) {
        els.listArea.append(el('div', 'hint', 'لا توجد محادثات بعد. ابحث عن شخص لبدء محادثة.'));
        return;
      }

      items.forEach(({ chat, otherUid, otherName }) => {
        const row = el('div', 'item' + (activeChat?.id === chat.id ? ' active' : ''));
        row.append(el('div', 'avatar', initial(otherName)));

        const body = el('div', 'item-body');
        body.append(el('div', 'item-name', otherName));
        body.append(el('div', 'item-sub', chat.lastMessage || ''));
        row.append(body);

        row.append(el('div', 'item-time', formatTime(chat.lastMessageAt)));
        row.addEventListener('click', () => openChat(otherUid, otherName));
        els.listArea.append(row);
      });
    }

    /* ===== البحث ===== */
    els.searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const text = els.searchInput.value.trim();
      if (!text) {
        searching = false;
        renderChatList();
        return;
      }
      searching = true;
      searchTimer = setTimeout(() => runSearch(text), 300);
    });

    function showSearchMessage(text) {
      els.listArea.replaceChildren(el('div', 'hint', text));
    }

    async function runSearch(text) {
      const token = ++searchToken;
      if (text.length < 2) {
        showSearchMessage('اكتب حرفين على الأقل');
        return;
      }
      showSearchMessage('جارٍ البحث...');

      try {
        const found = await searchUsers(text);
        if (token !== searchToken) return;

        els.listArea.replaceChildren();
        if (!found.length) {
          showSearchMessage('لا توجد نتائج');
          return;
        }

        found.forEach(u => {
          userCache.set(u.id, u);
          const name = displayName(u);
          const row = el('div', 'item');
          row.append(el('div', 'avatar', initial(name)));

          const body = el('div', 'item-body');
          body.append(el('div', 'item-name', name));
          body.append(el('div', 'item-sub', u.username || u.phone || ''));
          row.append(body);

          row.addEventListener('click', () => {
            els.searchInput.value = '';
            searching = false;
            openChat(u.id, name);
          });
          els.listArea.append(row);
        });
      } catch (err) {
        console.error('search failed:', err);
        if (token === searchToken) {
          showSearchMessage('تعذّر البحث: ' + (err.code || err.message));
        }
      }
    }

    async function searchUsers(text) {
      const users = collection(db, 'users');
      const digits = text.replace(/\D/g, '');

      const queries = [
        // بحث بالاسم (يبدأ بالنص المكتوب، حساس لحالة الأحرف)
        getDocs(query(users, where('name', '>=', text), where('name', '<=', text + '\uf8ff'), limit(20))),
        // بحث باسم المستخدم
        getDocs(query(users, where('username', '==', text), limit(10))),
        // بحث برقم الهاتف كما كُتب
        getDocs(query(users, where('phone', '==', text), limit(10)))
      ];

      // بحث برقم الهاتف بالأرقام فقط إذا اختلفت الصيغة
      if (digits && digits !== text) {
        queries.push(getDocs(query(users, where('phone', '==', digits), limit(10))));
      }

      const results = await Promise.allSettled(queries);
      if (results.every(r => r.status === 'rejected')) throw results[0].reason;

      const map = new Map();
      results.forEach(r => {
        if (r.status !== 'fulfilled') {
          console.warn('search query failed:', r.reason);
          return;
        }
        r.value.docs.forEach(d => {
          if (d.id !== me.uid) map.set(d.id, { id: d.id, ...d.data() });
        });
      });
      return [...map.values()];
    }

    /* ===== فتح محادثة ===== */
    async function openChat(otherUid, otherName) {
      const id = chatIdFor(me.uid, otherUid);
      activeChat = { id, otherUid, otherName };
      searching = false;

      els.emptyState.classList.add('hidden');
      els.chatView.classList.remove('hidden');
      els.app.classList.add('chat-open');
      els.chatTitle.textContent = otherName;
      els.chatAvatar.textContent = initial(otherName);
      els.messages.replaceChildren(el('div', 'hint', 'جارٍ التحميل...'));

      stopMessages();
      renderChatList();

      try {
        const snap = await getDoc(doc(db, 'chats', id));
        if (activeChat?.id !== id) return;

        if (snap.exists()) {
          startMessages(id);
        } else {
          els.messages.replaceChildren(el('div', 'hint', 'ابدأ المحادثة بأول رسالة'));
        }
      } catch (err) {
        console.error('open chat failed:', err);
        showToast('تعذّر فتح المحادثة: ' + (err.code || err.message), 'error');
      }
    }

    /* ===== الرسائل ===== */
    function startMessages(chatId) {
      stopMessages();
      const q = query(
        collection(db, 'chats', chatId, 'messages'),
        orderBy('createdAt', 'asc'),
        limit(300)
      );
      unsubMsgs = onSnapshot(q, snap => {
        if (activeChat?.id !== chatId) return;
        renderMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }, err => {
        console.error('messages listener error:', err);
        showToast('تعذّر تحميل الرسائل: ' + (err.code || err.message), 'error');
      });
    }

    function stopMessages() {
      if (unsubMsgs) {
        unsubMsgs();
        unsubMsgs = null;
      }
    }

    function renderMessages(msgs) {
      els.messages.replaceChildren();
      if (!msgs.length) {
        els.messages.append(el('div', 'hint', 'لا توجد رسائل بعد'));
        return;
      }
      msgs.forEach(m => {
        const bubble = el('div', 'bubble ' + (m.senderUid === me.uid ? 'mine' : 'theirs'));
        bubble.append(document.createTextNode(m.text || ''));
        bubble.append(el('time', null, formatTime(m.createdAt)));
        els.messages.append(bubble);
      });
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    /* ===== الإرسال ===== */
    els.composer.addEventListener('submit', async e => {
      e.preventDefault();
      if (!activeChat || !me) return;

      const text = els.msgInput.value.trim();
      if (!text) return;
      if (text.length > 2000) {
        showToast('الرسالة طويلة جداً', 'error');
        return;
      }

      const { id, otherUid } = activeChat;
      els.sendBtn.disabled = true;

      try {
        const chatRef = doc(db, 'chats', id);
        const preview = {
          lastMessage: text.slice(0, 100),
          lastMessageAt: serverTimestamp(),
          lastSenderUid: me.uid
        };

        // أول رسالة: ننشئ المحادثة. بعدها: نحدّث المعاينة فقط.
        const snap = await getDoc(chatRef);
        if (snap.exists()) {
          await updateDoc(chatRef, preview);
        } else {
          await setDoc(chatRef, {
            participants: [me.uid, otherUid].sort(),
            createdAt: serverTimestamp(),
            ...preview
          });
        }

        await addDoc(collection(db, 'chats', id, 'messages'), {
          senderUid: me.uid,
          text,
          createdAt: serverTimestamp()
        });

        els.msgInput.value = '';
        if (activeChat?.id === id && !unsubMsgs) startMessages(id);
      } catch (err) {
        console.error('send failed:', err);
        showToast('تعذّر إرسال الرسالة: ' + (err.code || err.message), 'error');
      } finally {
        els.sendBtn.disabled = false;
        els.msgInput.focus();
      }
    });

    /* ===== الرجوع للقائمة (موبايل) ===== */
    els.backBtn.addEventListener('click', () => {
      els.app.classList.remove('chat-open');
    });
  </script>
</body>
</html>
