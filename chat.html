}
function closeSettings() {
  $('settingsModal').classList.remove('open');
}

function renderSettingsTab() {
  const body = $('stBody');
  body.innerHTML = '';
  if (S.settingsTab === 'info') renderStInfo(body);
  else if (S.settingsTab === 'media') renderStMedia(body);
  else if (S.settingsTab === 'search') renderStSearch(body);
  else if (S.settingsTab === 'notify') renderStNotify(body);
}

function renderStInfo(body) {
  const u = userCache.get(S.otherUid) || placeholder(S.otherUid);
  const card = el('div', 'profile-card');
  const av = el('div', 'profile-av');
  fillAv(av, u, 200);
  av.onclick = () => goProfile(S.otherUid);
  av.style.cursor = 'pointer';
  card.append(av, el('div', 'profile-name', u.name));
  if (u.username) card.append(el('div', 'profile-username', '@' + u.username));
  if (u.role) card.append(el('div', 'profile-role', roleLabel(u.role)));
  if (u.bio) {
    const bio = el('div', null, u.bio);
    bio.style.cssText = 'font-size:13px;color:var(--muted);line-height:1.7;margin-top:12px';
    card.append(bio);
  }

  const list = el('div', 'settings-list');
  const item = (icon, label, fn, danger, right) => {
    const it = el('div', 'settings-item' + (danger ? ' danger' : ''));
    it.append(el('i', 'fa-solid ' + icon), el('span', null, label));
    if (right) it.appendChild(right);
    it.onclick = fn;
    list.appendChild(it);
    return it;
  };

  const muted = isMuted();
  const archived = isArchived();
  item('fa-bell' + (muted ? '-slash' : ''), muted ? 'إلغاء كتم الإشعارات' : 'كتم الإشعارات', () => toggleMute(), false, muted ? el('span', 'badge-on', 'مكتوم') : null);
  item('fa-box-archive', archived ? 'إلغاء الأرشفة' : 'أرشفة المحادثة', () => toggleArchive(), false, archived ? el('span', 'badge-on', 'مؤرشف') : null);
  item('fa-user', 'عرض الملف الشخصي', () => { closeSettings(); goProfile(S.otherUid); });
  item('fa-trash', 'حذف المحادثة', () => deleteChat(), true);
  item('fa-ban', 'حظر المستخدم', () => blockUser(), true);

  body.append(card, list);
}

function renderStMedia(body) {
  const items = [];
  for (const e of S.order) {
    if (e.data.deleted || !e.data.attachment) continue;
    items.push({ a: e.data.attachment, e });
  }
  if (!items.length) {
    const empty = el('div', 'empty');
    empty.innerHTML = '<div class="empty-ill"><i class="fa-solid fa-photo-film"></i></div><h3>لا توجد وسائط</h3><p>الصور والفيديوهات والملفات ستظهر هنا</p>';
    body.appendChild(empty);
    return;
  }
  const grid = el('div', 'media-grid');
  items.reverse();
  for (const { a, e } of items) {
    let cell;
    if (a.kind === 'image') {
      cell = el('button', 'media-cell');
      const img = new Image();
      img.src = thumbSrc(a.url); img.loading = 'lazy';
      cell.appendChild(img);
      cell.onclick = () => { closeSettings(); openMedia(a.url, a.name, 'image'); };
    } else if (a.kind === 'video') {
      cell = el('button', 'media-cell');
      const vid = document.createElement('video');
      vid.src = a.url + '#t=0.5'; vid.preload = 'metadata'; vid.muted = true;
      cell.appendChild(vid);
      cell.appendChild(el('div', 'play-ic', '▶'));
      cell.onclick = () => { closeSettings(); openMedia(a.url, a.name, 'video'); };
    } else {
      cell = el('button', 'media-cell');
      const ic = el('div', 'file-ic');
      ic.innerHTML = `<i class="fa-solid ${fileIcon(a)}"></i><small>${a.name || 'ملف'}</small>`;
      cell.appendChild(ic);
      cell.onclick = () => {
        if (a.kind === 'pdf') { closeSettings(); openMedia(a.url, a.name, 'pdf'); }
        else {
          const link = document.createElement('a');
          link.href = a.url; link.download = a.name || 'file';
          document.body.appendChild(link); link.click(); link.remove();
        }
      };
    }
    grid.appendChild(cell);
  }
  body.appendChild(grid);
}

function renderStSearch(body) {
  const inp = document.createElement('input');
  inp.type = 'search'; inp.className = 'st-search'; inp.placeholder = 'ابحث في المحادثة...';
  const results = el('div');
  body.append(inp, results);

  const render = (q) => {
    results.innerHTML = '';
    const lq = q.trim().toLowerCase();
    if (!lq) {
      results.innerHTML = '<div class="empty" style="padding:30px 20px"><p style="color:var(--muted-2);font-size:13px">اكتب للبحث في الرسائل</p></div>';
      return;
    }
    const found = S.order.filter(e => !e.data.deleted && (e.data.text || '').toLowerCase().includes(lq)).slice(-50).reverse();
    if (!found.length) {
      results.innerHTML = '<div class="empty" style="padding:30px 20px"><p style="color:var(--muted-2);font-size:13px">لا نتائج</p></div>';
      return;
    }
    for (const e of found) {
      const div = el('div', 'search-result');
      const t = el('div', 'search-result-time', fmtTime(e.ms) + (e.data.senderUid === S.me ? ' · أنت' : ''));
      const text = el('div', 'search-result-text');
      const txt = e.data.text || '';
      const idx = txt.toLowerCase().indexOf(lq);
      if (idx >= 0) {
        text.append(
          document.createTextNode(txt.slice(Math.max(0, idx-30), idx)),
          el('mark', null, txt.slice(idx, idx + lq.length)),
          document.createTextNode(txt.slice(idx + lq.length, idx + lq.length + 60))
        );
      } else text.textContent = txt.slice(0, 90);
      div.append(t, text);
      div.onclick = () => { closeSettings(); scrollToMsg(e.id); };
      results.appendChild(div);
    }
  };
  inp.oninput = () => render(inp.value);
  render('');
  setTimeout(() => inp.focus(), 300);
}

function renderStNotify(body) {
  const muted = isMuted();
  const list = el('div', 'settings-list');
  const item = el('div', 'settings-item');
  item.innerHTML = `<i class="fa-solid fa-bell${muted?'-slash':''}"></i><span>${muted?'الإشعارات مكتومة':'الإشعارات مفعلة'}</span>`;
  item.onclick = async () => {
    await toggleMute();
    renderSettingsTab();
  };
  list.appendChild(item);
  body.appendChild(list);
}

async function toggleMute() {
  if (!S.activeId) return;
  const muted = isMuted();
  try {
    await updateDoc(doc(db, 'chats', S.activeId), { [`muted.${S.me}`]: !muted });
    showToast(muted ? 'تم إلغاء الكتم' : 'تم كتم الإشعارات');
  } catch { showToast('تعذر التحديث'); }
}

async function toggleArchive() {
  if (!S.activeId) return;
  const arch = isArchived();
  try {
    await updateDoc(doc(db, 'chats', S.activeId), { [`archived.${S.me}`]: !arch });
    showToast(arch ? 'تم إلغاء الأرشفة' : 'تم الأرشفة');
    if (!arch) { closeSettings(); closeRoom(); }
    else renderSettingsTab();
  } catch { showToast('تعذر التحديث'); }
}

async function deleteChat() {
  if (!S.activeId) return;
  if (!confirm('حذف المحادثة من قائمتك؟')) return;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), { deletedBy: arrayUnion(S.me) });
    closeSettings();
    closeRoom();
    showToast('تم الحذف');
  } catch { showToast('تعذر الحذف'); }
}

async function blockUser() {
  if (!S.activeId) return;
  if (!confirm('حظر هذا المستخدم؟ لن تستطيع التراسل معه.')) return;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), {
      status: 'blocked', blockedBy: S.me, blockedAt: serverTimestamp()
    });
    closeSettings();
    showToast('تم الحظر');
  } catch { showToast('تعذر الحظر'); }
}

/* ================= Events ================= */
function bindEvents() {
  const input = $('input');

  $('chatList').addEventListener('click', (e) => {
    const row = e.target.closest('.item'); if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openRoomFor(row.dataset.id, row.dataset.uid);
  });

  $('results').addEventListener('click', (e) => {
    const row = e.target.closest('.item'); if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openWith(row.dataset.uid);
  });

  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
    renderList();
  });

  $('search').addEventListener('input', () => {
    S.listQuery = $('search').value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(S.listQuery), 250);
    scheduleList();
  });

  $('backBtn').addEventListener('click', closeRoom);
  $('rav').addEventListener('click', () => goProfile(S.otherUid));
  $('rinfo').addEventListener('click', () => goProfile(S.otherUid));
  $('roomSettingsBtn').addEventListener('click', openSettings);

  const thread = S.thread;
  thread.addEventListener('click', (e) => {
    if (e.target.closest('[data-profile]')) { goProfile(S.otherUid); return; }
    const q = e.target.closest('.quote');
    if (q) { e.stopPropagation(); scrollToMsg(q.dataset.jump); return; }
    const rx = e.target.closest('.rx');
    if (rx) { e.stopPropagation(); return; }
  });

  thread.addEventListener('scroll', () => {
    if (nearBottom() && S.newBelow) S.newBelow = 0;
    if (thread.scrollTop < 120) loadOlder();
    maybeMarkRead();
    updateJump();
  }, { passive:true });

  $('jump').addEventListener('click', () => {
    thread.scrollTop = thread.scrollHeight;
    S.newBelow = 0; updateJump(); maybeMarkRead();
  });

  $('acceptBtn').addEventListener('click', acceptRequest);
  $('blockBtn').addEventListener('click', blockRequest);

  $('send').addEventListener('click', onSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault(); onSend();
    }
  });
  input.addEventListener('input', () => { autoSize(); updateSendBtn(); });

  $('ctxClose').addEventListener('click', clearCtx);

  $('attach').addEventListener('click', openAttach);
  $('attachOverlay').addEventListener('click', closeAttach);

  $('micBtn').addEventListener('click', startRecording);
  $('recCancel').addEventListener('click', cancelRecording);
  $('recSend').addEventListener('click', stopRecordingAndSend);

  $('fileInput').addEventListener('change', () => {
    const f = $('fileInput').files[0]; $('fileInput').value = '';
    if (!f) return;
    if (f.size > MAX_FILE) { showToast('الحد الأقصى 50 ميغابايت'); return; }
    if (S.editingId || !canSend()) return;
    S.pendingFile = f;
    showChip(f);
    updateSendBtn();
  });

  $('fchipX').addEventListener('click', clearChip);

  $('sheetOverlay').addEventListener('click', closeSheet);

  // Emoji picker via emoji button on input? We don't have one in input. Add to send bar?
  // We'll add on emoji key press via attachment? Simpler: click on input triggers? No.
  // Add emoji button next to mic
  // (We'll append dynamically)
  const inputRow = $('inputrow');
  const emojiBtn = el('button', 'attach');
  emojiBtn.title = 'إيموجي';
  emojiBtn.innerHTML = '<i class="far fa-smile"></i>';
  emojiBtn.style.background = '#fff';
  emojiBtn.onclick = openEmoji;
  inputRow.insertBefore(emojiBtn, $('micBtn'));

  $('emojiOverlay').addEventListener('click', closeEmoji);

  // Settings tabs
  $('stTabs').addEventListener('click', (e) => {
    const t = e.target.closest('.st-tab'); if (!t) return;
    S.settingsTab = t.dataset.tab;
    $('stTabs').querySelectorAll('.st-tab').forEach(x => x.classList.toggle('on', x === t));
    renderSettingsTab();
  });

  // Back button (popstate)
  window.addEventListener('popstate', () => {
    if (S.activeId) {
      teardownRoom();
      document.body.classList.remove('room-open', 'has-room');
      scheduleList();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('mediaViewer').hidden) { closeMedia(); return; }
    if ($('settingsModal').classList.contains('open')) { closeSettings(); return; }
    if ($('emojiSheet').classList.contains('open')) { closeEmoji(); return; }
    if ($('attachSheet').classList.contains('open')) { closeAttach(); return; }
    if ($('sheet').classList.contains('open')) { closeSheet(); return; }
    if (S.editingId || S.reply) clearCtx();
  });

  // Welcome popstate for initial state
  history.replaceState({ view: 'list' }, '', location.href);
}

/* ================= Init ================= */
function init() {
  S.thread = $('thread');
  S.intro = makeIntro();
  S.thread.appendChild(S.intro.root);
  bindEvents();

  onAuthStateChanged(auth, (user) => {
    if (!user) { location.href = LOGIN_PAGE; return; }
    if (S.me) return;
    S.me = user.uid;
    startList();
    renderList();
    const target = new URLSearchParams(location.search).get('uid');
    if (target && target !== S.me) {
      history.replaceState({ view: 'list' }, '', 'chat.html');
      openWith(target);
    }
  });
}

init();

/* Expose for internal calls */
window.closeMedia = closeMedia;
window.downloadMedia = downloadMedia;
window.openSettings = openSettings;
window.closeSettings = closeSettings;
window.pickAttach = pickAttach;
window.startRecordingFromSheet = startRecordingFromSheet;
</script>
</body>
