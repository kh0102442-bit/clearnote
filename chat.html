<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152741">
<title>ClearNote · الدردشات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#152741; --navy-dark:#0f1e33; --accent:#a8741a;
  --bg:#f4f6f8; --chat-bg:#efeae2; --mine:#d9fdd3; --red:#b91c1c;
  --line:#e6e9ee; --muted:#6b7480; --text:#1b2433;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;direction:rtl}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}

.app{height:100vh;height:100dvh;display:flex;overflow:hidden}

/* ================= القائمة ================= */
.list-col{width:100%;height:100%;display:flex;flex-direction:column;background:#fff;min-width:0}
.lhdr{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--navy);color:#fff}
.lhdr h1{font-size:18px;font-weight:800;flex:1}
.hbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.hbtn:hover{background:rgba(255,255,255,.12)}
.search{margin:10px 12px 6px;position:relative;flex:0 0 auto}
.search i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 38px 0 14px;background:#f5f7f9;outline:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:6px 12px;border-radius:16px;background:#eef1f5;color:#334;font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff}
.list-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sec-title{padding:10px 14px 4px;font-size:12px;color:var(--muted);font-weight:700}
.res-hint{padding:6px 14px;font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #f1f3f6;content-visibility:auto;contain-intrinsic-size:auto 68px}
.item:hover{background:#f7f9fb}
.item.sel{background:#eef3f9}
.item .av{width:50px;height:50px;border-radius:50%;flex:0 0 50px;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.item .av img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.top,.bot{display:flex;align-items:center;gap:6px;min-width:0}
.nm{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:12px;color:var(--muted);flex:0 0 auto}
.pv{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.unread .pv.strong{color:#111;font-weight:700}
.item.unread .tm{color:var(--accent);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.tag{flex:0 0 auto;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef1f5;color:#334;font-weight:700;white-space:nowrap}
.tag.gold{background:#fbf1de;color:#7a4f0c}
.tag.red{background:#fde8e8;color:var(--red)}
.vbadge{color:var(--accent);font-size:14px;flex:0 0 auto}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.empty i{font-size:34px;color:#c6ccd4;display:block;margin-bottom:10px}
.bottom-nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav a{flex:1;text-align:center;padding:8px 0 10px;font-size:12px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom-nav a i{font-size:18px}
.bottom-nav a.on{color:var(--navy);font-weight:800}

/* ================= الغرفة ================= */
.main{position:fixed;inset:0;z-index:20;background:var(--chat-bg);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;min-width:0}
body.room-open .main{transform:none}
.empty-main{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#5b6472;text-align:center;padding:20px}
.empty-main i{font-size:48px;color:#b8c0ca}
.room{flex:1;display:flex;flex-direction:column;min-height:0}
.rhdr{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--navy);color:#fff}
.back-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.rav{width:42px;height:42px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;cursor:pointer;flex:0 0 42px}
.rav img{width:100%;height:100%;object-fit:cover}
.rinfo{flex:1;min-width:0;cursor:pointer}
.rname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:5px;min-width:0}
.rname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname .vbadge{color:#e0b25a}
.rsub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thread-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.thread{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;padding:6px 10px 12px}

.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px 16px;gap:6px}
.intro-av{width:104px;height:104px;border-radius:50%;overflow:hidden;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;margin-bottom:6px;box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer}
.intro-av img{width:100%;height:100%;object-fit:cover}
.intro-name{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.intro-role{font-size:13px;color:var(--accent);font-weight:700}
.intro-stats{display:flex;gap:28px;margin-top:6px}
.intro-stats div{display:flex;flex-direction:column;align-items:center}
.intro-stats b{font-size:16px}
.intro-stats span{font-size:12px;color:var(--muted)}
.intro-hint{font-size:12px;color:#5b6472;background:rgba(255,255,255,.75);border-radius:10px;padding:6px 12px;margin-top:8px;max-width:360px;line-height:1.7}

.row{content-visibility:auto;contain-intrinsic-size:auto 60px}
.day{display:flex;justify-content:center;margin:12px 0 6px}
.day span{background:rgba(255,255,255,.9);padding:3px 12px;border-radius:9px;font-size:12px;color:#4d5663;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.mrow{display:flex;margin:1px 0}
.mrow.head{margin-top:8px}
.mrow.mine{justify-content:flex-end}
.bubble{max-width:min(80%,540px);min-width:0;background:#fff;border-radius:12px;padding:6px 9px 4px;box-shadow:0 1px 1px rgba(0,0,0,.08);cursor:pointer;transition:box-shadow .2s}
.theirs.tail .bubble{border-top-right-radius:3px}
.mine .bubble{background:var(--mine)}
.mine.tail .bubble{border-top-left-radius:3px}
.bubble.flash{box-shadow:0 0 0 3px rgba(168,116,26,.55)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6}
.deleted{font-style:italic;color:#7a808a;font-size:14px}
.quote{display:flex;flex-direction:column;gap:2px;border-inline-start:3px solid var(--accent);background:rgba(0,0,0,.05);border-radius:6px;padding:4px 8px;margin-bottom:4px;cursor:pointer;min-width:0}
.quote b{font-size:12px;color:var(--accent)}
.quote span{font-size:13px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:#7a808a;margin-top:2px}
.ticks{font-size:12px;color:#8a929c}
.ticks.seen{color:#34b7f1}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:13px}
.rx.on{border-color:var(--accent);background:#fff8ea}
.rx small{font-size:11px;color:var(--muted)}
.att-img{display:block;margin-bottom:4px;border-radius:8px;overflow:hidden;max-width:100%}
.att-img img{display:block;max-width:100%;max-height:340px;border-radius:8px;object-fit:cover}
.att-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.05);border-radius:8px;padding:8px 10px;margin-bottom:4px;text-decoration:none;color:inherit;min-width:0}
.att-file i{font-size:24px;color:var(--navy)}
.att-file span{display:flex;flex-direction:column;min-width:0}
.att-file b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.att-file small{font-size:12px;color:var(--muted)}

.jump{position:absolute;bottom:12px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;color:var(--navy);z-index:5}
.jump b{position:absolute;top:-6px;inset-inline-start:-4px;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;min-width:20px;text-align:center}

.composer-wrap{flex:0 0 auto;background:#f0f2f5;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.ctx{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;border-inline-start:4px solid var(--accent)}
.ctx > div{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx b{font-size:13px;color:var(--accent)}
.ctx span{font-size:13px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#667;flex:0 0 auto}
.filechip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;position:relative;overflow:hidden}
.filechip .fi{font-size:22px;color:var(--navy)}
.filechip .fn{flex:1;min-width:0;display:flex;flex-direction:column}
.filechip .fn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filechip .fn small{font-size:12px;color:var(--muted)}
.fbar{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--accent);width:0;transition:width .15s}
.notice{background:#fff;border-radius:10px;padding:12px;text-align:center;font-size:14px;color:#44505e;line-height:1.7}
.notice.red{color:var(--red)}
.decide{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.decide p{font-size:14px;text-align:center}
.decide .btns{display:flex;gap:8px}
.btn{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:14px}
.btn.ok{background:var(--navy);color:#fff}
.btn.no{background:#fde8e8;color:var(--red)}
.inputrow{display:flex;align-items:flex-end;gap:6px}
.attach{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#5a6470;flex:0 0 auto;font-size:18px}
.inputrow textarea{flex:1;min-width:0;resize:none;border:none;outline:none;border-radius:20px;padding:11px 14px;background:#fff;max-height:140px;line-height:1.5;font-size:15px}
.send{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:16px}
.send:disabled{opacity:.45;cursor:default}

/* ================= لوحة الخيارات ================= */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;width:min(440px,100%);transform:translate(-50%,105%);background:#fff;border-radius:18px 18px 0 0;z-index:51;padding:10px 14px calc(16px + env(safe-area-inset-bottom));transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.sheet.open{transform:translate(-50%,0)}
.sh-grip{width:40px;height:4px;border-radius:2px;background:#d6dbe2;margin:0 auto 10px}
.sh-emojis{display:flex;justify-content:space-between;gap:4px;margin-bottom:8px}
.sh-emojis button{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.sh-emojis button.on{background:#fff3da;box-shadow:inset 0 0 0 2px var(--accent)}
.sh-actions{display:flex;flex-direction:column}
.sh-actions button{display:flex;align-items:center;gap:12px;padding:12px 8px;font-size:15px;border-radius:10px;text-align:start}
.sh-actions button:hover{background:#f4f6f8}
.sh-actions i{width:20px;text-align:center;color:var(--navy)}
.sh-actions .danger,.sh-actions .danger i{color:var(--red)}

/* ================= الشاشات الواسعة ================= */
@media (min-width:900px){
  .list-col{width:360px;flex:0 0 360px;border-inline-end:1px solid var(--line)}
  .bottom-nav{display:none}
  .back-btn{display:none}
  .main{position:relative;inset:auto;transform:none;flex:1;transition:none;z-index:auto}
  body:not(.has-room) .empty-main{display:flex}
  body:not(.has-room) .room{display:none}
}
</style>
</head>
<body>
<div class="app">

  <aside class="list-col" id="listCol">
    <header class="lhdr">
      <a class="hbtn" href="app.html" title="الرئيسية"><i class="fa-solid fa-house"></i></a>
      <h1>الدردشات</h1>
    </header>

    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="search" type="search" placeholder="ابحث بالاسم أو اسم المستخدم أو الهاتف" autocomplete="off">
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="all">الكل</button>
      <button class="tab" data-tab="unread">غير المقروءة</button>
      <button class="tab" data-tab="direct">الخاص</button>
      <button class="tab" data-tab="groups">الجروبات</button>
      <button class="tab" data-tab="channels">القنوات</button>
      <button class="tab" data-tab="communities">المجتمعات</button>
      <button class="tab" data-tab="study">غرف المذاكرة</button>
    </nav>

    <div class="list-scroll" id="listScroll">
      <section id="resultsWrap" hidden>
        <div class="sec-title">المستخدمون</div>
        <div class="res-hint" id="resHint" hidden>اكتب حرفين على الأقل</div>
        <div id="results"></div>
        <div class="res-hint" id="resEmpty" hidden>لا يوجد مستخدم مطابق</div>
      </section>
      <div id="chatList"></div>
      <div class="empty" id="listEmpty" hidden></div>
      <div class="empty" id="placeholder" hidden></div>
    </div>

    <nav class="bottom-nav">
      <a href="app.html"><i class="fa-solid fa-house"></i>الرئيسية</a>
      <a href="chat.html" class="on"><i class="fa-solid fa-comments"></i>الدردشات</a>
      <a href="profile.html"><i class="fa-solid fa-user"></i>حسابي</a>
    </nav>
  </aside>

  <main class="main" id="main">
    <div class="empty-main">
      <i class="fa-regular fa-comments"></i>
      <p>اختر محادثة للبدء</p>
    </div>

    <section class="room" id="room">
      <header class="rhdr">
        <button class="back-btn" id="backBtn" title="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
        <div class="rav" id="rav"></div>
        <div class="rinfo" id="rinfo">
          <div class="rname"><span id="rname"></span><i class="fa-solid fa-circle-check vbadge" id="rverified" hidden></i></div>
          <div class="rsub" id="rsub"></div>
        </div>
      </header>

      <div class="thread-wrap">
        <div class="thread" id="thread"></div>
        <button class="jump" id="jump" hidden><i class="fa-solid fa-chevron-down"></i><b id="jumpN" hidden>0</b></button>
      </div>

      <div class="composer-wrap" id="composer" hidden>
        <div class="ctx" id="ctx" hidden>
          <div><b id="ctxTitle"></b><span id="ctxText"></span></div>
          <button class="icon-x" id="ctxClose" title="إلغاء"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="filechip" id="filechip" hidden>
          <i class="fa-solid fa-file fi" id="fchipIcon"></i>
          <div class="fn"><b id="fchipName"></b><small id="fchipSize"></small></div>
          <button class="icon-x" id="fchipX" title="إزالة"><i class="fa-solid fa-xmark"></i></button>
          <div class="fbar" id="fbar"></div>
        </div>

        <div class="notice" id="notice" hidden></div>

        <div class="decide" id="decide" hidden>
          <p id="decideText"></p>
          <div class="btns">
            <button class="btn ok" id="acceptBtn">موافقة</button>
            <button class="btn no" id="blockBtn">حظر</button>
          </div>
        </div>

        <div class="inputrow" id="inputrow">
          <button class="attach" id="attach" title="إرفاق ملف"><i class="fa-solid fa-paperclip"></i></button>
          <textarea id="input" rows="1" maxlength="2000" placeholder="اكتب رسالة"></textarea>
          <button class="send" id="send" disabled title="إرسال"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </section>
  </main>
</div>

<input type="file" id="fileInput" hidden>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog">
  <div class="sh-grip"></div>
  <div class="sh-emojis" id="shEmojis"></div>
  <div class="sh-actions" id="shActions"></div>
</div>

<script type="module">
import { auth, db, showToast } from './shared.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  collection, doc, getDoc, getDocs, onSnapshot, query, where, orderBy, limit,
  writeBatch, updateDoc, serverTimestamp, deleteField
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ================= ثوابت ================= */
const LOGIN_PAGE = 'index.html';
const PROFILE_PAGE = 'profile.html';
const PAGE_SIZE = 30;
const CHAT_LIST_LIMIT = 300;
const MAX_TEXT = 2000;
const MAX_FILE = 10 * 1024 * 1024;
const GROUP_GAP_MS = 5 * 60 * 1000;
const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
const CLOUD_URL = 'https://api.cloudinary.com/v1_1/nopxs3zt/auto/upload';
const CLOUD_PRESET = 'clearnote_unsigned';
const FOLLOWERS_KEY = 'followersCount';
const POSTS_KEY = 'postsCount';
const PLACEHOLDER_TABS = {
  groups: 'الجروبات قريباً',
  channels: 'القنوات قريباً',
  communities: 'المجتمعات قريباً',
  study: 'غرف المذاكرة قريباً'
};
const ROLE_LABEL = { admin: 'مشرف', moderator: 'مشرف', founder: 'المؤسس', member: 'عضو', user: 'عضو' };

/* ================= الحالة ================= */
const S = {
  me: null,
  tab: 'all',
  listQuery: '',
  chats: new Map(),
  listUnsub: null,

  activeId: null,
  otherUid: null,
  chatExists: false,
  chatData: null,
  otherReadMs: 0,
  roomUnsub: null,
  msgUnsub: null,

  windowSize: PAGE_SIZE,
  hasMore: true,
  loadingOlder: false,
  anchorH: null,
  ready: false,
  forceBottom: true,
  newBelow: 0,

  order: [],
  map: new Map(),

  reply: null,
  editingId: null,
  sheetId: null,
  pendingFile: null,
  uploading: false,

  thread: null,
  intro: null
};

/* ================= أدوات ================= */
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

const toMs = (v) => {
  if (!v) return null;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  if (typeof v.seconds === 'number') return v.seconds * 1000;
  return null;
};

const chatIdFor = (a, b) => [a, b].sort().join('_');
const otherOf = (d) => (d.participants || []).find((x) => x !== S.me) || null;
const initialOf = (name) => (name || '?').trim().charAt(0) || '?';
const fmtTime = (ms) => new Date(ms).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate(); };
const fmtNum = (n) => Number(n || 0).toLocaleString('ar');
const roleLabel = (r) => ROLE_LABEL[r] || r || 'عضو';

function dayLabel(ms) {
  const now = Date.now();
  if (dayKey(ms) === dayKey(now)) return 'اليوم';
  if (dayKey(ms) === dayKey(now - 86400000)) return 'أمس';
  const d = new Date(ms);
  return d.toLocaleDateString('ar', {
    weekday: 'long', day: 'numeric', month: 'long',
    year: d.getFullYear() === new Date(now).getFullYear() ? undefined : 'numeric'
  });
}

function shortTime(ms) {
  return dayKey(ms) === dayKey(Date.now())
    ? fmtTime(ms)
    : new Date(ms).toLocaleDateString('ar', { day: 'numeric', month: 'numeric' });
}

function fmtSize(b) {
  if (!b) return '';
  if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

function transformUrl(url, t) {
  return url && url.includes('/upload/') ? url.replace('/upload/', `/upload/${t}/`) : url;
}
const avatarSrc = (u, s) => (u && u.avatarUrl ? transformUrl(u.avatarUrl, `w_${s},h_${s},c_fill,q_auto,f_auto`) : '');
const thumbSrc = (url) => transformUrl(url, 'w_520,h_360,c_limit,q_auto,f_auto');

function fillAv(node, u, size) {
  const src = avatarSrc(u, size);
  const key = src + '|' + (u?.name || '');
  if (node._key === key) return;
  node._key = key;
  node.textContent = '';
  if (src) {
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'lazy';
    img.onerror = () => { img.remove(); node.textContent = initialOf(u.name); };
    img.src = src;
    node.appendChild(img);
  } else {
    node.textContent = initialOf(u?.name);
  }
}

function goProfile(uid) {
  if (!uid) return;
  location.href = uid === S.me ? PROFILE_PAGE : `${PROFILE_PAGE}?uid=${encodeURIComponent(uid)}`;
}

/* ================= المستخدمون (كاش) ================= */
const userCache = new Map();
const userPending = new Map();

function normUser(uid, d) {
  return {
    uid,
    name: d.name || d.username || 'مستخدم',
    username: d.username || '',
    avatarUrl: d.avatarUrl || '',
    role: d.role || '',
    verified: d.verified === true || d.isVerified === true,
    followers: Number(d[FOLLOWERS_KEY]) || 0,
    posts: Number(d[POSTS_KEY]) || 0
  };
}

const placeholder = (uid) => normUser(uid, { name: '…' });

function fetchUser(uid) {
  if (userPending.has(uid)) return userPending.get(uid);
  const p = getDoc(doc(db, 'users', uid))
    .then((s) => normUser(uid, s.exists() ? s.data() : {}))
    .catch(() => normUser(uid, { name: 'مستخدم' }))
    .then((u) => {
      userCache.set(uid, u);
      userPending.delete(uid);
      onUserLoaded(uid);
      return u;
    });
  userPending.set(uid, p);
  return p;
}

function cachedUser(uid) {
  if (!uid) return null;
  const u = userCache.get(uid);
  if (u) return u;
  if (!userPending.has(uid)) fetchUser(uid);
  return null;
}

function onUserLoaded(uid) {
  scheduleList();
  if (S.otherUid === uid) { renderHeader(); renderIntro(); }
}

/* ================= الحالة والصلاحيات ================= */
function needsRead(d) {
  if (!d || !S.me) return false;
  if ((d.status || 'active') === 'blocked') return false;
  if (d.lastSenderUid === S.me) return false;
  const last = toMs(d.lastMessageAt) ?? Date.now();
  const rv = d.readAt ? d.readAt[S.me] : undefined;
  const read = rv === undefined ? 0 : (toMs(rv) ?? Date.now());
  return last > read;
}

function roomState() {
  if (!S.activeId) return 'none';
  if (!S.chatExists || !S.chatData) return 'new';
  const st = S.chatData.status || 'active';
  if (st === 'blocked') return 'blocked';
  if (st === 'pending') return S.chatData.requesterUid === S.me ? 'wait' : 'decide';
  return 'active';
}

const canSend = () => { const s = roomState(); return s === 'new' || s === 'active'; };

/* ================= قائمة الدردشات ================= */
const listEls = new Map();
let listScheduled = false;

function scheduleList() {
  if (listScheduled) return;
  listScheduled = true;
  requestAnimationFrame(() => { listScheduled = false; renderList(); });
}

function visibleChats() {
  const q = S.listQuery.toLowerCase();
  const out = [];
  for (const [id, d] of S.chats) {
    if (!d.participants || !d.participants.includes(S.me)) continue;
    const st = d.status || 'active';
    if (st === 'blocked') continue;
    if (S.tab === 'direct' && st !== 'active') continue;
    if (S.tab === 'unread' && !needsRead(d)) continue;
    if (q) {
      const u = cachedUser(otherOf(d));
      if (!u || !(u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q))) continue;
    }
    out.push({ id, d, ms: toMs(d.lastMessageAt) ?? Date.now() });
  }
  out.sort((a, b) => b.ms - a.ms);
  return out;
}

function makeListRow() {
  const row = el('div', 'item');
  const av = el('div', 'av');
  av.dataset.profile = '';
  const info = el('div', 'info');
  const top = el('div', 'top');
  const nm = el('div', 'nm');
  const nmText = el('span');
  const vb = el('i', 'fa-solid fa-circle-check vbadge');
  nm.append(nmText, vb);
  const tm = el('span', 'tm');
  top.append(nm, tm);
  const bot = el('div', 'bot');
  const pv = el('div', 'pv');
  const tag = el('span', 'tag');
  const dot = el('span', 'dot');
  bot.append(pv, tag, dot);
  info.append(top, bot);
  row.append(av, info);
  row._r = { av, nm: nmText, vb, tm, pv, tag, dot };
  return row;
}

function previewOf(d) {
  const t = d.lastMessage || '';
  return d.lastSenderUid === S.me ? 'أنت: ' + t : t;
}

function paintListRow(row, id, d) {
  const r = row._r;
  const other = otherOf(d);
  const u = cachedUser(other);
  row.dataset.id = id;
  row.dataset.uid = other || '';
  row.classList.toggle('sel', id === S.activeId);
  fillAv(r.av, u || placeholder(other), 100);
  r.nm.textContent = u ? u.name : '…';
  r.vb.hidden = !(u && u.verified);
  r.tm.textContent = shortTime(toMs(d.lastMessageAt) ?? Date.now());
  const st = d.status || 'active';
  const incoming = st === 'pending' && d.requesterUid !== S.me;
  r.tag.hidden = st !== 'pending';
  r.tag.className = 'tag' + (incoming ? ' gold' : '');
  r.tag.textContent = incoming ? 'طلب مراسلة' : 'بانتظار الرد';
  const unread = needsRead(d);
  row.classList.toggle('unread', unread);
  r.dot.hidden = !unread;
  r.pv.classList.toggle('strong', unread);
  r.pv.textContent = previewOf(d);
}

function renderList() {
  if (!S.me) return;
  const list = $('chatList'), empty = $('listEmpty'), ph = $('placeholder');
  const phText = PLACEHOLDER_TABS[S.tab];
  list.hidden = !!phText;
  ph.hidden = !phText;
  empty.hidden = true;
  if (phText) {
    ph.textContent = '';
    ph.append(el('i', 'fa-solid fa-hourglass-half'), phText);
    return;
  }
  const items = visibleChats();
  const frag = document.createDocumentFragment();
  const seen = new Set();
  for (const it of items) {
    let row = listEls.get(it.id);
    if (!row) { row = makeListRow(); listEls.set(it.id, row); }
    paintListRow(row, it.id, it.d);
    seen.add(it.id);
    frag.appendChild(row);
  }
  for (const [id, row] of listEls) {
    if (!seen.has(id)) { row.remove(); listEls.delete(id); }
  }
  list.replaceChildren(frag);
  if (!items.length) {
    empty.hidden = false;
    empty.textContent = S.tab === 'unread'
      ? 'لا توجد رسائل غير مقروءة'
      : 'لا توجد محادثات بعد. ابحث باسم شخص أو اسم مستخدمه لبدء المراسلة.';
  }
}

function startList() {
  if (S.listUnsub) S.listUnsub();
  S.listUnsub = onSnapshot(
    query(collection(db, 'chats'), where('participants', 'array-contains', S.me), limit(CHAT_LIST_LIMIT)),
    (snap) => {
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed') S.chats.delete(ch.doc.id);
        else S.chats.set(ch.doc.id, ch.doc.data());
      }
      scheduleList();
    },
    () => showToast('تعذر تحميل الدردشات')
  );
}

async function runSearch(raw) {
  const seq = ++searchSeq;
  const wrap = $('resultsWrap'), hint = $('resHint'), empty = $('resEmpty');
  if (!raw) { wrap.hidden = true; $('results').replaceChildren(); return; }
  const q = raw.replace(/^@/, '').trim();
  const lower = q.toLowerCase();
  const digits = raw.replace(/\D/g, '');
  const canName = q.length >= 2;
  const canPhone = digits.length >= 6;
  wrap.hidden = false;
  empty.hidden = true;
  hint.hidden = canName || canPhone;
  if (!canName && !canPhone) { $('results').replaceChildren(); return; }

  const usersRef = collection(db, 'users');
  const jobs = [];
  if (canName) {
    jobs.push(getDocs(query(usersRef, where('name', '>=', q), where('name', '<=', q + '\uf8ff'), limit(10))));
    jobs.push(getDocs(query(usersRef, where('lower', 'in', [lower]), limit(5))));
    jobs.push(getDocs(query(usersRef, where('term', 'in', [q, lower]), limit(10))));
  }
  if (canPhone) jobs.push(getDocs(query(usersRef, where('digits', 'in', [digits]), limit(5))));

  const snaps = await Promise.all(jobs.map((p) => p.catch(() => null)));
  if (seq !== searchSeq) return;

  const found = new Map();
  for (const s of snaps) {
    if (!s) continue;
    s.forEach((d) => {
      if (d.id !== S.me && !found.has(d.id)) found.set(d.id, normUser(d.id, d.data()));
    });
  }
  const frag = document.createDocumentFragment();
  for (const u of found.values()) {
    if (!userCache.has(u.uid)) userCache.set(u.uid, u);
    frag.appendChild(makeUserItem(u));
  }
  $('results').replaceChildren(frag);
  empty.hidden = found.size > 0;
}

function openWith(uid) {

  openRoomFor(chatIdFor(S.me, uid), uid);
}

function teardownRoom() {
  if (S.roomUnsub) { S.roomUnsub(); S.roomUnsub = null; }
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  S.activeId = null;
  S.otherUid = null;
  S.chatExists = false;
  S.chatData = null;
  S.otherReadMs = 0;
  S.order = [];
  S.map = new Map();
  S.anchorH = null;
  S.loadingOlder = false;
  S.ready = false;
  S.newBelow = 0;
  S.forceBottom = true;
  S.hasMore = true;
  S.windowSize = PAGE_SIZE;
  S.reply = null;
  S.editingId = null;
  clearChip();
  S.thread.replaceChildren(S.intro.root);
  $('input').value = '';
  $('ctx').hidden = true;
  autoSize();
  updateSendBtn();
  updateJump();
}

function openRoomFor(chatId, uid) {
  if (!chatId || !uid) return;
  if (S.activeId === chatId) {
    document.body.classList.add('room-open', 'has-room');
    return;
  }
  teardownRoom();
  S.activeId = chatId;
  S.otherUid = uid;
  const cached = S.chats.get(chatId) || null;
  S.chatExists = !!cached;
  S.chatData = cached;
  document.body.classList.add('room-open', 'has-room');
  renderHeader();
  renderIntro();
  renderComposer();
  if (S.chatExists) subscribeMessages();
  fetchUser(uid).then(() => {
    if (S.activeId === chatId) { renderHeader(); renderIntro(); }
  });
  S.roomUnsub = onSnapshot(
    doc(db, 'chats', chatId),
    (snap) => { if (S.activeId === chatId) onRoomChat(snap); },
    () => showToast('تعذر فتح المحادثة')
  );
  scheduleList();
}

function closeRoom() {
  teardownRoom();
  document.body.classList.remove('room-open', 'has-room');
  scheduleList();
}

function onRoomChat(snap) {
  S.chatExists = snap.exists();
  S.chatData = snap.exists() ? snap.data() : null;
  if (S.chatExists && !S.msgUnsub) subscribeMessages();
  const om = toMs(S.chatData?.readAt?.[S.otherUid]) ?? 0;
  if (om !== S.otherReadMs) {
    S.otherReadMs = om;
    refreshTicks();
  }
  renderHeader();
  renderIntro();
  renderComposer();
  maybeMarkRead();
}

function renderComposer() {

function updateJump() {

  $('jump').hidden = !(far || S.newBelow > 0);
  const b = $('jumpN');

const nearBottom = () => {
  const t = S.thread;
  return t.scrollHeight - t.scrollTop - t.clientHeight < 140;

/* ================= الرسائل: الترتيب والإدراج ================= */
const sigOf = (d) => [
  d.text || '',
  d.deleted ? 1 : 0,
  d.isEdited ? 1 : 0,
  d.attachment?.url || '',
  d.replyTo?.id || '',
  d.replyTo?.text || '',
  JSON.stringify(d.reactions || {})
].join('\u0001');

function fileIcon(a) {
  const m = a.mime || '';
  if (m.includes('pdf')) return 'fa-file-pdf';
  if (m.startsWith('video/')) return 'fa-file-video';
  if (m.startsWith('audio/')) return 'fa-file-audio';
  return 'fa-file';
}

function buildAttachment(a) {
  if (a.kind === 'image') {
    const link = el('a', 'att-img');
    link.href = a.url;
    link.target = '_blank';
    link.rel = 'noopener';
    const img = new Image();
    img.alt = a.name || '';
    img.decoding = 'async';
    img.loading = 'lazy';
    if (a.w && a.h) img.style.aspectRatio = `${a.w} / ${a.h}`;
    img.src = thumbSrc(a.url);
    link.appendChild(img);
    return link;
  }
  const f = el('a', 'att-file');
  f.href = a.url;
  f.target = '_blank';
  f.rel = 'noopener';
  f.download = a.name || '';
  const info = el('span');
  info.append(el('b', null, a.name || 'ملف'), el('small', null, fmtSize(a.size)));
  f.append(el('i', 'fa-solid ' + fileIcon(a)), info);
  return f;
}

function buildReactions(reacts) {
  const wrap = el('div', 'rxs');
  const counts = new Map();
  for (const emo of Object.values(reacts)) counts.set(emo, (counts.get(emo) || 0) + 1);
  const mine = reacts[S.me];
  for (const [emo, n] of counts) {
    const chip = el('span', 'rx' + (mine === emo ? ' on' : ''), emo);
    if (n > 1) chip.appendChild(el('small', null, ' ' + n));
    wrap.appendChild(chip);
  }
  return wrap;
}

function makeEntry(id, ms, data) {
  const row = el('div', 'row');
  row.dataset.id = id;
  const day = el('div', 'day');
  const dspan = el('span');
  day.appendChild(dspan);
  const mrow = el('div', 'mrow');
  const bubble = el('div', 'bubble');
  mrow.appendChild(bubble);
  row.append(day, mrow);
  return { id, ms, data, row, day, dspan, mrow, bubble, tick: null, sig: '' };
}

function setTick(e) {
  if (!e.tick) return;
  const seen = !!S.otherReadMs && e.ms <= S.otherReadMs;
  e.tick.className = 'fa-solid ticks ' + (seen ? 'fa-check-double seen' : 'fa-check');
}

function refreshTicks() {
  for (const e of S.order) if (e.tick) setTick(e);
}

function paintEntry(e) {
  const d = e.data;
  const sig = sigOf(d);
  if (sig === e.sig) return;
  e.sig = sig;
  const mine = d.senderUid === S.me;
  e.mrow.classList.toggle('mine', mine);
  e.mrow.classList.toggle('theirs', !mine);
  const b = e.bubble;
  b.textContent = '';
  e.tick = null;

  if (d.replyTo && !d.deleted) {
    const q = el('div', 'quote');
    q.dataset.jump = d.replyTo.id;
    q.append(el('b', null, d.replyTo.name || 'رسالة'), el('span', null, d.replyTo.text || '📎 مرفق'));
    b.appendChild(q);
  }

  if (d.deleted) {
    b.appendChild(el('div', 'txt deleted', 'تم حذف الرسالة'));
  } else {
    if (d.attachment) b.appendChild(buildAttachment(d.attachment));
    if (d.text) b.appendChild(el('div', 'txt', d.text));
    if (d.reactions && Object.keys(d.reactions).length) b.appendChild(buildReactions(d.reactions));
  }

  const meta = el('div', 'meta');
  if (d.isEdited && !d.deleted) meta.appendChild(el('span', null, 'معدّلة'));
  meta.appendChild(el('span', null, fmtTime(e.ms)));
  if (mine) {
    e.tick = el('i');
    meta.appendChild(e.tick);
    setTick(e);
  }
  b.appendChild(meta);
}

function lowerBound(ms, id) {
  let lo = 0, hi = S.order.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    const m = S.order[mid];
    if (m.ms < ms || (m.ms === ms && m.id < id)) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function findIdx(e) {
  const i = lowerBound(e.ms, e.id);
  return S.order[i] === e ? i : S.order.indexOf(e);
}

function relayout(from, to) {
  const arr = S.order;
  const lo = Math.max(0, from), hi = Math.min(arr.length - 1, to);
  for (let i = lo; i <= hi; i++) {
    const e = arr[i], p = arr[i - 1];
    const newDay = !p || dayKey(p.ms) !== dayKey(e.ms);
    const head = newDay || p.data.senderUid !== e.data.senderUid || e.ms - p.ms > GROUP_GAP_MS;
    if (newDay) {
      e.day.hidden = false;
      e.dspan.textContent = dayLabel(e.ms);
    } else {
      e.day.hidden = true;
    }
    e.mrow.classList.toggle('head', head);
    e.mrow.classList.toggle('tail', head);
  }
}

function detach(e) {
  const i = findIdx(e);
  if (i < 0) return;
  S.order.splice(i, 1);
  e.row.remove();
  relayout(i - 1, i);
}

function attach(e) {
  const i = lowerBound(e.ms, e.id);
  S.order.splice(i, 0, e);
  const next = S.order[i + 1];
  S.thread.insertBefore(e.row, next ? next.row : null);
  relayout(i - 1, i + 1);
}

function upsertMessage(id, d) {
  const ms = toMs(d.createdAt) ?? Date.now();
  let e = S.map.get(id);
  if (e) {
    e.data = d;
    if (e.ms === ms) { paintEntry(e); return; }
    detach(e);
    e.ms = ms;
  } else {
    e = makeEntry(id, ms, d);
    S.map.set(id, e);
  }
  paintEntry(e);
  attach(e);
}

/* ================= الرسائل: الاشتراك والتحميل ================= */
function subscribeMessages() {
  if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
  const chatId = S.activeId;
  if (!chatId) return;
  const q = query(
    collection(db, 'chats', chatId, 'messages'),
    orderBy('createdAt', 'desc'),
    limit(S.windowSize)
  );
  S.msgUnsub = onSnapshot(
    q,
    (snap) => { if (S.activeId === chatId) applySnapshot(snap); },
    () => {
      S.loadingOlder = false;
      S.anchorH = null;
      if (S.activeId === chatId) showToast('تعذر تحميل الرسائل');
    }
  );
}

function applySnapshot(snap) {
  const thread = S.thread;
  const wasBottom = S.forceBottom || nearBottom();
  let incoming = 0;
  for (const ch of snap.docChanges()) {
    if (ch.type === 'removed') continue;
    const id = ch.doc.id, d = ch.doc.data();
    const isNew = !S.map.has(id);
    upsertMessage(id, d);
    if (isNew && d.senderUid !== S.me) incoming++;
  }
  if (!snap.metadata.fromCache) S.hasMore = snap.size >= S.windowSize;
  S.ready = true;

  if (S.anchorH != null) {
    thread.scrollTop += thread.scrollHeight - S.anchorH;
    S.anchorH = null;
    S.loadingOlder = false;
  } else if (wasBottom) {
    thread.scrollTop = thread.scrollHeight;
    S.forceBottom = false;
    S.newBelow = 0;
  } else if (incoming) {
    S.newBelow += incoming;
  }
  updateJump();
  if (wasBottom) maybeMarkRead();
}

function loadOlder() {
  if (S.loadingOlder || !S.hasMore || !S.ready || !S.activeId) return;
  S.loadingOlder = true;
  S.anchorH = S.thread.scrollHeight;
  S.windowSize += PAGE_SIZE;
  subscribeMessages();
}

function scrollToMsg(id) {
  const e = S.map.get(id);
  if (!e) { showToast('الرسالة أقدم من المحمّل. مرّر للأعلى لتحميل المزيد'); return; }
  e.row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  e.bubble.classList.add('flash');
  setTimeout(() => e.bubble.classList.remove('flash'), 1200);
}

/* ================= القراءة ================= */
let marking = false;

function maybeMarkRead() {
  if (S.activeId && S.chatData && needsRead(S.chatData) && nearBottom()) markRead();
}

async function markRead() {
  if (marking || !S.activeId) return;
  marking = true;
  const chatId = S.activeId;
  try {
    await updateDoc(doc(db, 'chats', chatId), { [`readAt.${S.me}`]: serverTimestamp() });
  } catch (err) {
    console.warn('markRead', err);
  } finally {
    marking = false;
  }
}

/* ================= طلب المراسلة ================= */
async function acceptRequest() {
  if (!S.activeId) return;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), { status: 'active', acceptedAt: serverTimestamp() });
  } catch (err) {
    console.error(err);
    showToast('تعذر قبول الطلب');
  }
}

async function blockRequest() {
  if (!S.activeId) return;
  if (!confirm('حظر هذا المستخدم؟ لن تصلك رسائله بعد الآن.')) return;
  try {
    await updateDoc(doc(db, 'chats', S.activeId), {
      status: 'blocked', blockedBy: S.me, blockedAt: serverTimestamp()
    });
  } catch (err) {
    console.error(err);
    showToast('تعذر تنفيذ الحظر');
  }
}

/* ================= الرفع ================= */
function uploadAttachment(file) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', CLOUD_URL);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) $('fbar').style.width = Math.round((e.loaded / e.total) * 100) + '%';
    };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText); } catch (_) { j = null; }
      if (xhr.status >= 200 && xhr.status < 300 && j && j.secure_url) {
        resolve({
          kind: (file.type || '').startsWith('image/') ? 'image' : 'file',
          url: j.secure_url,
          name: file.name,
          size: file.size,
          mime: file.type || '',
          w: j.width || null,
          h: j.height || null
        });
      } else {
        reject(new Error('upload failed'));
      }
    };
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(fd);
  });
}

function showChip(f) {
  const isImg = (f.type || '').startsWith('image/');
  $('fchipIcon').className = 'fa-solid fi ' + (isImg ? 'fa-image' : 'fa-file');
  $('fchipName').textContent = f.name;
  $('fchipSize').textContent = fmtSize(f.size);
  $('fbar').style.width = '0';
  $('filechip').hidden = false;
}

function clearChip() {
  S.pendingFile = null;
  $('fileInput').value = '';
  $('filechip').hidden = true;
  $('fbar').style.width = '0';
  updateSendBtn();
}

/* ================= الإرسال ================= */
function autoSize() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 140) + 'px';
}

function updateSendBtn() {
  const has = $('input').value.trim().length > 0 || !!S.pendingFile;
  $('send').disabled = S.uploading || !has;
}

async function onSend() {
  if (S.uploading) return;
  const input = $('input');
  const text = input.value.trim();

  if (S.editingId) { await saveEdit(text); return; }

  const file = S.pendingFile;
  if (!text && !file) return;
  if (text.length > MAX_TEXT) { showToast('الرسالة طويلة جداً (الحد 2000 حرف)'); return; }
  if (!canSend()) return;

  const chatId = S.activeId, other = S.otherUid, me = S.me;
  let attachment = null;

  if (file) {
    S.uploading = true;
    updateSendBtn();
    try {
      attachment = await uploadAttachment(file);
    } catch (err) {
      console.error(err);
      showToast('تعذر رفع الملف، حاول مرة أخرى');
      S.uploading = false;
      updateSendBtn();
      return;
    }
    S.uploading = false;
  }

  if (S.activeId !== chatId || !canSend()) { updateSendBtn(); return; }

  const reply = S.reply;
  const chatRef = doc(db, 'chats', chatId);
  const msgRef = doc(collection(db, 'chats', chatId, 'messages'));
  const replyTo = reply
    ? { id: reply.id, senderUid: reply.senderUid, name: reply.name, text: reply.text }
    : null;
  const payload = {
    senderUid: me,
    text,
    createdAt: serverTimestamp(),
    isEdited: false,
    deleted: false,
    replyTo,
    reactions: {},
    attachment
  };
  const preview = (text || (attachment
    ? (attachment.kind === 'image' ? '📷 صورة' : '📎 ' + attachment.name)
    : '')).slice(0, 120);
  const meta = {
    lastMessage: preview,
    lastMessageAt: serverTimestamp(),
    lastSenderUid: me,
    lastMessageId: msgRef.id
  };

  const batch = writeBatch(db);
  const creating = !S.chatExists;
  if (S.chatExists) {
    batch.update(chatRef, meta);
  } else {
    batch.set(chatRef, {
      participants: [me, other].sort(),
      createdAt: serverTimestamp(),
      status: 'pending',
      requesterUid: me,
      readAt: { [me]: serverTimestamp() },
      ...meta
    });
  }
  batch.set(msgRef, payload);

  if (creating) {
    S.chatExists = true;
    S.chatData = {
      participants: [me, other].sort(),
      status: 'pending',
      requesterUid: me,
      lastSenderUid: me,
      lastMessage: preview
    };
  }

  input.value = '';
  autoSize();
  clearChip();
  S.reply = null;
  $('ctx').hidden = true;
  renderComposer();
  renderHeader();
  renderIntro();
  S.forceBottom = true;

  try {
    await batch.commit();
    if (!S.msgUnsub && S.activeId === chatId) subscribeMessages();
  } catch (err) {
    console.error(err);
    showToast('تعذر الإرسال');
    if (creating && S.activeId === chatId) {
      S.chatExists = false;
      S.chatData = null;
      if (S.msgUnsub) { S.msgUnsub(); S.msgUnsub = null; }
      renderComposer();
    }
    if (S.activeId === chatId && !input.value) {
      input.value = text;
      autoSize();
    }
    updateSendBtn();
  }
}

/* ================= التعديل والحذف والتفاعل ================= */
function showCtx(title, text) {
  $('ctxTitle').textContent = title;
  $('ctxText').textContent = text;
  $('ctx').hidden = false;
}

function clearCtx() {
  const wasEdit = S.editingId !== null;
  S.reply = null;
  S.editingId = null;
  $('ctx').hidden = true;
  if (wasEdit) $('input').value = '';
  autoSize();
  updateSendBtn();
}

function startReply(id) {
  const e = S.map.get(id);
  if (!e) return;
  const d = e.data;
  const name = d.senderUid === S.me ? 'أنت' : (userCache.get(S.otherUid)?.name || 'الطرف الآخر');
  const text = d.text || (d.attachment
    ? (d.attachment.kind === 'image' ? '📷 صورة' : '📎 ' + (d.attachment.name || 'ملف'))
    : '');
  S.reply = { id, senderUid: d.senderUid, name, text: text.slice(0, 140) };
  S.editingId = null;
  showCtx('الرد على ' + name, S.reply.text);
  $('input').focus();
}

function startEdit(id) {
  const e = S.map.get(id);
  if (!e) return;
  S.reply = null;
  S.editingId = id;
  clearChip();
  showCtx('تعديل الرسالة', e.data.text);
  const input = $('input');
  input.value = e.data.text;
  autoSize();
  input.focus();
  updateSendBtn();
}

async function saveEdit(text) {
  const id = S.editingId;
  const e = S.map.get(id);
  if (!e || !text) return;
  if (text === e.data.text) { clearCtx(); return; }
  if (text.length > MAX_TEXT) { showToast('الرسالة طويلة جداً'); return; }
  const chatId = S.activeId;
  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), {
    text, isEdited: true, editedAt: serverTimestamp()
  });
  if (S.chatData?.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: text.slice(0, 120) });
  }
  S.editingId = null;
  $('input').value = '';
  clearCtx();
  try {
    await batch.commit();
  } catch (err) {
    console.error(err);
    showToast('تعذر حفظ التعديل');
  }
}

async function deleteMsg(id) {
  if (!confirm('حذف هذه الرسالة؟')) return;
  const chatId = S.activeId;
  if (!chatId) return;
  const batch = writeBatch(db);
  batch.update(doc(db, 'chats', chatId, 'messages', id), {
    text: '', deleted: true, deletedAt: serverTimestamp()
  });
  if (S.chatData?.lastMessageId === id) {
    batch.update(doc(db, 'chats', chatId), { lastMessage: 'تم حذف الرسالة' });
  }
  try {
    await batch.commit();
  } catch (err) {
    console.error(err);
    showToast('تعذر الحذف');
  }
}

async function toggleReaction(id, emo) {
  const e = S.map.get(id);
  if (!e || e.data.deleted || !S.activeId) return;
  const ref = doc(db, 'chats', S.activeId, 'messages', id);
  const cur = e.data.reactions?.[S.me];
  try {
    await updateDoc(ref, { [`reactions.${S.me}`]: cur === emo ? deleteField() : emo });
  } catch (err) {
    console.error(err);
    showToast('تعذر إضافة التفاعل');
  }
}

function copyText(text) {
  if (!navigator.clipboard) { showToast('النسخ غير مدعوم'); return; }
  navigator.clipboard.writeText(text)
    .then(() => showToast('تم النسخ'))
    .catch(() => showToast('تعذر النسخ'));
}

/* ================= لوحة الخيارات ================= */
function openSheet(id) {
  const e = S.map.get(id);
  if (!e) return;
  const d = e.data;
  const mine = d.senderUid === S.me;
  S.sheetId = id;

  const emo = $('shEmojis');
  emo.replaceChildren();
  if (!d.deleted) {
    for (const x of EMOJIS) {
      const b = el('button', d.reactions?.[S.me] === x ? 'on' : null, x);
      b.onclick = () => { closeSheet(); toggleReaction(id, x); };
      emo.appendChild(b);
    }
  }

  const acts = $('shActions');
  acts.replaceChildren();
  const add = (icon, label, fn, danger) => {
    const b = el('button', danger ? 'danger' : null);
    b.append(el('i', 'fa-solid ' + icon), document.createTextNode(label));
    b.onclick = () => { closeSheet(); fn(); };
    acts.appendChild(b);
  };
  if (!d.deleted) add('fa-reply', 'رد', () => startReply(id));
  if (!d.deleted && d.text) add('fa-copy', 'نسخ', () => copyText(d.text));
  if (mine && !d.deleted && d.text && !d.attachment) add('fa-pen', 'تعديل', () => startEdit(id));
  if (mine && !d.deleted) add('fa-trash', 'حذف', () => deleteMsg(id), true);

  $('sheetBg').classList.add('open');
  $('sheet').classList.add('open');
}

function closeSheet() {
  $('sheetBg').classList.remove('open');
  $('sheet').classList.remove('open');
  S.sheetId = null;
}

/* ================= الأحداث ================= */
function bindEvents() {
  const input = $('input');

  // القائمة
  $('chatList').addEventListener('click', (e) => {
    const row = e.target.closest('.item');
    if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openRoomFor(row.dataset.id, row.dataset.uid);
  });

  $('results').addEventListener('click', (e) => {
    const row = e.target.closest('.item');
    if (!row) return;
    if (e.target.closest('[data-profile]')) { goProfile(row.dataset.uid); return; }
    openWith(row.dataset.uid);
  });

  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    S.tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === b));
    renderList();
  });

  $('search').addEventListener('input', () => {
    S.listQuery = $('search').value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(S.listQuery), 250);
    scheduleList();
  });

  // الغرفة
  $('backBtn').addEventListener('click', closeRoom);
  $('rav').addEventListener('click', () => goProfile(S.otherUid));
  $('rinfo').addEventListener('click', () => goProfile(S.otherUid));

  const thread = S.thread;
  thread.addEventListener('click', (e) => {
    if (e.target.closest('[data-profile]')) { goProfile(S.otherUid); return; }
    const q = e.target.closest('.quote');
    if (q) { e.stopPropagation(); scrollToMsg(q.dataset.jump); return; }
    if (e.target.closest('.att-img, .att-file')) { e.stopPropagation(); return; }
    const row = e.target.closest('.row');
    if (row && row.dataset.id) openSheet(row.dataset.id);
  });

  thread.addEventListener('scroll', () => {
    if (nearBottom() && S.newBelow) S.newBelow = 0;
    if (thread.scrollTop < 120) loadOlder();
    maybeMarkRead();
    updateJump();
  }, { passive: true });

  $('jump').addEventListener('click', () => {
    thread.scrollTop = thread.scrollHeight;
    S.newBelow = 0;
    updateJump();
    maybeMarkRead();
  });

  // الطلب
  $('acceptBtn').addEventListener('click', acceptRequest);
  $('blockBtn').addEventListener('click', blockRequest);

  // الكتابة
  $('send').addEventListener('click', onSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      onSend();
    }
  });
  input.addEventListener('input', () => { autoSize(); updateSendBtn(); });

  $('ctxClose').addEventListener('click', clearCtx);

  $('attach').addEventListener('click', () => {
    if (!canSend()) return;
    if (S.editingId) { showToast('لا يمكن إرفاق ملف أثناء التعديل'); return; }
    $('fileInput').click();
  });

  $('fileInput').addEventListener('change', () => {
    const f = $('fileInput').files[0];
    $('fileInput').value = '';
    if (!f) return;
    if (f.size > MAX_FILE) { showToast('الحد الأقصى لحجم الملف 10 ميغابايت'); return; }
    if (S.editingId || !canSend()) return;
    S.pendingFile = f;
    showChip(f);
    updateSendBtn();
  });

  $('fchipX').addEventListener('click', clearChip);

  // لوحة الخيارات
  $('sheetBg').addEventListener('click', closeSheet);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('sheet').classList.contains('open')) closeSheet();
    else if (S.editingId || S.reply) clearCtx();
  });
}

/* ================= التشغيل ================= */
function init() {
  S.thread = $('thread');
  S.intro = makeIntro();
  S.thread.appendChild(S.intro.root);
  bindEvents();

  onAuthStateChanged(auth, (user) => {
    if (!user) { location.href = LOGIN_PAGE; return; }
    if (S.me) return;
    S.me = user.uid;
    startList();
    renderList();
    const target = new URLSearchParams(location.search).get('uid');
    if (target && target !== S.me) openWith(target);
  });
}

init();
</script>
