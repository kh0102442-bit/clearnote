<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearNote — منصة المذاكرة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="brand">
      <div class="brand-name">CLEAR<span>NOTE</span></div>
      <div class="brand-sub">STUDY PLATFORM</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">دخول</button>
      <button class="auth-tab" data-tab="signup" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <!-- تسجيل الدخول -->
    <div id="loginForm" class="auth-form active">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
    </div>

    <!-- إنشاء حساب -->
    <div id="signupForm" class="auth-form">
      <label>الاسم</label>
      <input type="text" id="signupName" placeholder="اسمك الكامل" autocomplete="name">
      <label>البريد الإلكتروني</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
      <label>كلمة المرور (6 أحرف على الأقل)</label>
      <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password">
      <button class="btn-primary" id="signupBtn" onclick="doSignup()">إنشاء الحساب</button>
    </div>

    <div class="auth-foot">ClearNote · v1.0</div>
  </div>
</div>

<!-- ===== شاشة الترحيب (بعد الدخول) ===== -->
<div id="welcomeScreen" class="welcome-screen" style="display:none">
  <div class="welcome-box">
    <div class="brand" style="margin-bottom:20px">
      <div class="brand-name" style="color:#fff">CLEAR<span style="color:#c9a44a">NOTE</span></div>
    </div>
    <h2>أهلاً بك، <span id="welcomeName">—</span></h2>
    <p class="welcome-sub">تم تسجيل الدخول بنجاح.</p>
    <div class="welcome-info">
      <div class="info-row"><span>الدور:</span> <b id="welcomeRole">—</b></div>
      <div class="info-row"><span>البريد:</span> <b id="welcomeEmail">—</b></div>
    </div>
    <button class="btn-primary" onclick="doLogout()">تسجيل الخروج</button>
    <div class="auth-foot" style="color:rgba(255,255,255,.6);margin-top:20px">لوحة التحكم قيد الإنشاء…</div>
  </div>
</div>

<script type="module">
import {
  auth, db, ROLES,
  signIn, signUp, signOutUser,
  onAuth, getUserData, isAdmin, goTo, showToast
} from "./shared.js";

// ===== Tab switching =====
window.switchTab = function (tab) {
  document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".auth-form").forEach(f => f.classList.remove("active"));
  document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add("active");
  document.getElementById(tab + "Form").classList.add("active");
  setStatus("");
};

// ===== Status messages =====
function setStatus(msg, type = "err") {
  const el = document.getElementById("statusMsg");
  if (!el) return;
  el.className = "status-msg " + (msg ? type : "");
  el.textContent = msg || "";
}

// ===== Login =====
window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) { setStatus("أدخل البريد وكلمة المرور"); return; }

  btn.disabled = true; btn.textContent = "جاري الدخول…";
  setStatus("");

  try {
    await signIn(email, password);
    // onAuth() هيتولى الباقي
  } catch (err) {
    const map = {
      "auth/invalid-email": "البريد غير صالح",
      "auth/user-not-found": "لا يوجد حساب بهذا البريد",
      "auth/wrong-password": "كلمة المرور خطأ",
      "auth/invalid-credential": "بيانات الدخول غير صحيحة"
    };
    setStatus(map[err.code] || err.message);
    btn.disabled = false; btn.textContent = "دخول";
  }
};

// ===== Signup =====
window.doSignup = async function () {
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const btn = document.getElementById("signupBtn");

  if (!name || !email || !password) { setStatus("أدخل كل الحقول"); return; }
  if (password.length < 6) { setStatus("كلمة المرور 6 أحرف على الأقل"); return; }

  btn.disabled = true; btn.textContent = "جاري الإنشاء…";
  setStatus("");

  try {
    await signUp(email, password, name);
    setStatus("✅ تم إنشاء الحساب! جاري الدخول…", "ok");
    // onAuth() هيتولى الباقي
  } catch (err) {
    const map = {
      "auth/email-already-in-use": "البريد مستخدم بالفعل",
      "auth/invalid-email": "البريد غير صالح",
      "auth/weak-password": "كلمة المرور ضعيفة"
    };
    setStatus(map[err.code] || err.message);
    btn.disabled = false; btn.textContent = "إنشاء الحساب";
  }
};

// ===== Logout =====
window.doLogout = async function () {
  await signOutUser();
  showToast("تم تسجيل الخروج");
};

// ===== Auth state listener =====
onAuth(async (user, userData) => {
  const authScreen = document.getElementById("authScreen");
  const welcomeScreen = document.getElementById("welcomeScreen");

  if (!user) {
    authScreen.style.display = "flex";
    welcomeScreen.style.display = "none";
    const lb = document.getElementById("loginBtn");
    const sb = document.getElementById("signupBtn");
    if (lb) { lb.disabled = false; lb.textContent = "دخول"; }
    if (sb) { sb.disabled = false; sb.textContent = "إنشاء الحساب"; }
    return;
  }

  authScreen.style.display = "none";
  welcomeScreen.style.display = "flex";
  document.getElementById("welcomeName").textContent = userData?.name || user.email;
  document.getElementById("welcomeEmail").textContent = user.email;
  document.getElementById("welcomeRole").textContent =
    isAdmin(userData) ? "أدمن" : "طالب";
});
</script>

</body>
</html>
