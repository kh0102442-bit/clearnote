<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearNote — إعداد الأدمن</title>
<link rel="stylesheet" href="styles.css">
<style>
  .setup-box {
    max-width: 460px; margin: 80px auto; background: #fff;
    border: 1px solid #c7cbd1; border-radius: 8px; padding: 32px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  .setup-box h1 {
    font-family: Georgia, serif; color: #152741; margin: 0 0 8px;
    font-size: 22px; border-bottom: 2px solid #152741; padding-bottom: 10px;
  }
  .setup-box .warn {
    background: #fbeaea; border-left: 3px solid #8b1f1f;
    padding: 10px 14px; color: #8b1f1f; font-size: 13px;
    margin-bottom: 22px; line-height: 1.6;
  }
  .setup-box label { display: block; font-size: 13px; color: #152741; font-weight: 600; margin-bottom: 6px; }
  .setup-box input {
    width: 100%; padding: 10px 12px; border: 1px solid #c7cbd1;
    border-radius: 4px; font-size: 14px; font-family: inherit;
    margin-bottom: 14px; box-sizing: border-box;
  }
  .setup-box input:focus { outline: none; border-color: #152741; }
  .setup-box button {
    width: 100%; padding: 12px; background: #152741; color: #fff;
    border: none; border-radius: 4px; font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  .setup-box button:hover { background: #0f1e33; }
  .setup-box button:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; font-size: 13px; text-align: center; min-height: 20px; }
  .status.ok { color: #1f6b45; }
  .status.err { color: #b91c1c; }
</style>
</head>
<body style="background:#f4f6f8;margin:0;">

<div class="setup-box">
  <h1>إعداد حساب الأدمن</h1>
  <div class="warn">
    ⚠️ استخدم هذه الصفحة <b>مرة واحدة فقط</b> لتحويل حسابك إلى أدمن.<br>
    بعد نجاح العملية، <b>احذف هذا الملف</b> من الـ repo فوراً.
  </div>

  <label>البريد الإلكتروني</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

  <label>كلمة المرور (6 أحرف على الأقل)</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">

  <label>الاسم (اختياري)</label>
  <input type="text" id="name" placeholder="اسمك الكامل">

  <button id="btn" onclick="setupAdmin()">إنشاء حساب أدمن</button>
  <div class="status" id="status"></div>
</div>

<script type="module">
import { signUp, getUserData, updateUserData, goTo, showToast } from "./shared.js";
import { ROLES } from "./shared.js";

window.setupAdmin = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value.trim();
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");

  if (!email || !password) {
    status.className = "status err";
    status.textContent = "أدخل البريد وكلمة المرور";
    return;
  }
  if (password.length < 6) {
    status.className = "status err";
    status.textContent = "كلمة المرور 6 أحرف على الأقل";
    return;
  }

  btn.disabled = true;
  btn.textContent = "جاري الإنشاء…";
  status.textContent = "";

  try {
    const user = await signUp(email, password, name);
    await updateUserData(user.uid, { role: ROLES.ADMIN });
    const updated = await getUserData(user.uid);

    if (updated.role === ROLES.ADMIN) {
      status.className = "status ok";
      status.innerHTML = "✅ تم إنشاء حساب الأدمن بنجاح.<br>جاري التحويل…";
      showToast("تم إنشاء حساب الأدمن");
      setTimeout(() => goTo("index.html"), 1800);
    } else {
      throw new Error("role update failed");
    }
  } catch (err) {
    const map = {
      "auth/email-already-in-use": "البريد مستخدم بالفعل — جرّب تسجيل الدخول بدلاً من الإنشاء",
      "auth/invalid-email": "البريد غير صالح",
      "auth/weak-password": "كلمة المرور ضعيفة"
    };
    status.className = "status err";
    status.textContent = map[err.code] || ("خطأ: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "إنشاء حساب أدمن";
  }
};
</script>

</body>
</html>
